<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StockLab 台股投資分析器</title><style>
:root{--bg:#0b1020;--card:#131a2c;--line:#26314b;--txt:#eef3ff;--muted:#9aa8c7;--accent:#7dd3fc;--green:#34d399;--yellow:#fbbf24;--red:#fb7185}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#09101e,#0d1324);color:var(--txt);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}.wrap{max-width:860px;margin:auto;padding:20px}.hero{padding:18px 0 8px}.hero h1{margin:0 0 6px;font-size:28px}.hero p{margin:0;color:var(--muted);line-height:1.6}.card{background:rgba(19,26,44,.94);border:1px solid var(--line);border-radius:18px;padding:16px;margin:14px 0;box-shadow:0 12px 30px #0003}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:640px){.grid{grid-template-columns:1fr}}label{font-size:13px;color:var(--muted)}input,select,button{width:100%;border-radius:12px;border:1px solid var(--line);padding:13px;font-size:16px}input,select{background:#0d1425;color:white;margin-top:6px}button{background:linear-gradient(90deg,#38bdf8,#818cf8);color:#08111f;font-weight:800;cursor:pointer;border:0}.ghost{background:#192237;color:#dbeafe;border:1px solid var(--line)}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px}.score{display:flex;align-items:center;gap:14px}.bubble{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;font-size:24px;font-weight:900;background:#0d1425;border:7px solid var(--accent)}.tag{display:inline-block;padding:5px 9px;border-radius:999px;background:#1e293b;color:#cbd5e1;font-size:12px;margin:3px 4px 3px 0}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}@media(max-width:640px){.kpis{grid-template-columns:repeat(2,1fr)}}.kpi{background:#0d1425;padding:12px;border-radius:12px}.kpi b{font-size:18px;display:block}.kpi span{font-size:12px;color:var(--muted)}.reason{line-height:1.7;color:#dbe4f8}.ok{color:var(--green)}.warn{color:var(--yellow)}.bad{color:var(--red)}.muted{color:var(--muted);font-size:13px}.hidden{display:none}.toprow{display:flex;justify-content:space-between;gap:10px;align-items:center}.list{display:grid;gap:10px}.item{background:#0d1425;border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center}.rank{font-weight:900;font-size:20px}.mini{font-size:12px;color:var(--muted)}.price{font-weight:900}.foot{font-size:12px;color:var(--muted);line-height:1.6;padding:12px 4px 28px}.loader{padding:18px;text-align:center;color:var(--accent)}.sourcebox{background:#0a1222;border:1px solid #27415d;border-radius:14px;padding:12px;margin-top:14px}.sourcegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.sourceitem{background:#0d1729;border-radius:10px;padding:10px;font-size:13px}.sourceitem b{display:block;margin-bottom:4px}@media(max-width:640px){.sourcegrid{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><section class="hero"><h1>StockLab 台股投資分析器</h1><p>先看市場，再看個股。以趨勢、成交量、均線、支撐壓力為核心，依持有期間產生不同判斷。Beta 版僅供研究，不構成投資建議。</p></section>
<section class="card"><div class="tabs"><button id="findBtn">不知道買什麼｜TOP 10</button><button id="singleBtn" class="ghost">我已有股票｜單股分析</button></div></section>
<section id="singlePanel" class="card hidden"><div class="grid"><div><label>股票代號（上市，例如 2454）<input id="ticker" inputmode="numeric" placeholder="2454"></label></div><div><label>投資目的<select id="horizon"><option value="day">當沖｜今天</option><option value="1m" selected>短線｜約 1 個月</option><option value="3m">波段｜約 3 個月</option><option value="long">長期｜1 年以上</option></select></label></div></div><div style="height:12px"></div><button id="analyzeBtn">開始分析</button><div id="singleLoad" class="loader hidden">正在讀取交易所資料並計算…</div></section>
<section id="result" class="card hidden"></section>
<section id="findPanel" class="card"><div class="grid"><div><label>選股目的<select id="scanHorizon"><option value="1m" selected>短線｜約 1 個月</option><option value="3m">波段｜約 3 個月</option><option value="long">長期｜1 年以上</option></select></label></div><div><label>篩選範圍<select><option>上市股票（Beta）</option></select></label></div></div><p class="muted">流程：先從全市場以成交值與流動性做初篩，再對候選股讀取歷史價格，套用趨勢／量價／均線／支撐壓力評分。</p><button id="scanBtn">找出目前值得研究的 10 檔</button><div id="scanLoad" class="loader hidden">正在掃描市場；第一次可能較慢…</div></section>
<section id="top10" class="card hidden"></section>
<div class="foot">資料來源：臺灣證券交易所公開資料。技術分數是規則化研究工具，不代表未來報酬；新聞、國際事件、法人籌碼與完整財務面尚未納入 Beta 分數，畫面會明確標示。當沖模式目前僅提供日線方向，不替代分K／即時委託簿。</div></main>
<script>
const $=s=>document.querySelector(s);const api='https://www.twse.com.tw/rwd/zh/afterTrading/STOCK_DAY';
const SOURCE_POLICY={allowedHosts:['www.twse.com.tw','openapi.twse.com.tw'],primary:'臺灣證券交易所 TWSE',rule:'未通過來源、日期與一致性驗證，不產生投資結論'};
function assertOfficial(url){const h=new URL(url).hostname;if(!SOURCE_POLICY.allowedHosts.includes(h))throw Error('來源驗證失敗：非核准官方資料來源');return h}
function rocToISO(s){if(!s)return null;const m=String(s).match(/(\d{2,3})\/(\d{2})\/(\d{2})/);if(!m)return null;return `${Number(m[1])+1911}-${m[2]}-${m[3]}`}
function daysOld(iso){if(!iso)return 999;const a=new Date(iso+'T00:00:00+08:00');return Math.floor((Date.now()-a.getTime())/86400000)}
function sourceHTML(v){return `<div class="sourcebox"><b>資料來源驗證</b><div class="sourcegrid"><div class="sourceitem"><b class="${v.host?'ok':'bad'}">${v.host?'✅ 官方來源':'❌ 來源未驗證'}</b>${v.host||'—'}</div><div class="sourceitem"><b class="${v.fresh?'ok':'warn'}">${v.fresh?'✅ 日期有效':'⚠️ 日期過舊'}</b>${v.dataDate||'—'}</div><div class="sourceitem"><b class="${v.match?'ok':'bad'}">${v.match?'✅ 交叉比對一致':'❌ 價格衝突'}</b>${v.matchText||'—'}</div><div class="sourceitem"><b>${v.complete?'✅ 可計算':'⛔ 禁止產生結論'}</b>${SOURCE_POLICY.rule}</div></div></div>`}
$('#singleBtn').onclick=()=>{$('#singlePanel').classList.remove('hidden');$('#findPanel').classList.add('hidden')};$('#findBtn').onclick=()=>{$('#findPanel').classList.remove('hidden');$('#singlePanel').classList.add('hidden')};
function n(v){const x=Number(String(v??'').replace(/,/g,''));return Number.isFinite(x)?x:null}function avg(a){const v=a.filter(Number.isFinite);return v.length?v.reduce((x,y)=>x+y,0)/v.length:null}function ma(rows,k){return avg(rows.slice(-k).map(x=>x.c))}function pct(a,b){return a&&b?(a/b-1)*100:0}
function monthList(count){const d=new Date(),out=[];for(let i=0;i<count;i++){const x=new Date(d.getFullYear(),d.getMonth()-i,1);out.push(`${x.getFullYear()}${String(x.getMonth()+1).padStart(2,'0')}01`)}return out}
async function fetchMonth(code,date){const u=`${api}?date=${date}&stockNo=${code}&response=json`;assertOfficial(u);const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error('交易所連線失敗');const j=await r.json();if(j.stat!=='OK'||!j.data)return[];return j.data.map(x=>({d:x[0],iso:rocToISO(x[0]),v:n(x[1]),o:n(x[3]),h:n(x[4]),l:n(x[5]),c:n(x[6])})).filter(x=>x.c)}
async function history(code,months=12){const chunks=await Promise.all(monthList(months).map(d=>fetchMonth(code,d).catch(()=>[])));const m=new Map();chunks.flat().forEach(r=>m.set(r.d,r));return [...m.values()].sort((a,b)=>a.d.localeCompare(b.d))}
function analyze(rows,h){if(rows.length<20)throw Error('歷史資料不足，可能不是上市股票或交易所暫時無資料');const last=rows.at(-1), prev=rows.at(-2),m5=ma(rows,5),m20=ma(rows,20),m60=ma(rows,60),m120=ma(rows,120),m240=ma(rows,240);const v20=avg(rows.slice(-20).map(x=>x.v));const volRatio=last.v&&v20?last.v/v20:null;const hi20=Math.max(...rows.slice(-20).map(x=>x.h)),lo20=Math.min(...rows.slice(-20).map(x=>x.l));const hi60=Math.max(...rows.slice(-60).map(x=>x.h)),lo60=Math.min(...rows.slice(-60).map(x=>x.l));let s=50,reasons=[];
const ref=h==='day'?m5:h==='1m'?m20:h==='3m'?m60:(m120||m60);if(last.c>ref){s+=12;reasons.push('價格站在主要均線之上，趨勢偏多');}else{s-=12;reasons.push('價格位於主要均線之下，趨勢仍需確認');}
if(m20&&m60){if(m20>m60){s+=9;reasons.push('20 日均線高於 60 日均線，中期結構較強');}else{s-=8;reasons.push('20 日均線低於 60 日均線，中期結構偏弱');}}
if(volRatio){if(last.c>prev.c&&volRatio>1.2){s+=10;reasons.push('上漲伴隨量能放大，買盤確認度較高');}else if(last.c<prev.c&&volRatio>1.3){s-=10;reasons.push('下跌同時爆量，需防籌碼鬆動');}else reasons.push('成交量未出現極端放大，量價訊號中性');}
const support=h==='1m'?lo20:lo60,resist=h==='1m'?hi20:hi60;const room=pct(resist,last.c),risk=Math.abs(pct(support,last.c));if(room>risk*1.4){s+=8;reasons.push('距離壓力仍有空間，風險報酬相對合理');}else{s-=5;reasons.push('目前接近壓力區，追價風險提高');}
if(m240&&last.c>m240)s+=6;if(h==='long'&&m120&&last.c>m120)s+=5;s=Math.max(0,Math.min(100,Math.round(s)));let action=s>=75?'偏多｜等拉回可分批':s>=60?'觀察｜不追價':s>=45?'中性｜等待確認':'偏弱｜暫避';const entryLow=Math.max(support,last.c*(h==='day'?.985:h==='1m'?.96:h==='3m'?.92:.88));const entryHigh=last.c*(h==='day'?.997:h==='1m'?.985:h==='3m'?.97:.95);return{last,prev,m5,m20,m60,m120,m240,volRatio,support,resist,score:s,action,reasons,entryLow,entryHigh,room,risk};}
function f(x){return x?Number(x).toLocaleString('zh-TW',{maximumFractionDigits:2}):'—'}
function render(code,a,h,verify){const c=a.score>=75?'ok':a.score>=60?'warn':'bad';if(!verify.complete){$('#result').innerHTML=`<h3 class="bad">⛔ 資料驗證未通過</h3>${sourceHTML(verify)}<p class="muted">為避免錯誤行情造成錯誤買點，本次不產生評分與進場區間。</p>`;$('#result').classList.remove('hidden');return;}$('#result').innerHTML=`<div class="toprow"><div><div class="muted">${code}｜${horizonName(h)}</div><h2 style="margin:4px 0">${a.action}</h2></div><div class="bubble">${a.score}</div></div><div class="kpis"><div class="kpi"><b>${f(a.last.c)}</b><span>最新收盤</span></div><div class="kpi"><b>${f(a.entryLow)}–${f(a.entryHigh)}</b><span>參考進場區</span></div><div class="kpi"><b>${f(a.support)}</b><span>支撐</span></div><div class="kpi"><b>${f(a.resist)}</b><span>壓力</span></div></div>${sourceHTML(verify)}<h3>進場理由</h3><div class="reason">${a.reasons.map(x=>'• '+x).join('<br>')}</div><h3>目前計算項目</h3><span class="tag">趨勢</span><span class="tag">成交量</span><span class="tag">5/20/60/120/240MA</span><span class="tag">支撐壓力</span><h3>尚未納入 Beta 分數</h3><span class="tag">法人籌碼</span><span class="tag">MACD</span><span class="tag">RSI / KD</span><span class="tag">完整基本面</span><span class="tag">美股 / SOX</span><span class="tag">國際事件</span><p class="muted">進場價格是依近期支撐與持有期間計算的區間，不是保證成交或目標價。任何未驗證資料不進入計算。</p>`;$('#result').classList.remove('hidden')}
async function verifyHistory(code,rows){const last=rows.at(-1);const url='https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL';assertOfficial(url);let snap=[];try{const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error();snap=await r.json()}catch{throw Error('官方交叉驗證來源目前無法取得')}const x=snap.find(z=>String(z.Code)===String(code));const snapClose=x?n(x.ClosingPrice):null;const match=!!(x&&snapClose&&Math.abs(snapClose-last.c)<0.001);const age=daysOld(last.iso);const fresh=age<=4;return{host:'www.twse.com.tw + openapi.twse.com.tw',dataDate:last.iso,fresh,match,matchText:x?`歷史收盤 ${f(last.c)} / 全市場快照 ${f(snapClose)}`:'全市場快照找不到此代號',complete:match&&fresh}}
function horizonName(h){return({day:'當沖', '1m':'約1個月','3m':'約3個月',long:'1年以上'})[h]}
$('#analyzeBtn').onclick=async()=>{const code=$('#ticker').value.trim(),h=$('#horizon').value;if(!/^\d{4,6}$/.test(code))return alert('請輸入股票代號，例如 2454');$('#singleLoad').classList.remove('hidden');$('#result').classList.add('hidden');try{const rows=await history(code,h==='long'?12:6);const verify=await verifyHistory(code,rows);render(code,analyze(rows,h),h,verify)}catch(e){$('#result').innerHTML=`<h3 class="bad">目前無法完成分析</h3><p>${e.message}</p><p class="muted">未通過來源驗證時，系統不會產生買進價格。Beta 版目前優先支援臺灣證券交易所上市股票。</p>`;$('#result').classList.remove('hidden')}finally{$('#singleLoad').classList.add('hidden')}};
async function snapshot(){const u='https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL';assertOfficial(u);const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error('無法取得全市場官方資料');return await r.json()}
$('#scanBtn').onclick=async()=>{const h=$('#scanHorizon').value;$('#scanLoad').classList.remove('hidden');$('#top10').classList.add('hidden');try{let all=await snapshot();let cand=all.map(x=>({code:x.Code,name:x.Name,c:n(x.ClosingPrice),v:n(x.TradeValue),chg:n(x.Change)})).filter(x=>/^\d{4}$/.test(x.code)&&x.c&&x.v).sort((a,b)=>b.v-a.v).slice(0,18);let out=[];for(const x of cand){try{let rows=await history(x.code,h==='long'?10:5);let a=analyze(rows,h);const last=rows.at(-1);const fresh=daysOld(last.iso)<=4;const match=Math.abs(last.c-x.c)<0.001;if(!fresh||!match)continue;out.push({...x,...a,verified:true,dataDate:last.iso})}catch{}}out.sort((a,b)=>b.score-a.score);out=out.slice(0,10);$('#top10').innerHTML=`<h2>值得優先研究 TOP 10</h2><p class="muted">只保留已通過 TWSE 官方來源、日期與收盤價交叉驗證的股票，再套用技術規則；不是「保證上漲排行榜」。</p><div class="list">${out.map((x,i)=>`<div class="item"><div class="rank">#${i+1}</div><div><b>${x.code} ${x.name}</b><div class="mini">✅ Verified ${x.dataDate}｜${x.action}｜支撐 ${f(x.support)}｜壓力 ${f(x.resist)}</div></div><div class="price">${x.score}分<br><span class="mini">${f(x.c)}</span></div></div>`).join('')}</div><p class="muted">目前 TOP 10 尚未納入財報、法人、美股與新聞事件；下一版會把這些列為市場層與基本面層，重新計權。</p>`;$('#top10').classList.remove('hidden')}catch(e){$('#top10').innerHTML=`<h3 class="bad">掃描失敗</h3><p>${e.message}</p>`;$('#top10').classList.remove('hidden')}finally{$('#scanLoad').classList.add('hidden')}};
</script></body></html>
