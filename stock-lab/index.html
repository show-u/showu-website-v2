<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StockLab 台股投資分析器</title><style>:root{--bg:#0b1020;--card:#131a2c;--line:#26314b;--txt:#eef3ff;--muted:#9aa8c7;--accent:#7dd3fc;--green:#34d399;--yellow:#fbbf24;--red:#fb7185}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#09101e,#0d1324);color:var(--txt);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}.wrap{max-width:860px;margin:auto;padding:20px}.hero{padding:18px 0 8px}.hero h1{margin:0 0 6px;font-size:28px}.hero p,.muted{color:var(--muted);line-height:1.6}.card{background:rgba(19,26,44,.94);border:1px solid var(--line);border-radius:18px;padding:16px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:640px){.grid{grid-template-columns:1fr}}label{font-size:13px;color:var(--muted)}input,select,button{width:100%;border-radius:12px;border:1px solid var(--line);padding:13px;font-size:16px}input,select{background:#0d1425;color:white;margin-top:6px}button{background:linear-gradient(90deg,#38bdf8,#818cf8);color:#08111f;font-weight:800;border:0}.ghost{background:#192237;color:#dbeafe}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hidden{display:none}.toprow{display:flex;justify-content:space-between;gap:10px;align-items:center}.bubble{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;font-size:24px;font-weight:900;background:#0d1425;border:7px solid var(--accent)}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}@media(max-width:640px){.kpis{grid-template-columns:repeat(2,1fr)}}.kpi,.sourceitem{background:#0d1425;padding:12px;border-radius:12px}.kpi b{font-size:18px;display:block}.kpi span,.mini{font-size:12px;color:var(--muted)}.sourcegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}@media(max-width:640px){.sourcegrid{grid-template-columns:1fr}}.sourceitem b{display:block;margin-bottom:4px}.list{display:grid;gap:10px}.item{background:#0d1425;border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center}.rank{font-weight:900;font-size:20px}.price{font-weight:900}.reason{line-height:1.7;color:#dbe4f8}.bad{color:var(--red)}.loader{text-align:center;padding:18px;color:var(--accent)}.foot{font-size:12px;color:var(--muted);line-height:1.6;padding:12px 4px 28px}</style></head><body><main class="wrap"><section class="hero"><h1>StockLab 台股投資分析器</h1><p>先驗證資料，再看市場，再看個股。Beta 版僅供研究，不構成投資建議。</p></section><section id="marketCard" class="card"><div class="toprow"><div><div class="muted">第 0 層｜市場環境</div><h2>台股大盤狀態</h2></div><div class="bubble" id="marketScore">—</div></div><div id="marketBody" class="muted">執行分析後顯示。</div></section><section class="card"><div class="tabs"><button id="findBtn">不知道買什麼｜TOP 10</button><button id="singleBtn" class="ghost">我已有股票｜單股分析</button></div></section><section id="singlePanel" class="card hidden"><div class="grid"><label>股票代號<input id="ticker" inputmode="numeric" placeholder="2454"></label><label>投資目的<select id="horizon"><option value="day">當沖｜今天</option><option value="1m" selected>短線｜約1個月</option><option value="3m">波段｜約3個月</option><option value="long">長期｜1年以上</option></select></label></div><div style="height:12px"></div><button id="analyzeBtn">開始分析</button><div id="singleLoad" class="loader hidden">正在讀取官方資料並計算…</div></section><section id="result" class="card hidden"></section><section id="findPanel" class="card"><label>選股目的<select id="scanHorizon"><option value="1m" selected>短線｜約1個月</option><option value="3m">波段｜約3個月</option><option value="long">長期｜1年以上</option></select></label><p class="muted">從上市股票先做流動性初篩，再套用技術面、大盤、三大法人、估值與最新月營收。</p><button id="scanBtn">找出值得研究的 10 檔</button><div id="scanLoad" class="loader hidden">正在掃描官方資料…</div></section><section id="top10" class="card hidden"></section><div class="foot">官方來源：TWSE／MOPS OpenAPI。未通過來源、日期與交叉驗證的資料不補值、不計分。季報、美股／SOX／VIX、台指期與國際重大事件尚未納入正式分數。</div></main><script src="./app.js"></script></body></html>
