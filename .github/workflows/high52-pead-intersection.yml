name: HIGH52 PEAD intersection validation
on:
  push:
    branches: [main]
    paths:
      - 'stock-api/research/high52-pead-intersection.js'
      - '.github/workflows/high52-pead-intersection.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node stock-api/research/high52-pead-intersection.js
