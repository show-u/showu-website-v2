name: Taiwan active revenue coverage
on:
 push:
  branches: [main]
  paths: ['stock-api/research/taiwan-active-revenue-coverage.js','.github/workflows/taiwan-active-revenue-coverage.yml']
jobs:
 run:
  runs-on: ubuntu-latest
  timeout-minutes: 60
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-node@v4
     with: {node-version: '20'}
   - run: node stock-api/research/taiwan-active-revenue-coverage.js
