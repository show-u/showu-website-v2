name: Revenue PEAD multifactor independent replication
on:
  push:
    branches: [main]
    paths:
      - 'stock-api/research/revenue-pead-multifactor-independent-replication.js'
      - '.github/workflows/revenue-pead-multifactor-independent-replication.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node stock-api/research/revenue-pead-multifactor-independent-replication.js
