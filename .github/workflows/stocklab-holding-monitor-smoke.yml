name: StockLab holding monitor smoke

on:
  push:
    paths:
      - 'stock-lab/holding-router.js'
      - 'stock-lab/holding-model.js'
      - 'stock-lab/health.js'
      - 'stock-lab/position-input.js'
      - 'stock-lab/index.html'
      - 'stock-lab/market-facts.json'
      - 'stock-lab/same-origin-cache.js'
      - 'stock-lab/history-ogdl/manifest.json'
      - '.github/workflows/stocklab-holding-monitor-smoke.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check stock-lab/holding-router.js
          node --check stock-lab/holding-model.js
          node --check stock-lab/health.js
          node --check stock-lab/position-input.js
      - name: Truth and usability invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          idx=Path('stock-lab/index.html').read_text(encoding='utf-8')
          router=Path('stock-lab/holding-router.js').read_text(encoding='utf-8')
          model=Path('stock-lab/holding-model.js').read_text(encoding='utf-8')
          health=Path('stock-lab/health.js').read_text(encoding='utf-8')
          assert not Path('stock-lab/holding-usable.js').exists(), 'obsolete holding-usable.js returned'
          assert 'holding-usable.js' not in idx+health, 'obsolete holding override still loaded'
          for s in ('已持有','分析出場時機','目前成本均價','目前持有股數','目前部位總成本','首次買入時間'):
              assert s in idx,s
          assert 'model.analyze(p,hb.bars' in router
          assert "model:'TW-holding-rule-v1'" in model
          assert "validation:'RULE_BASED'" in model
          assert '這不是 OOS 鎖定模型' in router
          assert '不得顯示勝率、成功率、機率或校準信心指數' in model
          assert '缺少的資料維持缺少，不以假資料補值' in router
          assert '非盤中即時價' in router
          assert 'StockLabSameOrigin' in router
          assert 'browser-data.json' not in router
          print('holding rule-based smoke passed; obsolete OOS-locked monitor absent')
          PY
