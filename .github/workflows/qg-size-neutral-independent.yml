name: QG size-neutral independent validation
on:
  push:
    branches: [main]
    paths:
      - 'stock-api/research/qg-size-neutral-independent.js'
      - '.github/workflows/qg-size-neutral-independent.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node stock-api/research/qg-size-neutral-independent.js
