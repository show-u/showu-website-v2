name: Update StockLab Taiwan factors

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-taiwan-factors.yml'
  schedule:
    - cron: '10 12 * * 1-5'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build derived Taiwan factors
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.parse, re, time
          from datetime import datetime, timezone
          UA={'User-Agent':'StockLab-Taiwan-Factors/2.0','Accept':'application/json,text/html;q=0.8'}
          def fetch_json(url,required=True):
            err=None
            for i in range(4):
              try:
                req=urllib.request.Request(url,headers=UA)
                with urllib.request.urlopen(req,timeout=60) as r:
                  return json.loads(r.read().decode('utf-8'))
              except Exception as e:
                err=e; time.sleep(i+1)
            if required: raise RuntimeError(f'{url}: {err}')
            return None
          def val(o,keys):
            for k in keys:
              if isinstance(o,dict) and k in o and str(o[k]).strip()!='': return o[k]
            return None
          def num(v):
            try:return float(str(v).replace(',','').replace('%',''))
            except:return None
          def rows_any(x):
            if isinstance(x,list): return x
            if not isinstance(x,dict): return []
            for k in ('data','aaData','rows'):
              if isinstance(x.get(k),list): return x[k]
            for v in x.values():
              z=rows_any(v)
              if z:return z
            return []
          def code_of(x):
            if isinstance(x,dict): return str(val(x,['公司代號','證券代號','SecuritiesCompanyCode','Code','股票代號']) or '').strip()
            if isinstance(x,list):
              for s in x:
                s=str(s).strip()
                if re.fullmatch(r'\d{4}',s): return s
            return ''
          stocks={}
          # Official MOPS/TWSE/TPEx company profile datasets. These are used only to retain code -> industry, not raw rows.
          profile_urls=[
            ('TWSE','https://openapi.twse.com.tw/v1/opendata/t187ap03_L'),
            ('TPEx','https://www.tpex.org.tw/openapi/v1/mopsfin_t187ap03_O')]
          profile_status={}
          for market,url in profile_urls:
            data=fetch_json(url,required=False); profile_status[market]=bool(isinstance(data,list) and data)
            for x in data or []:
              c=code_of(x)
              if not re.fullmatch(r'\d{4}',c): continue
              ind=str(val(x,['產業別','產業類別','Industry','IndustryName','產業別名稱']) or '').strip()
              stocks.setdefault(c,{})['market']=market
              if ind: stocks[c]['industry']=ind
          # TWSE margin balances: public report; keep only derived day-over-day balance change.
          twm=fetch_json('https://www.twse.com.tw/rwd/zh/marginTrading/MI_MARGN?response=json&selectType=ALL',required=False)
          for row in rows_any(twm):
            if not isinstance(row,list): continue
            c=code_of(row)
            if not c: continue
            nums=[num(x) for x in row]
            clean=[x for x in nums if x is not None]
            # Detailed rows normally expose prior/current financing balances; use the last plausible pair conservatively.
            if len(clean)>=8:
              prior,cur=clean[-8],clean[-4] if len(clean)>=12 else clean[-1]
              if prior and cur is not None and prior>0:
                stocks.setdefault(c,{})['margin_change_pct']=round((cur/prior-1)*100,3)
          # TPEx OpenAPI margin balances (public OpenAPI).
          tpm=fetch_json('https://www.tpex.org.tw/openapi/v1/tpex_mainboard_margin_balance',required=False)
          for x in tpm or []:
            c=code_of(x)
            if not c: continue
            prev=num(val(x,['PreviousBalanceOfMarginPurchase','PreviousMarginPurchaseBalance','前日融資餘額','昨日融資餘額']))
            cur=num(val(x,['BalanceOfMarginPurchase','MarginPurchaseBalance','融資餘額','今日融資餘額','本日融資餘額']))
            if prev and cur is not None: stocks.setdefault(c,{})['margin_change_pct']=round((cur/prev-1)*100,3)
            note=str(val(x,['Note','備註']) or '')
            if any(k in note for k in ('O','X','!','D')): stocks.setdefault(c,{})['margin_suspended']=True
          # TWSE current attention/disposition reports. Store flags only.
          notice=fetch_json('https://www.twse.com.tw/rwd/zh/announcement/notice?response=json',required=False)
          for row in rows_any(notice):
            c=code_of(row)
            if c: stocks.setdefault(c,{})['attention']=True
          punish=fetch_json('https://www.twse.com.tw/rwd/zh/announcement/punish?response=json',required=False)
          for row in rows_any(punish):
            c=code_of(row)
            if c: stocks.setdefault(c,{})['disposition']=True
          # TPEx current attention/disposition via official OpenAPI.
          for endpoint,key in [('tpex_trading_warning_information','attention'),('tpex_disposal_information','disposition')]:
            data=fetch_json('https://www.tpex.org.tw/openapi/v1/'+endpoint,required=False)
            for x in data or []:
              c=code_of(x)
              if c: stocks.setdefault(c,{})[key]=True
          # OTC market environment from official TPEx daily trading index.
          otc=fetch_json('https://www.tpex.org.tw/openapi/v1/tpex_daily_trading_index',required=False)
          market={'otc_state':'unavailable'}
          if isinstance(otc,list) and otc:
            x=otc[0]
            ch=num(val(x,['Change','ChangePercent','漲跌','漲跌幅','漲跌百分比']))
            close=num(val(x,['Close','ClosingIndex','收盤指數','指數']))
            market={'otc_state':('偏多' if ch is not None and ch>0.5 else '偏空' if ch is not None and ch<-0.5 else '震盪') if ch is not None else '已取得', 'otc_change':ch,'otc_close':close}
          out={'schema_version':1,'generated_at':datetime.now(timezone.utc).isoformat(),'source':'official-derived','profile_status':profile_status,'market':market,'stocks':stocks}
          with open('stock-lab/taiwan-factors.json','w',encoding='utf-8') as f: json.dump(out,f,ensure_ascii=False,separators=(',',':'))
          print('stocks',len(stocks),'profiles',profile_status,'market',market)
          PY
      - name: Validate derived factor file
        run: |
          python - <<'PY'
          import json
          x=json.load(open('stock-lab/taiwan-factors.json',encoding='utf-8'))
          assert x['schema_version']==1 and x['source']=='official-derived'
          assert isinstance(x['stocks'],dict) and len(x['stocks'])>=100
          assert isinstance(x['market'],dict)
          print('Taiwan factor file valid:',len(x['stocks']))
          PY
      - name: Commit factor file
        run: |
          if [ -z "$(git status --porcelain -- stock-lab/taiwan-factors.json)" ]; then echo 'No changes'; exit 0; fi
          git config user.name 'stocklab-bot'
          git config user.email 'stocklab-bot@users.noreply.github.com'
          git add stock-lab/taiwan-factors.json
          git commit -m 'update derived Taiwan market factors'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
