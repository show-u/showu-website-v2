name: Update StockLab Taiwan factors

# Taiwan factor pipeline: official industry, per-stock margin/short changes,
# warning/disposition flags and OTC regime. Fail closed when core coverage is absent.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-taiwan-factors.yml'
  schedule:
    - cron: '10 12 * * 1-5'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build derived Taiwan factors
        run: |
          python - <<'PY'
          import json,re,time,urllib.request
          from datetime import datetime,timezone

          UA={'User-Agent':'StockLab-Taiwan-Factors/4.0','Accept':'application/json'}
          def get(url,required=False):
            err=None
            for i in range(4):
              try:
                req=urllib.request.Request(url,headers=UA)
                with urllib.request.urlopen(req,timeout=60) as r:
                  return json.loads(r.read().decode('utf-8-sig'))
              except Exception as e:
                err=e;time.sleep(i+1)
            if required: raise RuntimeError(f'{url}: {err}')
            return None

          def num(v):
            try:return float(str(v).replace(',','').replace('%','').strip())
            except:return None

          def val(o,keys):
            for k in keys:
              if isinstance(o,dict) and k in o and str(o[k]).strip()!='':return o[k]
            return None

          def code(o):
            if not isinstance(o,dict):return ''
            return str(val(o,['公司代號','證券代號','股票代號','SecuritiesCompanyCode','Code']) or '').strip()

          def change(prev,cur):
            return round((cur/prev-1)*100,3) if prev not in (None,0) and cur is not None else None

          def credit_values(o,side):
            # First use known official field labels. Then use a conservative semantic fallback.
            if side=='margin':
              prev_keys=['融資前日餘額','前日融資餘額','昨日融資餘額','PreviousBalanceOfMarginPurchase','PreviousMarginPurchaseBalance','MarginPurchasePreviousBalance']
              cur_keys=['融資今日餘額','今日融資餘額','本日融資餘額','BalanceOfMarginPurchase','MarginPurchaseBalance','MarginPurchaseTodayBalance']
              zh='融資';en=('margin','purchase')
            else:
              prev_keys=['融券前日餘額','前日融券餘額','昨日融券餘額','PreviousBalanceOfShortSale','PreviousShortSaleBalance','ShortSalePreviousBalance']
              cur_keys=['融券今日餘額','今日融券餘額','本日融券餘額','BalanceOfShortSale','ShortSaleBalance','ShortSaleTodayBalance']
              zh='融券';en=('short','sale')
            prev=num(val(o,prev_keys));cur=num(val(o,cur_keys))
            if prev is not None and cur is not None:return prev,cur
            for k,v in o.items():
              raw=str(k);norm=re.sub(r'[^a-z0-9]','',raw.lower())
              is_side=(zh in raw) or all(t in norm for t in en)
              if not is_side or '餘額' not in raw and 'balance' not in norm:continue
              x=num(v)
              if x is None:continue
              if any(t in raw for t in ('前日','昨日')) or any(t in norm for t in ('previous','yesterday')):prev=x
              elif any(t in raw for t in ('今日','本日')) or ('balance' in norm and not any(t in norm for t in ('previous','yesterday'))):cur=x
            return prev,cur

          stocks={};profiles={};source_status={}
          for market,url in [
            ('TWSE','https://openapi.twse.com.tw/v1/opendata/t187ap03_L'),
            ('TPEx','https://www.tpex.org.tw/openapi/v1/mopsfin_t187ap03_O')]:
            rows=get(url,True) or [];profiles[market]=bool(rows)
            for x in rows:
              c=code(x)
              if not re.fullmatch(r'\d{4}',c):continue
              z=stocks.setdefault(c,{});z['market']=market
              ind=str(val(x,['產業別','產業類別','Industry','IndustryName','產業別名稱']) or '').strip()
              if ind:z['industry']=ind

          credit_sources=[
            ('TWSE','https://openapi.twse.com.tw/v1/exchangeReport/MI_MARGN'),
            ('TPEx','https://www.tpex.org.tw/openapi/v1/tpex_mainboard_margin_balance')]
          for market,url in credit_sources:
            rows=get(url) or [];used=0;mcount=0;scount=0
            if isinstance(rows,dict):
              # tolerate wrapped official responses without relying on table position
              candidates=[]
              for v in rows.values():
                if isinstance(v,list) and v and isinstance(v[0],dict):candidates.extend(v)
              rows=candidates
            for x in rows if isinstance(rows,list) else []:
              c=code(x)
              if not re.fullmatch(r'\d{4}',c):continue
              used+=1;z=stocks.setdefault(c,{});z.setdefault('market',market)
              mp,mc=credit_values(x,'margin');sp,sc=credit_values(x,'short')
              a,b=change(mp,mc),change(sp,sc)
              if a is not None:z['margin_change_pct']=a;mcount+=1
              if b is not None:z['short_change_pct']=b;scount+=1
              note=str(val(x,['備註','Note','信用交易狀態']) or '')
              if any(k in note for k in ('暫停','停止','不得','X','!')):z['margin_suspended']=True
            source_status[market]={'rows':used,'margin':mcount,'short':scount,'ok':used>0 and mcount>0 and scount>0}
            if not source_status[market]['ok']:
              sample=rows[0] if isinstance(rows,list) and rows else {}
              print(market,'credit source incomplete',source_status[market],'sample_keys',list(sample)[:30] if isinstance(sample,dict) else type(sample).__name__)

          def flatten_rows(d):
            if isinstance(d,list):return d
            if not isinstance(d,dict):return []
            out=[]
            for k,v in d.items():
              if k.startswith('data') and isinstance(v,list):out.extend(v)
            return out

          def mark(url,key):
            d=get(url);rows=flatten_rows(d)
            for x in rows:
              if isinstance(x,dict):c=code(x)
              else:
                c=''
                for v in x if isinstance(x,list) else []:
                  s=str(v).strip()
                  if re.fullmatch(r'\d{4}',s):c=s;break
              if c:stocks.setdefault(c,{})[key]=True

          mark('https://www.twse.com.tw/rwd/zh/announcement/notice?response=json','attention')
          mark('https://www.twse.com.tw/rwd/zh/announcement/punish?response=json','disposition')
          mark('https://www.tpex.org.tw/openapi/v1/tpex_trading_warning_information','attention')
          mark('https://www.tpex.org.tw/openapi/v1/tpex_disposal_information','disposition')

          otc=get('https://www.tpex.org.tw/openapi/v1/tpex_daily_trading_index') or []
          market={'otc_state':'unavailable'}
          if isinstance(otc,list) and otc:
            x=otc[0];d=num(val(x,['ChangePercent','漲跌幅','漲跌百分比','Change']))
            market={'otc_state':'偏多' if d is not None and d>0 else '偏空' if d is not None and d<0 else '震盪' if d is not None else '已取得','otc_change':d,'otc_close':num(val(x,['Close','ClosingIndex','收盤指數','指數']))}

          coverage={
            'industry':sum('industry' in z for z in stocks.values()),
            'margin':sum('margin_change_pct' in z for z in stocks.values()),
            'short':sum('short_change_pct' in z for z in stocks.values()),
            'attention':sum(bool(z.get('attention')) for z in stocks.values()),
            'disposition':sum(bool(z.get('disposition')) for z in stocks.values())}
          out={'schema_version':2,'generated_at':datetime.now(timezone.utc).isoformat(),'source':'official-derived','profile_status':profiles,'source_status':source_status,'market':market,'coverage':coverage,'stocks':stocks}
          with open('stock-lab/taiwan-factors.json','w',encoding='utf-8') as f:json.dump(out,f,ensure_ascii=False,separators=(',',':'))
          print('stocks',len(stocks),'coverage',coverage,'sources',source_status)
          PY

      - name: Validate derived factor file
        run: |
          python - <<'PY'
          import json
          x=json.load(open('stock-lab/taiwan-factors.json',encoding='utf-8'));s=x['stocks'];c=x.get('coverage',{});src=x.get('source_status',{})
          assert x['schema_version']==2 and x['source']=='official-derived'
          assert len(s)>=100 and c.get('industry',0)>=100
          assert c.get('margin',0)>=50, c
          assert c.get('short',0)>=20, c
          assert any(v.get('ok') for v in src.values()), src
          assert 'otc_state' in x['market']
          print('Taiwan factors valid',len(s),c,src)
          PY

      - name: Commit factor file
        run: |
          if [ -z "$(git status --porcelain -- stock-lab/taiwan-factors.json)" ]; then echo 'No changes'; exit 0; fi
          git config user.name stocklab-bot
          git config user.email stocklab-bot@users.noreply.github.com
          git add stock-lab/taiwan-factors.json
          git commit -m 'update derived Taiwan market factors'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
