name: Update StockLab Taiwan factors

# v2 factor pipeline: industry codes, margin/short balance changes, warning/disposition flags, OTC regime.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-taiwan-factors.yml'
  schedule:
    - cron: '10 12 * * 1-5'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Build derived Taiwan factors
        run: |
          python - <<'PY'
          import json,urllib.request,re,time
          from datetime import datetime,timezone
          UA={'User-Agent':'StockLab-Taiwan-Factors/3.1','Accept':'application/json,text/html;q=0.8'}
          def get(url):
            for i in range(4):
              try:
                with urllib.request.urlopen(urllib.request.Request(url,headers=UA),timeout=60) as r:return json.loads(r.read().decode())
              except Exception as e:
                if i==3:return None
                time.sleep(i+1)
          def val(o,ks):
            for k in ks:
              if isinstance(o,dict) and k in o and str(o[k]).strip()!='':return o[k]
          def num(v):
            try:return float(str(v).replace(',','').replace('%',''))
            except:return None
          def code(o):
            if isinstance(o,dict):return str(val(o,['公司代號','證券代號','SecuritiesCompanyCode','Code','股票代號']) or '').strip()
            if isinstance(o,list):
              for x in o:
                if re.fullmatch(r'\d{4}',str(x).strip()):return str(x).strip()
            return ''
          def chg(p,c):return round((c/p-1)*100,3) if p not in (None,0) and c is not None else None
          stocks={};profiles={}
          for market,url in [('TWSE','https://openapi.twse.com.tw/v1/opendata/t187ap03_L'),('TPEx','https://www.tpex.org.tw/openapi/v1/mopsfin_t187ap03_O')]:
            d=get(url) or [];profiles[market]=bool(d)
            for x in d:
              c=code(x)
              if not re.fullmatch(r'\d{4}',c):continue
              z=stocks.setdefault(c,{});z['market']=market;ind=str(val(x,['產業別','產業類別','Industry','IndustryName','產業別名稱']) or '').strip()
              if ind:z['industry']=ind
          tw=get('https://www.twse.com.tw/rwd/zh/marginTrading/MI_MARGN?response=json&selectType=ALL') or {}
          for fk,fields in list(tw.items()):
            if not fk.startswith('fields') or not isinstance(fields,list):continue
            suffix=fk[6:];rows=tw.get('data'+suffix)
            if not isinstance(rows,list):continue
            heads=[re.sub('<[^>]+>','',str(x)).replace('\n','').replace(' ','') for x in fields]
            if not any('代號' in x for x in heads) or not any('融資' in x for x in heads) or not any('融券' in x for x in heads):continue
            for r in rows:
              c=code(r)
              if not re.fullmatch(r'\d{4}',c) or len(r)<14:continue
              z=stocks.setdefault(c,{});mp,mc,sp,sc=num(r[5]),num(r[6]),num(r[11]),num(r[12]);a,b=chg(mp,mc),chg(sp,sc)
              if a is not None:z['margin_change_pct']=a
              if b is not None:z['short_change_pct']=b
              note=str(r[-1]) if r else ''
              if any(k in note for k in ('O','X','!')):z['margin_suspended']=True
          tp=get('https://www.tpex.org.tw/openapi/v1/tpex_mainboard_margin_balance') or []
          for x in tp:
            c=code(x)
            if not c:continue
            z=stocks.setdefault(c,{});a=chg(num(val(x,['PreviousBalanceOfMarginPurchase','PreviousMarginPurchaseBalance','前日融資餘額','昨日融資餘額'])),num(val(x,['BalanceOfMarginPurchase','MarginPurchaseBalance','融資餘額','今日融資餘額','本日融資餘額'])));b=chg(num(val(x,['PreviousBalanceOfShortSale','PreviousShortSaleBalance','前日融券餘額','昨日融券餘額'])),num(val(x,['BalanceOfShortSale','ShortSaleBalance','融券餘額','今日融券餘額','本日融券餘額'])))
            if a is not None:z['margin_change_pct']=a
            if b is not None:z['short_change_pct']=b
            if any(k in str(val(x,['Note','備註']) or '') for k in ('O','X','!')):z['margin_suspended']=True
          def mark(url,key):
            d=get(url)
            if isinstance(d,list):rows=d
            elif isinstance(d,dict):rows=[];[rows.extend(v) for k,v in d.items() if k.startswith('data') and isinstance(v,list)]
            else:rows=[]
            for x in rows:
              c=code(x)
              if c:stocks.setdefault(c,{})[key]=True
          mark('https://www.twse.com.tw/rwd/zh/announcement/notice?response=json','attention');mark('https://www.twse.com.tw/rwd/zh/announcement/punish?response=json','disposition');mark('https://www.tpex.org.tw/openapi/v1/tpex_trading_warning_information','attention');mark('https://www.tpex.org.tw/openapi/v1/tpex_disposal_information','disposition')
          otc=get('https://www.tpex.org.tw/openapi/v1/tpex_daily_trading_index') or [];market={'otc_state':'unavailable'}
          if otc:
            x=otc[0];d=num(val(x,['ChangePercent','漲跌幅','漲跌百分比','Change']));market={'otc_state':'偏多' if d is not None and d>0 else '偏空' if d is not None and d<0 else '震盪' if d is not None else '已取得','otc_change':d,'otc_close':num(val(x,['Close','ClosingIndex','收盤指數','指數']))}
          coverage={'industry':sum('industry'in z for z in stocks.values()),'margin':sum('margin_change_pct'in z for z in stocks.values()),'short':sum('short_change_pct'in z for z in stocks.values()),'attention':sum(bool(z.get('attention')) for z in stocks.values()),'disposition':sum(bool(z.get('disposition')) for z in stocks.values())}
          out={'schema_version':2,'generated_at':datetime.now(timezone.utc).isoformat(),'source':'official-derived','profile_status':profiles,'market':market,'coverage':coverage,'stocks':stocks}
          json.dump(out,open('stock-lab/taiwan-factors.json','w',encoding='utf-8'),ensure_ascii=False,separators=(',',':'))
          print('stocks',len(stocks),'coverage',coverage)
          PY
      - name: Validate derived factor file
        run: |
          python - <<'PY'
          import json
          x=json.load(open('stock-lab/taiwan-factors.json',encoding='utf-8'));s=x['stocks']
          assert x['schema_version']==2 and x['source']=='official-derived';assert len(s)>=100
          assert x.get('coverage',{}).get('industry',0)>=100
          assert x.get('coverage',{}).get('margin',0)>=50
          assert x.get('coverage',{}).get('short',0)>=20
          assert 'otc_state' in x['market']
          print('Taiwan v2 factors valid',len(s),x['coverage'])
          PY
      - name: Commit factor file
        run: |
          if [ -z "$(git status --porcelain -- stock-lab/taiwan-factors.json)" ]; then echo 'No changes'; exit 0; fi
          git config user.name stocklab-bot;git config user.email stocklab-bot@users.noreply.github.com
          git add stock-lab/taiwan-factors.json;git commit -m 'update derived Taiwan market factors';git fetch origin main;git rebase origin/main;git push origin HEAD:main
