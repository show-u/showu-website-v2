name: StockLab licensed same-origin data smoke

on:
  workflow_dispatch:
  push:
    paths:
      - 'stock-lab/browser-data.json'
      - 'stock-lab/same-origin-cache.js'
      - 'stock-lab/index.html'
      - '.github/workflows/stocklab-same-origin-smoke.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify licensed same-origin adapter
        run: |
          node --check stock-lab/same-origin-cache.js
          grep -q './same-origin-cache.js' stock-lab/index.html
          grep -q 'browser-data.json' stock-lab/same-origin-cache.js
          grep -q 'licensed-open-data-cache' stock-lab/same-origin-cache.js
          grep -q 'OGDL-1.0' stock-lab/same-origin-cache.js
          if grep -q 'remoteJget' stock-lab/same-origin-cache.js; then echo 'remote fallback is forbidden'; exit 1; fi
      - name: Verify licensed datasets and provenance
        run: |
          python - <<'PY'
          import json
          x=json.load(open('stock-lab/browser-data.json',encoding='utf-8'))
          req={'twse_snapshot','twse_valuation','twse_revenue','twse_income','twse_balance','twse_dividend','twse_exright_prepost','tpex_snapshot','tpex_valuation','tpex_institution','tpex_revenue','tpex_income','tpex_balance','tpex_dividend','tpex_exright_prepost','tpex_exright_daily'}
          assert x['schema_version']==2 and x['source']=='licensed-open-data-cache'
          assert x['licence']=='政府資料開放授權條款-第1版 / OGDL-1.0'
          assert set(x['datasets'])==req
          assert set(x['meta'])==req
          for k in req:
              rows=x['datasets'][k];m=x['meta'][k]
              assert isinstance(rows,list) and len(rows)>0,k
              assert m['count']==len(rows) and m['count']>0,k
              assert m['licence_verified'] is True and m['licence']=='OGDL-1.0',k
              assert isinstance(m['data_gov_dataset'],int) and m['data_gov_dataset']>0,k
              assert m['attribution'],k
              assert isinstance(m['sha256'],str) and len(m['sha256'])==64,k
          print('licensed same-origin OGDL datasets and provenance verified')
          PY
