name: StockLab licensed market facts smoke

on:
  workflow_dispatch:
  push:
    paths:
      - 'stock-lab/market-facts.json'
      - 'stock-lab/same-origin-cache.js'
      - 'stock-lab/ui-patch.js'
      - 'stock-lab/holding-router.js'
      - '.github/workflows/stocklab-same-origin-smoke.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify licensed public market facts adapter
        run: |
          node --check stock-lab/same-origin-cache.js
          node --check stock-lab/ui-patch.js
          node --check stock-lab/holding-router.js
          grep -q 'market-facts.json' stock-lab/same-origin-cache.js
          grep -q 'ogdl-normalized-market-facts' stock-lab/same-origin-cache.js
          grep -q "licence!=='OGDL-1.0'" stock-lab/same-origin-cache.js
          grep -q 'missingDataFallback:false' stock-lab/same-origin-cache.js
          if grep -q 'browser-data.json' stock-lab/same-origin-cache.js; then echo 'obsolete browser-data dependency returned'; exit 1; fi
      - name: Verify normalized facts provenance
        run: |
          python - <<'PY'
          import json,re
          x=json.load(open('stock-lab/market-facts.json',encoding='utf-8'))
          assert x['schema_version']==1 and x['source']=='ogdl-normalized-market-facts'
          assert x['licence']=='OGDL-1.0' and x['no_imputation'] is True
          assert isinstance(x['rows'],list) and len(x['rows'])>1000
          assert {'TWSE','TPEx'} <= set(x['markets'])
          found=False
          for r in x['rows']:
              assert r['licence']=='OGDL-1.0' and r['provenance']=='observed'
              assert re.fullmatch(r'\d{4}-\d{2}-\d{2}',r['date'])
              assert all(float(r[k])>0 for k in ('open','high','low','close'))
              assert re.fullmatch(r'[a-f0-9]{64}',r['raw_sha256'])
              if r['ticker']=='2454' and r['market']=='TWSE':
                  assert r['name']=='聯發科' and float(r['close'])>0
                  found=True
          assert found,'2454 licensed fact missing'
          print('licensed normalized market facts verified')
          PY
