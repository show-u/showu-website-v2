name: Fresh-date M3 validation
on:
  push:
    branches: [main]
    paths:
      - 'stock-api/research/fresh-date-m3-validation.js'
      - '.github/workflows/fresh-date-m3-validation.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node stock-api/research/fresh-date-m3-validation.js
