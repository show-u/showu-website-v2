name: Individual score useful rules replication
on:
 push:
  branches: [main]
  paths:
   - 'stock-api/research/individual-score-useful-rules-replication.js'
   - '.github/workflows/individual-score-useful-rules-replication.yml'
 workflow_dispatch:
jobs:
 validate:
  runs-on: ubuntu-latest
  timeout-minutes: 60
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-node@v4
     with:
      node-version: '20'
   - run: node stock-api/research/individual-score-useful-rules-replication.js
