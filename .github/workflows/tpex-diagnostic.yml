name: TPEx endpoint diagnostic
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tpex-diagnostic.yml'
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect TPEx Swagger
        shell: bash
        run: |
          set -e
          curl -L --max-time 60 -A "Mozilla/5.0" -sS "https://www.tpex.org.tw/openapi/swagger.json" -o /tmp/swagger.json
          echo "SIZE $(wc -c </tmp/swagger.json)"
          python - <<'PY'
          import json,re
          j=json.load(open('/tmp/swagger.json'))
          paths=j.get('paths',{})
          for p,v in paths.items():
              s=(p+' '+json.dumps(v,ensure_ascii=False)).lower()
              if any(k in s for k in ['history','histor','daily','close','quote','trading','aftertrading','mainboard']):
                  print(p)
                  print(json.dumps(v,ensure_ascii=False)[:1800])
                  print('---')
          PY
