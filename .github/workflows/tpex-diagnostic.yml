name: TPEx endpoint diagnostic
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tpex-diagnostic.yml'
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Probe corrected TPEx endpoint
        shell: bash
        run: |
          set -e
          u="https://www.tpex.org.tw/www/zh-tw/afterTrading/tradingStock?code=6488&date=2026%2F09%2F01&response=json"
          echo "$u"
          curl -L --max-time 30 -A "Mozilla/5.0" -sS -D /tmp/h -o /tmp/b "$u"
          head -20 /tmp/h
          echo "SIZE $(wc -c </tmp/b)"
          head -c 3000 /tmp/b | tr '\n' ' '
          echo
