name: StockLab CORS diagnostic

on:
  push:
    paths:
      - '.github/workflows/stocklab-cors-diagnostic.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check official API CORS headers
        shell: bash
        run: |
          set -euo pipefail
          origin='https://www.showujapan.com'
          urls=(
            'https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL'
            'https://www.twse.com.tw/rwd/zh/afterTrading/STOCK_DAY?response=json&date=20260901&stockNo=2454'
            'https://www.tpex.org.tw/openapi/v1/tpex_mainboard_daily_close_quotes'
          )
          for u in "${urls[@]}"; do
            echo "=== $u ==="
            curl -sS -D - -o /dev/null -H "Origin: $origin" --max-time 30 "$u" | tr -d '\r' | grep -Ei '^(HTTP/|access-control-allow-origin:|access-control-allow-methods:|vary:|content-type:)' || true
          done
