name: QG final regime validation
on:
  push:
    branches: [main]
    paths:
      - 'stock-api/research/qg-final-regime-validation.js'
      - '.github/workflows/qg-final-regime-validation.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node stock-api/research/qg-final-regime-validation.js
