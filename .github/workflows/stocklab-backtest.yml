name: StockLab model validation gate

on:
  workflow_dispatch:
  schedule:
    - cron: '40 9 * * 6'
  push:
    paths:
      - 'stock-lab/backtest-taiwan-v3.py'
      - 'stock-lab/model-validation-status.json'
      - 'stock-lab/backtest-result.json'
      - 'stock-lab/verification-policy.json'
      - 'stock-lab/runtime-config.js'
      - '.github/workflows/stocklab-backtest.yml'

permissions:
  contents: read

jobs:
  validation-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m py_compile stock-lab/backtest-taiwan-v3.py
      - name: Run fail-closed v9 model validation gate
        run: |
          python stock-lab/backtest-taiwan-v3.py \
            --status-manifest stock-lab/model-validation-status.json \
            --out /tmp/stocklab-validation.json
      - name: Validate v9 separation, zero unlicensed collection, and no false PASS
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          x=json.load(open('/tmp/stocklab-validation.json',encoding='utf-8'))
          manifest=json.load(open('stock-lab/model-validation-status.json',encoding='utf-8'))
          expected={'entry_decision_9plus3','entry_scanner_9plus3','holding_exit'}
          allowed_nonpass={'FAIL','INSUFFICIENT','BLOCKED_LEGAL_SOURCE','BLOCKED_DATA_LAYER'}

          assert x['schema_version']==9 and x['architecture']=='unified-entry-holding-v9'
          assert manifest['schema_version']==3 and manifest['architecture']==x['architecture']
          assert x['formal_validation_status'] in allowed_nonpass
          assert x['network_history_collection_performed'] is False
          assert x['network_history_collection_disabled'] is True
          assert x['legacy_horizon_entry_results_are_production_valid'] is False
          assert set(x['models'])==expected and set(manifest['models'])==expected
          assert x['truth_contract']=={
              'missing_data_imputed':False,
              'unverified_source_used_as_fact':False,
              'stale_data_relabelled_current':False,
              'oos_required_for_recommendation':True}
          for name in expected:
              status=x['models'][name]
              assert status==manifest['models'][name]['status'],(name,status,manifest['models'][name])
              assert status in allowed_nonpass,(name,status)
              assert manifest['models'][name]['reason'],name
              assert manifest['models'][name]['required_before_pass'],name

          src=Path('stock-lab/backtest-taiwan-v3.py').read_text(encoding='utf-8')
          assert "ARCHITECTURE = 'unified-entry-holding-v9'" in src
          assert 'NETWORK_HISTORY_COLLECTION_DISABLED = True' in src
          for forbidden in ('urllib.request','www.twse.com.tw','www.tpex.org.tw','ThreadPoolExecutor','fetch_twse_month','fetch_tpex_month'):
              assert forbidden not in src,forbidden

          print('PASS: v9 validation gate preserved unified entry/scanner/holding non-PASS states, made zero unlicensed historical requests, and emitted no false PASS')
          PY
      - name: Publish validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: stocklab-model-validation-gate
          path: /tmp/stocklab-validation.json
          retention-days: 7
