name: StockLab Taiwan backtest

on:
  workflow_dispatch:
  schedule:
    - cron: '40 9 * * 6'
  push:
    paths:
      - 'stock-lab/backtest-model.py'
      - '.github/workflows/stocklab-backtest.yml'

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m py_compile stock-lab/backtest-model.py
      - name: Run Taiwan-stock model comparison
        run: python stock-lab/backtest-model.py 2409 2454 3017 3044 8210 --months 72 --out stock-lab/backtest-result.json
      - name: Validate result
        run: |
          python - <<'PY'
          import json
          p='stock-lab/backtest-result.json'
          x=json.load(open(p,encoding='utf-8'))
          assert x['schema_version']==1 and x['market']=='TWSE'
          assert len(x['tickers'])==5
          for s in x['tickers']:
              assert 'error' not in s, s
              assert s['bars']>=250, s
              for h in ('short','swing','long'):
                  a=s['models'][h]['legacy_fixed_pct']
                  b=s['models'][h]['adaptive_support_atr']
                  assert a['n']>0 and b['n']>0, (s['ticker'],h,a,b)
          print('backtest result validated')
          PY
      - name: Persist result when changed
        run: |
          if [ -n "$(git status --porcelain stock-lab/backtest-result.json)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add stock-lab/backtest-result.json
            git commit -m 'update StockLab Taiwan backtest result'
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo 'No backtest changes'
          fi
