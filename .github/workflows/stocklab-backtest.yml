name: StockLab model validation gate

on:
  workflow_dispatch:
  schedule:
    - cron: '40 9 * * 6'
  push:
    paths:
      - 'stock-lab/backtest-taiwan-v3.py'
      - 'stock-lab/model-validation-status.json'
      - 'stock-lab/backtest-result.json'
      - 'stock-lab/verification-policy.json'
      - 'stock-lab/runtime-config.js'
      - '.github/workflows/stocklab-backtest.yml'

permissions:
  contents: read

jobs:
  validation-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m py_compile stock-lab/backtest-taiwan-v3.py
      - name: Run fail-closed prediction validation gate
        run: |
          python stock-lab/backtest-taiwan-v3.py \
            --status-manifest stock-lab/model-validation-status.json \
            --out /tmp/stocklab-validation.json
      - name: Validate prediction gates and rule-based holding separation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          x=json.load(open('/tmp/stocklab-validation.json',encoding='utf-8'))
          manifest=json.load(open('stock-lab/model-validation-status.json',encoding='utf-8'))
          policy=json.load(open('stock-lab/verification-policy.json',encoding='utf-8'))
          expected={'entry_decision_9plus3','entry_scanner_9plus3','holding_rules'}
          allowed_nonpass={'FAIL','INSUFFICIENT','BLOCKED_LEGAL_SOURCE','BLOCKED_DATA_LAYER'}

          assert x['schema_version']==10 and x['architecture']=='free-official-first-executable-entry-three-input-actionable-holding-v14'
          assert manifest['schema_version']==9 and manifest['architecture']==x['architecture']
          assert x['formal_prediction_validation_status'] in allowed_nonpass
          assert x['network_history_collection_performed'] is False
          assert x['network_history_collection_disabled'] is True
          assert x['legacy_horizon_entry_results_are_production_valid'] is False
          assert set(x['models'])==expected and set(manifest['models'])==expected
          for name in ('entry_decision_9plus3','entry_scanner_9plus3'):
              assert x['models'][name]==manifest['models'][name]['status']
              assert x['models'][name] in allowed_nonpass
          assert x['models']['holding_rules']=='AVAILABLE_RULE_BASED'
          assert manifest['models']['holding_rules']['oos_required_for_rule_output'] is False
          assert manifest['models']['holding_rules']['oos_required_for_statistical_claims'] is True
          assert policy['output_contract']['deterministic_holding_rules_require_oos_pass'] is False
          assert policy['backtest_validation']['deterministic_holding_rules_require_oos'] is False
          assert x['truth_contract']=={
              'missing_data_imputed':False,
              'unverified_source_used_as_fact':False,
              'stale_data_relabelled_current':False,
              'legacy_horizon_buy_model_used':False,
              'predictive_oos_required':True,
              'deterministic_holding_rules_oos_required':False,
              'holding_statistical_claims_oos_required':True}

          src=Path('stock-lab/backtest-taiwan-v3.py').read_text(encoding='utf-8')
          assert "ARCHITECTURE = 'free-official-first-executable-entry-three-input-actionable-holding-v14'" in src
          assert 'NETWORK_HISTORY_COLLECTION_DISABLED = True' in src
          for forbidden in ('holding-exit-validation-protocol.json','minimum_oos_episodes_total','minimum_oos_securities','TW-holding-exit-v4','urllib.request','www.twse.com.tw','www.tpex.org.tw','ThreadPoolExecutor','fetch_twse_month','fetch_tpex_month'):
              assert forbidden not in src,forbidden
          assert not Path('stock-lab/backtest-model.py').exists(),'obsolete horizon backtest-model.py must stay deleted'
          print('PASS: predictive validation remains fail-closed; deterministic holding rules are not OOS-locked')
          PY
      - name: Publish validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: stocklab-model-validation-gate
          path: /tmp/stocklab-validation.json
          retention-days: 7
