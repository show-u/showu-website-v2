name: MOM6 broad fresh-universe validation
on:
 push:
  branches: [main]
  paths:
   - 'stock-api/research/mom6-broad-fresh-validation.js'
   - '.github/workflows/mom6-broad-fresh-validation.yml'
 workflow_dispatch:
jobs:
 validate:
  runs-on: ubuntu-latest
  timeout-minutes: 60
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-node@v4
     with:
      node-version: '20'
   - run: node stock-api/research/mom6-broad-fresh-validation.js
