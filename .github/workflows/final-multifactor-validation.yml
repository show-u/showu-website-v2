name: Final multi-factor discovery validation
on:
  push:
    branches: [main]
    paths:
      - 'stock-api/research/final-multifactor-validation.js'
      - '.github/workflows/final-multifactor-validation.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node stock-api/research/final-multifactor-validation.js
