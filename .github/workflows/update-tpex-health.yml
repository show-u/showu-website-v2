name: Update TPEx source health

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-tpex-health.yml'
      - 'stock-lab/tpex.js'
  schedule:
    - cron: '10 7 * * 1-5'

permissions:
  contents: write

# TPEx source health is a hard gate: failed/stale checks block OTC analysis.
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate TPEx official OpenAPI
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error, hashlib, time
          from http.client import IncompleteRead
          from datetime import datetime, timezone
          from urllib.parse import urlparse

          NOW=datetime.now(timezone.utc)
          BASE='https://www.tpex.org.tw/openapi/v1/'
          ENDPOINTS={
            'snapshot':'tpex_mainboard_daily_close_quotes',
            'valuation':'tpex_mainboard_peratio_analysis',
            'institution':'tpex_3insti_daily_trading',
            'revenue':'mopsfin_t187ap05_O',
            'income':'mopsfin_t187ap06_O_ci',
            'balance':'mopsfin_t187ap07_O_ci'
          }
          def fetch(name):
              url=BASE+name; last=None
              for attempt in range(1,4):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 StockLab TPEx health/1.1','Accept-Encoding':'identity','Connection':'close'})
                      with urllib.request.urlopen(req,timeout=90) as r:
                          body=r.read(); final=r.geturl(); host=(urlparse(final).hostname or '').lower()
                          if host!='www.tpex.org.tw': raise ValueError(f'unexpected host {host}')
                          ctype=(r.headers.get('Content-Type','') or '').lower()
                          clen=r.headers.get('Content-Length')
                          if clen and len(body)!=int(clen): raise ValueError(f'content-length mismatch {len(body)} != {clen}')
                          data=json.loads(body.decode('utf-8','strict'))
                          if not isinstance(data,list) or not data: raise ValueError('empty/non-list payload')
                          return data,hashlib.sha256(body).hexdigest(),ctype,final,len(body),attempt
                  except (IncompleteRead, urllib.error.URLError, TimeoutError, json.JSONDecodeError, ValueError) as e:
                      last=e
                      if attempt<3: time.sleep(attempt*2)
              raise RuntimeError(f'{name} download failed after 3 attempts: {last}')
          def val(o,*keys):
              for k in keys:
                  if k in o and str(o[k]).strip()!='': return o[k]
              return None
          def norm_date(v):
              s=''.join(ch for ch in str(v or '') if ch.isdigit())
              if len(s)==7:return f'{int(s[:3])+1911}-{s[3:5]}-{s[5:7]}'
              if len(s)==8:return f'{s[:4]}-{s[4:6]}-{s[6:8]}'
              return None
          out={'schema_version':1,'generated_at':NOW.isoformat(),'status':'ok','verified':True,'source':'TPEx','checks':{},'policy':'TPEx official OpenAPI schema/date/count gate; unhealthy source is blocked from analysis and ranking'}
          try:
              for key,ep in ENDPOINTS.items():
                  data,sha,ctype,final,bytes_len,attempt=fetch(ep); sample=data[0]
                  check={'verified':True,'endpoint':ep,'count':len(data),'raw_sha256':sha,'content_type':ctype,'final_url':final,'bytes':bytes_len,'download_attempt':attempt}
                  if key=='snapshot':
                      code=val(sample,'SecuritiesCompanyCode','Code','證券代號','代號'); close=val(sample,'Close','ClosingPrice','收盤價','收盤'); d=norm_date(val(sample,'Date','日期'))
                      if code is None or close is None or d is None: raise ValueError('snapshot required fields missing')
                      age=(NOW-datetime.fromisoformat(d).replace(tzinfo=timezone.utc)).days
                      if age<0 or age>7: raise ValueError(f'snapshot date stale/future {d}')
                      check['latest_date']=d
                  elif key=='valuation':
                      if val(sample,'SecuritiesCompanyCode','Code','證券代號','公司代號') is None: raise ValueError('valuation code missing')
                      if val(sample,'PriceEarningRatio','PERatio','本益比') is None: raise ValueError('valuation PE missing')
                  elif key=='institution':
                      if val(sample,'SecuritiesCompanyCode','Code','證券代號','公司代號') is None: raise ValueError('institution code missing')
                  elif key=='revenue':
                      if val(sample,'公司代號','SecuritiesCompanyCode','Code') is None or val(sample,'資料年月','年月') is None: raise ValueError('revenue key fields missing')
                  elif key in ('income','balance'):
                      if val(sample,'公司代號','SecuritiesCompanyCode') is None: raise ValueError(f'{key} company code missing')
                  out['checks'][key]=check
          except Exception as e:
              out['status']='failed';out['verified']=False;out['error']=str(e)[:400]
          with open('stock-lab/tpex-health.json','w',encoding='utf-8') as f: json.dump(out,f,ensure_ascii=False,indent=2)
          PY
      - name: Validate health snapshot
        run: |
          python - <<'PY'
          import json
          x=json.load(open('stock-lab/tpex-health.json',encoding='utf-8'))
          assert x.get('schema_version')==1 and x.get('source')=='TPEx'
          if x.get('verified'):
              assert x.get('status')=='ok'
              assert set(x.get('checks',{}))=={'snapshot','valuation','institution','revenue','income','balance'}
              for v in x['checks'].values():
                  assert v.get('verified') is True and v.get('count',0)>0 and len(v.get('raw_sha256',''))==64 and v.get('bytes',0)>0
          print('TPEx health schema valid')
          PY
      - name: Commit snapshot if changed
        run: |
          if git diff --quiet -- stock-lab/tpex-health.json; then echo 'No changes'; exit 0; fi
          git config user.name 'stocklab-bot'
          git config user.email 'stocklab-bot@users.noreply.github.com'
          git add stock-lab/tpex-health.json
          git commit -m 'update verified TPEx health snapshot'
          git push
