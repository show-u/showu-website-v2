name: Top10 fundamental surprise locked validation
on:
 push:
  branches: [main]
  paths: ['stock-api/research/top10-fundamental-surprise-locked-validation.js','.github/workflows/top10-fundamental-surprise-locked-validation.yml']
jobs:
 run:
  runs-on: ubuntu-latest
  timeout-minutes: 90
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-node@v4
     with: {node-version: '20'}
   - run: node stock-api/research/top10-fundamental-surprise-locked-validation.js
