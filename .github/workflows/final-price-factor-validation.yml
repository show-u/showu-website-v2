name: Final price-factor robust validation
on:
  push:
    branches: [main]
    paths:
      - 'stock-api/research/final-price-factor-validation.js'
      - '.github/workflows/final-price-factor-validation.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node stock-api/research/final-price-factor-validation.js
