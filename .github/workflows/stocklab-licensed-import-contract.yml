name: StockLab licensed-history import contract

on:
  workflow_dispatch:
  push:
    paths:
      - 'stock-lab/import-licensed-history.py'
      - 'stock-lab/validate-licensed-bundle.py'
      - 'stock-lab/licensed-data-contract.json'
      - '.github/workflows/stocklab-licensed-import-contract.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax and no-network guard
        run: |
          python -m py_compile stock-lab/import-licensed-history.py stock-lab/validate-licensed-bundle.py
          python - <<'PY'
          from pathlib import Path
          for path in ('stock-lab/import-licensed-history.py','stock-lab/validate-licensed-bundle.py'):
              s=Path(path).read_text(encoding='utf-8')
              for forbidden in ('urllib.request','requests.get','http://','https://'):
                  assert forbidden not in s, (path,forbidden)
          s=Path('stock-lab/import-licensed-history.py').read_text(encoding='utf-8')
          for required in (
              'LICENCE_GATE_FAIL','no_imputation','raw_redistribution_allowed',
              'acquisition_mode_authorized','public_derived_outputs_allowed',
              'processing_location_authorized','terms_reviewed_date',
              'unresolved source_id','impossible OHLC','network_collection_performed_by_importer',
              'market_index','valid_from','valid_to','source-registry'
          ):
              assert required.lower() in s.lower(), required
          print('no-network licensed importer/validator v3 invariant passed')
          PY

      - name: Build synthetic authorised v3 bundle
        run: |
          rm -rf /tmp/stocklab-licensed-test
          mkdir -p /tmp/stocklab-licensed-test

          cat > /tmp/stocklab-licensed-test/source-registry.json <<'EOF'
          [
            {
              "source_id":"test-source",
              "provider":"Synthetic CI Provider",
              "dataset_name":"Synthetic licensed Taiwan history",
              "evidence_reference":"ci://synthetic-v3",
              "provenance_class":"observed"
            }
          ]
          EOF

          cat > /tmp/stocklab-licensed-test/security_master.csv <<'EOF'
          ticker,market,security_type,valid_from,valid_to,source_id
          2454,TWSE,ordinary_stock,2020-01-01,,test-source
          EOF

          cat > /tmp/stocklab-licensed-test/trading_calendar.csv <<'EOF'
          date,market,is_trading_day,source_id
          2026-09-14,TWSE,true,test-source
          2026-09-15,TWSE,true,test-source
          EOF

          cat > /tmp/stocklab-licensed-test/daily_ohlc.csv <<'EOF'
          date,ticker,market,open,high,low,close,volume,source_id
          2026-09-14,2454,TWSE,4580,4620,4540,4560,1000,test-source
          2026-09-15,2454,TWSE,4505,4575,4465,4500,1200,test-source
          EOF

          cat > /tmp/stocklab-licensed-test/corporate_actions.csv <<'EOF'
          ticker,market,effective_date,action_type,source_id
          2454,TWSE,2026-09-14,none,test-source
          EOF

          cat > /tmp/stocklab-licensed-test/risk_states.csv <<'EOF'
          ticker,market,date,attention,disposition,suspended,source_id
          2454,TWSE,2026-09-14,false,false,false,test-source
          2454,TWSE,2026-09-15,false,false,false,test-source
          EOF

          cat > /tmp/stocklab-licensed-test/market_index.csv <<'EOF'
          date,market,index_code,close,source_id
          2026-09-14,TWSE,TAIEX,25000,test-source
          2026-09-15,TWSE,TAIEX,24950,test-source
          EOF

          python stock-lab/import-licensed-history.py \
            --bundle-dir /tmp/stocklab-licensed-test \
            --provider 'Synthetic CI Provider' \
            --source-registry /tmp/stocklab-licensed-test/source-registry.json \
            --license-name 'CI TEST ONLY' \
            --legal-basis 'synthetic fixture' \
            --evidence-reference 'ci://synthetic-v3' \
            --terms-reference 'CI terms v3' \
            --terms-reviewed-date '2026-09-16' \
            --acquisition-mode 'manual_provider_portal' \
            --acquisition-mode-authorized \
            --automated-processing-allowed \
            --derived-outputs-allowed \
            --public-derived-outputs-allowed \
            --local-storage-allowed \
            --processing-location 'synthetic-local-private' \
            --processing-location-authorized

          python stock-lab/validate-licensed-bundle.py /tmp/stocklab-licensed-test \
            --contract stock-lab/licensed-data-contract.json \
            --out /tmp/stocklab-licensed-test/validation.json

          python - <<'PY'
          import json
          x=json.load(open('/tmp/stocklab-licensed-test/manifest.json',encoding='utf-8'))
          v=json.load(open('/tmp/stocklab-licensed-test/validation.json',encoding='utf-8'))
          lic=x['license']; truth=v['truth_contract']
          assert x['schema_version']==1 and v['schema_version']==3 and v['ok'] is True
          assert x['no_imputation'] is True and x['network_collection_performed_by_importer'] is False
          assert x['raw_publication_permitted'] is False
          assert lic['acquisition_mode']=='manual_provider_portal'
          assert lic['acquisition_mode_authorized'] is True
          assert lic['public_derived_outputs_allowed'] is True
          assert lic['processing_location_authorized'] is True
          assert truth['acquisition_right_verified'] is True
          assert truth['processing_location_verified'] is True
          assert truth['public_derived_output_right_verified'] is True
          assert truth['all_hashes_verified'] is True
          assert x['coverage']['rows']==2 and x['coverage']['max_bars_per_security']==2
          assert x['datasets']['daily_ohlc']['row_count']==2 and x['datasets']['market_index']['row_count']==2
          print('licensed bundle v3 importer + offline validator contract passed')
          PY

      - name: Reject missing legal rights
        run: |
          rm -f /tmp/stocklab-licensed-test/manifest.json
          set +e
          python stock-lab/import-licensed-history.py \
            --bundle-dir /tmp/stocklab-licensed-test \
            --provider 'Synthetic CI Provider' \
            --source-registry /tmp/stocklab-licensed-test/source-registry.json \
            --license-name 'CI TEST ONLY' \
            --legal-basis 'synthetic fixture' \
            --evidence-reference 'ci://synthetic-v3' \
            --terms-reference 'CI terms v3' \
            --terms-reviewed-date '2026-09-16' \
            --acquisition-mode 'manual_provider_portal' \
            --processing-location 'synthetic-local-private' >/tmp/reject-rights.log 2>&1
          code=$?
          set -e
          test "$code" -ne 0
          grep -q 'LICENCE_GATE_FAIL' /tmp/reject-rights.log

      - name: Reject unresolved provenance
        run: |
          cp -r /tmp/stocklab-licensed-test /tmp/stocklab-bad-source
          rm -f /tmp/stocklab-bad-source/manifest.json /tmp/stocklab-bad-source/validation.json
          sed -i 's/test-source/unknown-source/' /tmp/stocklab-bad-source/daily_ohlc.csv
          set +e
          python stock-lab/import-licensed-history.py \
            --bundle-dir /tmp/stocklab-bad-source \
            --provider 'Synthetic CI Provider' \
            --source-registry /tmp/stocklab-licensed-test/source-registry.json \
            --license-name 'CI TEST ONLY' \
            --legal-basis 'synthetic fixture' \
            --evidence-reference 'ci://synthetic-v3' \
            --terms-reference 'CI terms v3' \
            --terms-reviewed-date '2026-09-16' \
            --acquisition-mode 'manual_provider_portal' \
            --acquisition-mode-authorized \
            --automated-processing-allowed \
            --derived-outputs-allowed \
            --public-derived-outputs-allowed \
            --local-storage-allowed \
            --processing-location 'synthetic-local-private' \
            --processing-location-authorized >/tmp/reject-source.log 2>&1
          code=$?
          set -e
          test "$code" -ne 0
          grep -q 'unresolved source_id' /tmp/reject-source.log

      - name: Reject missing market context
        run: |
          cp -r /tmp/stocklab-licensed-test /tmp/stocklab-no-index
          rm -f /tmp/stocklab-no-index/manifest.json /tmp/stocklab-no-index/validation.json /tmp/stocklab-no-index/market_index.csv
          set +e
          python stock-lab/import-licensed-history.py \
            --bundle-dir /tmp/stocklab-no-index \
            --provider 'Synthetic CI Provider' \
            --source-registry /tmp/stocklab-licensed-test/source-registry.json \
            --license-name 'CI TEST ONLY' \
            --legal-basis 'synthetic fixture' \
            --evidence-reference 'ci://synthetic-v3' \
            --terms-reference 'CI terms v3' \
            --terms-reviewed-date '2026-09-16' \
            --acquisition-mode 'manual_provider_portal' \
            --acquisition-mode-authorized \
            --automated-processing-allowed \
            --derived-outputs-allowed \
            --public-derived-outputs-allowed \
            --local-storage-allowed \
            --processing-location 'synthetic-local-private' \
            --processing-location-authorized >/tmp/reject-index.log 2>&1
          code=$?
          set -e
          test "$code" -ne 0
          grep -q 'market_index: expected exactly one' /tmp/reject-index.log
