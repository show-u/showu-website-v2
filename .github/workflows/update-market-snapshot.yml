name: Update market snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: '20 23 * * 1-5'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch official market data
        run: |
          python - <<'PY'
          import csv, io, json, re, urllib.request
          from datetime import datetime, timezone

          UA={'User-Agent':'Mozilla/5.0 StockLab/1.0'}
          def get(url):
              req=urllib.request.Request(url,headers=UA)
              with urllib.request.urlopen(req,timeout=30) as r:
                  return r.read().decode('utf-8','replace')

          out={
            'generated_at':datetime.now(timezone.utc).isoformat(),
            'status':'ok',
            'sources':{
              'vix':{'verified':False,'source':'CBOE','url':'https://cdn.cboe.com/api/global/us_indices/daily_prices/VIX_History.csv'},
              'sox':{'verified':False,'source':'Nasdaq','url':'https://indexes.nasdaq.com/Index/Overview/SOX'},
              'nasdaq':{'verified':False,'source':'Nasdaq','url':'https://indexes.nasdaq.com/Index/Overview/COMP'}
            }
          }

          # CBOE VIX CSV: official, daily updated.
          try:
              txt=get(out['sources']['vix']['url'])
              rows=list(csv.DictReader(io.StringIO(txt)))
              row=next(r for r in reversed(rows) if r.get('DATE') and r.get('CLOSE'))
              prev=next((r for r in reversed(rows[:-1]) if r.get('CLOSE')),None)
              close=float(row['CLOSE'])
              pclose=float(prev['CLOSE']) if prev else None
              out['sources']['vix'].update({
                'verified':True,'date':row['DATE'],'value':close,
                'change_pct':((close/pclose)-1)*100 if pclose else None
              })
          except Exception as e:
              out['sources']['vix']['error']=str(e)[:180]

          def parse_nasdaq(key,url):
              try:
                  html=get(url)
                  # Nasdaq index overview exposes: DATA AS OF M/D/YYYY value change percent
                  text=re.sub(r'<[^>]+>',' ',html)
                  text=re.sub(r'\s+',' ',text)
                  m=re.search(r'DATA AS OF\s+(\d{1,2}/\d{1,2}/\d{4})\s+([\d,]+(?:\.\d+)?)\s+([+-]?[\d,]+(?:\.\d+)?)\s+([+-]?[\d.]+)%',text,re.I)
                  if not m:
                      raise ValueError('Nasdaq DATA AS OF pattern not found')
                  date,value,chg,pct=m.groups()
                  out['sources'][key].update({'verified':True,'date':date,'value':float(value.replace(',','')),'change':float(chg.replace(',','')),'change_pct':float(pct)})
              except Exception as e:
                  out['sources'][key]['error']=str(e)[:180]

          parse_nasdaq('sox',out['sources']['sox']['url'])
          parse_nasdaq('nasdaq',out['sources']['nasdaq']['url'])

          verified=sum(1 for x in out['sources'].values() if x.get('verified'))
          if verified==0: out['status']='failed'
          elif verified<3: out['status']='partial'

          with open('stock-lab/market-data.json','w',encoding='utf-8') as f:
              json.dump(out,f,ensure_ascii=False,indent=2)
          PY
      - name: Commit snapshot if changed
        run: |
          if git diff --quiet -- stock-lab/market-data.json; then
            echo 'No changes'
            exit 0
          fi
          git config user.name 'stocklab-bot'
          git config user.email 'stocklab-bot@users.noreply.github.com'
          git add stock-lab/market-data.json
          git commit -m 'update verified market snapshot'
          git push
