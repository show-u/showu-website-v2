name: StockLab free TWSE history probe

on:
  push:
    paths:
      - '.github/workflows/stocklab-free-twse-history-probe.yml'
      - 'stock-lab/probe-twse-free-history.py'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe 2454 official free history
        run: |
          python stock-lab/probe-twse-free-history.py --stock 2454 --from-month 2021-01 --to-month 2026-09 --out /tmp/twse-2454.jsonl --sleep 0.25
      - name: Probe 2330 official free history
        run: |
          python stock-lab/probe-twse-free-history.py --stock 2330 --from-month 2021-01 --to-month 2026-09 --out /tmp/twse-2330.jsonl --sleep 0.25
      - name: Validate continuity and coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for code in ('2454','2330'):
              p=Path(f'/tmp/twse-{code}.jsonl')
              rows=[json.loads(x) for x in p.read_text(encoding='utf-8').splitlines() if x.strip()]
              dates=[r['date'] for r in rows]
              assert len(rows) > 1000, (code,len(rows))
              assert len(dates)==len(set(dates)), f'{code} duplicate dates'
              assert all(r['market']=='TWSE' and r['ticker']==code and r['provenance']=='observed' for r in rows)
              assert all(r['high']>=max(r['open'],r['low'],r['close']) for r in rows)
              assert all(r['low']<=min(r['open'],r['high'],r['close']) for r in rows)
              rep=json.loads(Path(str(p)+'.report.json').read_text(encoding='utf-8'))
              empty=[x['month'] for x in rep['audit'] if x['rows']==0]
              print(json.dumps({'ticker':code,'rows':len(rows),'first_date':dates[0],'last_date':dates[-1],'empty_months':empty},ensure_ascii=False))
          PY
