name: Staged universe coverage audit
on:
 push:
  branches: [main]
  paths: ['stock-api/research/staged-universe-coverage-audit.js','.github/workflows/staged-universe-coverage-audit.yml']
jobs:
 audit:
  runs-on: ubuntu-latest
  timeout-minutes: 60
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-node@v4
     with: {node-version: '20'}
   - run: node stock-api/research/staged-universe-coverage-audit.js
