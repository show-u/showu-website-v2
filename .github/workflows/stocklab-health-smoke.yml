name: StockLab health panel smoke

on:
  push:
    paths:
      - 'stock-lab/health.js'
      - 'stock-lab/index.html'
      - '.github/workflows/stocklab-health-smoke.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify health panel
        run: |
          node --check stock-lab/health.js
          grep -q './health.js' stock-lab/index.html
          grep -q 'tpex-health.json' stock-lab/health.js
          grep -q 'market-data.json' stock-lab/health.js
          grep -q 'futures-data.json' stock-lab/health.js
          echo 'health panel smoke checks passed'
