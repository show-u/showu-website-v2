name: Event surprise backtest
on:
 push:
  branches: [main]
  paths: ['stock-api/research/event-surprise-backtest.js','.github/workflows/event-surprise-backtest.yml']
jobs:
 run:
  runs-on: ubuntu-latest
  timeout-minutes: 60
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-node@v4
     with: {node-version: '20'}
   - run: node stock-api/research/event-surprise-backtest.js
