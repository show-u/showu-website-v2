name: Full universe feasibility
on:
 push:
  branches: [main]
  paths: ['stock-api/research/full-universe-feasibility.js','.github/workflows/full-universe-feasibility.yml']
jobs:
 run:
  runs-on: ubuntu-latest
  timeout-minutes: 20
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-node@v4
     with: {node-version: '20'}
   - run: node stock-api/research/full-universe-feasibility.js
