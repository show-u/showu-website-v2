name: StockLab official OGDL context probe

on:
  workflow_dispatch:
  push:
    paths:
      - 'stock-lab/official-open-context-registry.json'
      - 'stock-lab/probe-official-open-context.py'
      - '.github/workflows/stocklab-open-context-probe.yml'

permissions:
  contents: write

concurrency:
  group: stocklab-open-context-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax check
        run: python -m py_compile stock-lab/probe-official-open-context.py

      - name: Probe only official OGDL resources
        run: |
          python stock-lab/probe-official-open-context.py \
            --registry stock-lab/official-open-context-registry.json \
            --out stock-lab/official-open-context-coverage.json

      - name: Enforce coverage probe truth contract
        run: |
          python - <<'PY'
          import json,re
          reg=json.load(open('stock-lab/official-open-context-registry.json',encoding='utf-8'))
          x=json.load(open('stock-lab/official-open-context-coverage.json',encoding='utf-8'))
          assert x['schema_version']==1
          assert x['license']=='OGDL-1.0'
          assert x['raw_payload_persisted'] is False
          assert x['imputation_used'] is False
          assert x['any_source_activated'] is False
          assert len(x['results'])==len(reg['candidates'])
          ids={z['id'] for z in x['results']};assert ids==set(reg['candidates'])
          assert any(z.get('fetch_ok') for z in x['results']), 'all official OGDL probes failed'
          sha=re.compile(r'^[0-9a-f]{64}$')
          for z in x['results']:
              assert z['activated'] is False and z['imputation_used'] is False
              assert z['license']=='OGDL-1.0'
              assert z['activation_status']=='PROBE_ONLY_NOT_ACTIVATED'
              if z.get('fetch_ok'):
                  assert sha.match(z.get('payload_sha256',''))
                  assert int(z.get('payload_bytes') or 0)>0
                  assert z.get('row_count') is not None
              if z.get('historical_coverage_candidate'):
                  assert z.get('unique_dates',0)>=120
                  assert z.get('span_days',0)>=365
          print('official OGDL context probe truth contract passed')
          PY

      - name: Persist derived coverage metadata only
        run: |
          if [ -z "$(git status --porcelain -- stock-lab/official-open-context-coverage.json)" ]; then
            echo 'No coverage metadata change'
            exit 0
          fi
          git config user.name 'stocklab-bot'
          git config user.email 'stocklab-bot@users.noreply.github.com'
          git add stock-lab/official-open-context-coverage.json
          git commit -m 'update official OGDL context coverage metadata'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
