name: StockLab model validation gate

on:
  workflow_dispatch:
  schedule:
    - cron: '40 9 * * 6'
  push:
    paths:
      - 'stock-lab/model-validation-gate.py'
      - 'stock-lab/model-validation-status.json'
      - 'stock-lab/verification-policy.json'
      - 'stock-lab/runtime-config.js'
      - '.github/workflows/stocklab-model-validation.yml'

permissions:
  contents: read

jobs:
  validation-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m py_compile stock-lab/model-validation-gate.py
      - name: Run fail-closed model validation gate
        run: |
          python stock-lab/model-validation-gate.py \
            --status-manifest stock-lab/model-validation-status.json \
            --out /tmp/stocklab-model-validation.json
      - name: Validate prediction gates and rule-based holding separation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          x=json.load(open('/tmp/stocklab-model-validation.json',encoding='utf-8'))
          manifest=json.load(open('stock-lab/model-validation-status.json',encoding='utf-8'))
          policy=json.load(open('stock-lab/verification-policy.json',encoding='utf-8'))
          expected={'entry_decision_9plus3','entry_scanner_9plus3','holding_rules','entry_reference_rules','sector_research_rules'}
          allowed_nonpass={'FAIL','INSUFFICIENT','BLOCKED_LEGAL_SOURCE','BLOCKED_DATA_LAYER'}

          assert x['schema_version']==10 and x['architecture']=='free-official-first-price-structure-plus-9plus3-decision-v16'
          assert manifest['schema_version']==10 and manifest['architecture']==x['architecture']
          assert x['formal_prediction_validation_status'] in allowed_nonpass
          assert x['network_history_collection_performed'] is False
          assert x['network_history_collection_disabled'] is True
          assert x['legacy_horizon_entry_results_are_production_valid'] is False
          assert set(x['models'])==expected and set(manifest['models'])==expected

          for name in ('entry_decision_9plus3','entry_scanner_9plus3'):
              assert x['models'][name]==manifest['models'][name]['status']
              assert x['models'][name] in allowed_nonpass

          assert x['models']['holding_rules']=='AVAILABLE_RULE_BASED'
          assert x['models']['entry_reference_rules']=='AVAILABLE_RULE_BASED'
          assert x['models']['sector_research_rules']=='AVAILABLE_RULE_BASED'
          assert manifest['models']['holding_rules']['oos_required_for_rule_output'] is False
          assert manifest['models']['holding_rules']['oos_required_for_statistical_claims'] is True
          assert manifest['models']['holding_rules']['formula']=='TW-holding-9plus3-v6'
          assert manifest['models']['holding_rules']['partial_verified_evidence_may_inform_rule_action'] is True
          assert policy['output_contract']['deterministic_holding_rules_require_oos_pass'] is False
          assert policy['backtest_validation']['deterministic_holding_rules_require_oos'] is False

          assert x['truth_contract']['deterministic_holding_rules_oos_required'] is False
          assert x['truth_contract']['holding_execution_reference_requires_oos'] is False
          assert x['truth_contract']['holding_execution_reference_minimum_verified_bars']==1
          assert x['truth_contract']['holding_structural_risk_line_minimum_bars']==60
          assert x['truth_contract']['numeric_exit_requires_complete_9plus3'] is False

          src=Path('stock-lab/model-validation-gate.py').read_text(encoding='utf-8')
          assert 'NETWORK_HISTORY_COLLECTION_DISABLED = True' in src
          for forbidden in ('backtest-result.json','backtest-taiwan-v3.py','holding-exit-validation-protocol.json','minimum_oos_episodes_total','minimum_oos_securities','urllib.request','www.twse.com.tw','www.tpex.org.tw','ThreadPoolExecutor','fetch_twse_month','fetch_tpex_month'):
              assert forbidden not in src,forbidden

          assert not Path('stock-lab/backtest-taiwan-v3.py').exists(),'obsolete backtest-taiwan-v3.py must stay deleted'
          assert not Path('stock-lab/backtest-result.json').exists(),'obsolete backtest-result.json must stay deleted'
          assert not Path('stock-lab/backtest-model.py').exists(),'obsolete horizon backtest-model.py must stay deleted'
          assert not Path('.github/workflows/stocklab-backtest.yml').exists(),'obsolete stocklab-backtest.yml must stay deleted'
          print('PASS: prediction claims remain fail-closed; deterministic holding rules are not OOS-locked')
          PY
      - name: Publish validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: stocklab-model-validation-gate
          path: /tmp/stocklab-model-validation.json
          retention-days: 7
