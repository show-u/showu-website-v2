name: Update StockLab licensed market facts

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-stocklab-market-facts.yml'
      - 'stock-lab/official-schema-registry.json'
      - 'stock-lab/source-registry.json'
  schedule:
    - cron: '20 8 * * 1-5'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch exact-schema OGDL daily facts
        run: |
          python - <<'PY'
          import hashlib,json,urllib.request,time
          from datetime import datetime,timezone
          from urllib.parse import urlparse
          OUT='stock-lab/market-facts.json'
          schemas=json.load(open('stock-lab/official-schema-registry.json',encoding='utf-8'))['schemas']
          sources=json.load(open('stock-lab/source-registry.json',encoding='utf-8'))['sources']
          specs=[
            ('TWSE','twse_stock_day_all_v1','twse_daily_snapshot'),
            ('TPEx','tpex_mainboard_daily_close_quotes_v1','tpex_daily_snapshot'),
          ]
          def fetch_json(url):
              err=None
              for attempt in range(1,4):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'StockLab-OGDL-MarketFacts/1.0','Accept':'application/json'})
                      with urllib.request.urlopen(req,timeout=30) as r:
                          body=r.read(); final=r.geturl()
                      return json.loads(body.decode('utf-8')),hashlib.sha256(body).hexdigest(),final
                  except Exception as e:
                      err=e
                      if attempt<3: time.sleep(attempt*2)
              raise err
          def num(v):
              s=str(v if v is not None else '').strip().replace(',','')
              if s in ('','-','--','—','N/A','NA'): return None
              try:return float(s)
              except:return None
          def norm_date(v):
              s=''.join(ch for ch in str(v or '') if ch.isdigit())
              if len(s)==7:
                  y=int(s[:3])+1911;return f'{y:04d}-{s[3:5]}-{s[5:7]}'
              if len(s)==8:return f'{s[:4]}-{s[4:6]}-{s[6:8]}'
              raise ValueError(f'unregistered date format: {v!r}')
          all_rows=[];markets={}
          for market,schema_id,source_id in specs:
              sch=schemas[schema_id];src=sources[source_id]
              assert sch['licence']=='OGDL-1.0' and src['license']=='OGDL-1.0' and src['legal_status']=='approved_open_data'
              assert sch['market']==market
              url=src['url'];host=urlparse(url).hostname
              allowed='openapi.twse.com.tw' if market=='TWSE' else 'www.tpex.org.tw'
              assert host==allowed,(market,host)
              raw,sha,final=fetch_json(url)
              if not isinstance(raw,list) or not raw:raise SystemExit(f'{market}: empty/non-list source')
              req=set(sch['required_fields']);mp=sch['mapping'];accepted=[];rejected=0
              for i,row in enumerate(raw):
                  if not isinstance(row,dict) or not req.issubset(row.keys()):rejected+=1;continue
                  try:
                      ticker=str(row[mp['ticker']]).strip();name=str(row[mp['name']]).strip();date=norm_date(row[mp['date']])
                      o,h,l,c=(num(row[mp[k]]) for k in ('open','high','low','close'))
                      vol=num(row[mp['volume']]);tv=num(row[mp['trade_value']])
                      if not ticker or not name or min(o or 0,h or 0,l or 0,c or 0)<=0:raise ValueError('invalid OHLC')
                      if h<max(o,l,c) or l>min(o,h,c):raise ValueError('impossible OHLC')
                      accepted.append({
                        'ticker':ticker,'name':name,'market':market,'date':date,
                        'open':o,'high':h,'low':l,'close':c,'volume':vol,'trade_value':tv,
                        'source_id':f"data.gov.tw:{sch['data_gov_dataset']}",
                        'source_schema':schema_id,'raw_sha256':sha,'licence':'OGDL-1.0',
                        'attribution':'金融監督管理委員會證券期貨局／'+('臺灣證券交易所' if market=='TWSE' else '證券櫃檯買賣中心'),
                        'provenance':'observed'
                      })
                  except Exception:
                      rejected+=1
              if market=='TWSE' and len(accepted)<1000:raise SystemExit(f'TWSE accepted too few: {len(accepted)}')
              if market=='TPEx' and len(accepted)<700:raise SystemExit(f'TPEx accepted too few: {len(accepted)}')
              latest=max(x['date'] for x in accepted)
              accepted=[x for x in accepted if x['date']==latest]
              markets[market]={'latest_date':latest,'row_count':len(accepted),'rejected':rejected,'dataset_id':sch['data_gov_dataset'],'licence':'OGDL-1.0','source_url':url,'raw_sha256':sha}
              all_rows.extend(accepted)
          all_rows.sort(key=lambda r:(r['market'],r['ticker']))
          new_core={'schema_version':1,'source':'ogdl-normalized-market-facts','licence':'OGDL-1.0','purpose':'Latest completed-session normalized market facts from registered OGDL sources; no imputation.','no_imputation':True,'markets':markets,'rows':all_rows}
          old=None
          try:old=json.load(open(OUT,encoding='utf-8'))
          except:pass
          if old:
              old_core={k:old.get(k) for k in new_core}
              if old_core==new_core:
                  print('No market fact change');raise SystemExit(0)
          new_core['generated_at']=datetime.now(timezone.utc).isoformat()
          with open(OUT,'w',encoding='utf-8') as f:json.dump(new_core,f,ensure_ascii=False,separators=(',',':'))
          print(json.dumps({'markets':markets,'rows':len(all_rows)},ensure_ascii=False))
          PY
      - name: Validate public fact contract
        run: |
          python - <<'PY'
          import json,re
          x=json.load(open('stock-lab/market-facts.json',encoding='utf-8'))
          assert x['schema_version']==1 and x['source']=='ogdl-normalized-market-facts'
          assert x['licence']=='OGDL-1.0' and x['no_imputation'] is True
          assert set(x['markets'])=={'TWSE','TPEx'} and len(x['rows'])>1500
          for r in x['rows']:
              assert r['licence']=='OGDL-1.0' and r['provenance']=='observed'
              assert re.fullmatch(r'\d{4}-\d{2}-\d{2}',r['date'])
              assert all(float(r[k])>0 for k in ('open','high','low','close'))
              assert re.fullmatch(r'[a-f0-9]{64}',r['raw_sha256'])
          print('market-facts contract passed')
          PY
      - name: Commit facts when changed
        run: |
          if git diff --quiet -- stock-lab/market-facts.json; then echo 'No changes'; exit 0; fi
          git config user.name 'stocklab-bot'
          git config user.email 'stocklab-bot@users.noreply.github.com'
          git add stock-lab/market-facts.json
          git commit -m 'update licensed StockLab market facts'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
