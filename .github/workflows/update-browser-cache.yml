name: Update StockLab browser cache

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-browser-cache.yml'
  schedule:
    - cron: '40 7 * * 1-5'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build licensed same-origin cache
        run: |
          python - <<'PY'
          import json, urllib.request, hashlib, time, http.client
          from datetime import datetime, timezone
          from urllib.parse import urlparse
          UA={'User-Agent':'StockLab-browser-cache/2.0','Accept':'application/json'}
          DATASETS={
            'twse_snapshot':('https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL',11549,'金融監督管理委員會證券期貨局／臺灣證券交易所'),
            'twse_valuation':('https://openapi.twse.com.tw/v1/exchangeReport/BWIBBU_ALL',11764,'金融監督管理委員會證券期貨局／臺灣證券交易所'),
            'twse_revenue':('https://openapi.twse.com.tw/v1/opendata/t187ap05_L',18420,'金融監督管理委員會證券期貨局／臺灣證券交易所'),
            'twse_income':('https://openapi.twse.com.tw/v1/opendata/t187ap06_L_ci',91998,'金融監督管理委員會證券期貨局／臺灣證券交易所'),
            'twse_balance':('https://openapi.twse.com.tw/v1/opendata/t187ap07_L_ci',94831,'金融監督管理委員會證券期貨局／臺灣證券交易所'),
            'tpex_snapshot':('https://www.tpex.org.tw/openapi/v1/tpex_mainboard_daily_close_quotes',11370,'金融監督管理委員會證券期貨局／證券櫃檯買賣中心'),
            'tpex_valuation':('https://www.tpex.org.tw/openapi/v1/tpex_mainboard_peratio_analysis',11373,'金融監督管理委員會證券期貨局／證券櫃檯買賣中心'),
            'tpex_institution':('https://www.tpex.org.tw/openapi/v1/tpex_3insti_daily_trading',11856,'金融監督管理委員會證券期貨局／證券櫃檯買賣中心'),
            'tpex_revenue':('https://www.tpex.org.tw/openapi/v1/mopsfin_t187ap05_O',56510,'金融監督管理委員會證券期貨局／證券櫃檯買賣中心'),
            'tpex_income':('https://www.tpex.org.tw/openapi/v1/mopsfin_t187ap06_O_ci',94853,'金融監督管理委員會證券期貨局／證券櫃檯買賣中心'),
            'tpex_balance':('https://www.tpex.org.tw/openapi/v1/mopsfin_t187ap07_O_ci',91967,'金融監督管理委員會證券期貨局／證券櫃檯買賣中心'),
          }
          ALLOWED={'openapi.twse.com.tw','www.tpex.org.tw'}
          def get(name,url):
            last=None
            for attempt in range(1,5):
              try:
                req=urllib.request.Request(url,headers=UA)
                with urllib.request.urlopen(req,timeout=120) as r:
                  host=(urlparse(r.geturl()).hostname or '').lower()
                  if host not in ALLOWED: raise RuntimeError(f'{name}: unexpected host {host}')
                  expected=r.headers.get('Content-Length');raw=r.read()
                  if expected and len(raw)!=int(expected):raise http.client.IncompleteRead(raw,int(expected)-len(raw))
                  data=json.loads(raw.decode('utf-8'))
                  if not isinstance(data,list) or not data:raise RuntimeError(f'{name}: empty/non-list')
                  return data,hashlib.sha256(raw).hexdigest(),r.geturl()
              except Exception as e:
                last=e;print(f'{name}: attempt {attempt}/4 failed: {type(e).__name__}: {e}')
                if attempt<4:time.sleep(attempt*4)
            raise RuntimeError(f'{name}: failed after retries: {last}')
          out={
            'schema_version':2,
            'generated_at':datetime.now(timezone.utc).isoformat(),
            'source':'licensed-open-data-cache',
            'licence':'政府資料開放授權條款-第1版 / OGDL-1.0',
            'licence_url':'https://data.gov.tw/license',
            'datasets':{},'meta':{}
          }
          for name,(url,dataset_id,attribution) in DATASETS.items():
            data,sha,final=get(name,url);out['datasets'][name]=data
            out['meta'][name]={
              'count':len(data),'sha256':sha,'url':url,'final_url':final,
              'data_gov_dataset':dataset_id,'licence':'OGDL-1.0','licence_verified':True,
              'attribution':attribution
            }
          with open('stock-lab/browser-data.json','w',encoding='utf-8') as f:json.dump(out,f,ensure_ascii=False,separators=(',',':'))
          print({k:v['count'] for k,v in out['meta'].items()})
          PY
      - name: Validate legal provenance and cache
        run: |
          python - <<'PY'
          import json
          x=json.load(open('stock-lab/browser-data.json',encoding='utf-8'))
          assert x['schema_version']==2 and x['source']=='licensed-open-data-cache'
          assert x['licence']=='政府資料開放授權條款-第1版 / OGDL-1.0'
          req={'twse_snapshot','twse_valuation','twse_revenue','twse_income','twse_balance','tpex_snapshot','tpex_valuation','tpex_institution','tpex_revenue','tpex_income','tpex_balance'}
          assert set(x['datasets'])==req
          for k in req:
            m=x['meta'][k]
            assert m['count']>0 and len(m['sha256'])==64
            assert m['licence_verified'] is True and m['licence']=='OGDL-1.0'
            assert isinstance(m['data_gov_dataset'],int) and m['data_gov_dataset']>0
            assert m['attribution']
          print('licensed browser cache validated')
          PY
      - name: Commit cache if changed
        run: |
          if [ -z "$(git status --porcelain -- stock-lab/browser-data.json)" ]; then echo 'No changes'; exit 0; fi
          git config user.name 'stocklab-bot'
          git config user.email 'stocklab-bot@users.noreply.github.com'
          git add stock-lab/browser-data.json
          git commit -m 'update licensed browser data cache'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
