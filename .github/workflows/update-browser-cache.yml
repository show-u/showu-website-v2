name: Update StockLab browser cache

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-browser-cache.yml'
  schedule:
    - cron: '40 7 * * 1-5'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build verified same-origin cache
        run: |
          python - <<'PY'
          import json, urllib.request, hashlib
          from datetime import datetime, timezone
          from urllib.parse import urlparse
          UA={'User-Agent':'StockLab-browser-cache/1.0'}
          URLS={
            'twse_snapshot':'https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL',
            'twse_valuation':'https://openapi.twse.com.tw/v1/exchangeReport/BWIBBU_ALL',
            'twse_revenue':'https://openapi.twse.com.tw/v1/opendata/t187ap05_L',
            'twse_income':'https://openapi.twse.com.tw/v1/opendata/t187ap06_L_ci',
            'twse_balance':'https://openapi.twse.com.tw/v1/opendata/t187ap07_L_ci',
            'tpex_snapshot':'https://www.tpex.org.tw/openapi/v1/tpex_mainboard_daily_close_quotes',
            'tpex_valuation':'https://www.tpex.org.tw/openapi/v1/tpex_mainboard_peratio_analysis',
            'tpex_institution':'https://www.tpex.org.tw/openapi/v1/tpex_3insti_daily_trading',
            'tpex_revenue':'https://www.tpex.org.tw/openapi/v1/mopsfin_t187ap05_O',
            'tpex_income':'https://www.tpex.org.tw/openapi/v1/mopsfin_t187ap06_O_ci',
            'tpex_balance':'https://www.tpex.org.tw/openapi/v1/mopsfin_t187ap07_O_ci',
          }
          ALLOWED={'openapi.twse.com.tw','www.tpex.org.tw'}
          def get(name,url):
            req=urllib.request.Request(url,headers=UA)
            with urllib.request.urlopen(req,timeout=90) as r:
              raw=r.read(); host=(urlparse(r.geturl()).hostname or '').lower()
              if host not in ALLOWED: raise RuntimeError(f'{name}: unexpected host {host}')
              data=json.loads(raw.decode('utf-8'))
              if not isinstance(data,list) or not data: raise RuntimeError(f'{name}: empty/non-list')
              return data,hashlib.sha256(raw).hexdigest(),r.geturl()
          out={'schema_version':1,'generated_at':datetime.now(timezone.utc).isoformat(),'source':'official-mirror','datasets':{},'meta':{}}
          for name,url in URLS.items():
            data,sha,final=get(name,url);out['datasets'][name]=data;out['meta'][name]={'count':len(data),'sha256':sha,'url':url,'final_url':final}
          with open('stock-lab/browser-data.json','w',encoding='utf-8') as f: json.dump(out,f,ensure_ascii=False,separators=(',',':'))
          print({k:v['count'] for k,v in out['meta'].items()})
          PY
      - name: Validate cache
        run: |
          python - <<'PY'
          import json
          x=json.load(open('stock-lab/browser-data.json',encoding='utf-8'))
          assert x['schema_version']==1 and x['source']=='official-mirror'
          req={'twse_snapshot','twse_valuation','twse_revenue','twse_income','twse_balance','tpex_snapshot','tpex_valuation','tpex_institution','tpex_revenue','tpex_income','tpex_balance'}
          assert set(x['datasets'])==req
          for k in req:
            assert x['meta'][k]['count']>0 and len(x['meta'][k]['sha256'])==64
          print('browser cache validated')
          PY
      - name: Commit cache if changed
        run: |
          if git diff --quiet -- stock-lab/browser-data.json; then echo 'No changes'; exit 0; fi
          git config user.name 'stocklab-bot'
          git config user.email 'stocklab-bot@users.noreply.github.com'
          git add stock-lab/browser-data.json
          git commit -m 'update verified browser data cache'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
