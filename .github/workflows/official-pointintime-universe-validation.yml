name: Official point-in-time universe validation
on:
 push:
  branches: [main]
  paths: ['stock-api/research/official-pointintime-universe-validation.py','.github/workflows/official-pointintime-universe-validation.yml']
jobs:
 run:
  runs-on: ubuntu-latest
  timeout-minutes: 60
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-python@v5
     with: {python-version: '3.12'}
   - run: pip install pandas lxml requests python-dateutil
   - run: python stock-api/research/official-pointintime-universe-validation.py
