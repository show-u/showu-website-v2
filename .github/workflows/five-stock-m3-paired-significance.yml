name: Five-stock M3 paired significance
on:
  push:
    branches: [main]
    paths:
      - 'stock-api/research/five-stock-m3-paired-significance.js'
      - '.github/workflows/five-stock-m3-paired-significance.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node stock-api/research/five-stock-m3-paired-significance.js
