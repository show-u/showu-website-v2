name: StockLab session holding contract

on:
  push:
    paths:
      - 'stock-lab/session-context.js'
      - 'stock-lab/public-output.js'
      - 'stock-lab/holding-model.js'
      - 'stock-lab/holding-router.js'
      - 'stock-lab/position-input.js'
      - 'stock-lab/same-origin-cache.js'
      - 'stock-lab/market-facts.json'
      - 'stock-lab/hard-policy.js'
      - 'stock-lab/verification-policy.json'
      - 'stock-lab/index.html'
      - '.github/workflows/stocklab-session-holding-contract.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax checks
        run: |
          for f in session-context public-output holding-model holding-router position-input hard-policy same-origin-cache; do node --check "stock-lab/$f.js"; done
      - name: Session and deterministic holding invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          R=lambda p:Path(p).read_text(encoding='utf-8')
          idx=R('stock-lab/index.html');sess=R('stock-lab/session-context.js');public=R('stock-lab/public-output.js')
          hold=R('stock-lab/holding-model.js');router=R('stock-lab/holding-router.js');pos=R('stock-lab/position-input.js')
          hard=R('stock-lab/hard-policy.js');cache=R('stock-lab/same-origin-cache.js')
          policy=json.loads(R('stock-lab/verification-policy.json'))

          # Session truth: time controls labels/executability; data date controls which completed session is known.
          for text in ('BEFORE_ORDERS','PREOPEN','CONTINUOUS','CLOSING_AUCTION','AFTER_CLOSE','WAITING_TODAY_CLOSE_DATA','STALE_BASE_DATE','IMPOSSIBLE_CURRENT_CLOSE'):
              assert text in sess,text
          assert '盤中僅供參考，不以昨日資料重算現在價格' in sess
          assert 'StockLabSessionContext.resolve' in public

          # Holding is NOT the old predictive/OOS-locked exit engine.
          assert "model:'TW-holding-9plus3-v6'" in hold
          assert "validation:'9PLUS3_WEIGHTED_RULE_BASED'" in hold
          assert 'requiredBars:()=>1' in hold
          assert 'Numeric exit prices are NEVER replaced by the previous-session low' in hold
          assert 'NOT_REQUIRED_FOR_RULE_BASED_OUTPUT' in hold
          assert 'model.analyze(p,modelBars' in router
          assert '決策信心指數' in router
          assert '持股與出場管理' in router and '結構風險線' in router and '目前建議動作' in router
          assert 'decisionConfidenceIndex' in hold and 'StockLabEntryDecision?.exitPlan' in hold
          assert 'api.holding(' not in router
          assert '正式出場時機／觸發價格尚未解鎖' not in router

          # Market facts must come from the normalized OGDL source, never the deleted browser-data cache.
          assert 'StockLabSameOrigin' in router
          assert "row.licence!=='OGDL-1.0'" in router
          assert "mode:'licensed-normalized-market-facts'" in cache
          assert 'browser-data.json' not in router+cache

          # User position provenance only.
          for text in ('user_observed','derived_from_user_lots','缺值不補 0','weighted=totalShares?sumCost/totalShares:null','holdBuyTime','validDateTime(bt)','請完整輸入成本均價、目前持有股數與首次買入時間'):
              assert text in pos+idx,text
          assert 'holdTotalCost' not in idx
          assert 'const tc=a*sh' in pos and 'derived_from_average_cost_times_shares' in pos
          for k in ('THREE_INPUT_HOLDING_POSITION','EXECUTABLE_ENTRY_ONLY'):
              assert k in policy['absolute_invariants'],k

          # OOS applies to statistical/predictive claims, not deterministic holding rules.
          assert policy['prediction_requirements']['holding_rules']['oos_required'] is False
          assert policy['history_requirements']['holding_rules']['minimum_verified_closes'] == 1
          assert policy['output_contract']['deterministic_holding_rules_require_oos_pass'] is False
          assert policy['backtest_validation']['holding_statistical_claims_require_oos'] is True
          assert policy['backtest_validation']['deterministic_holding_rules_require_oos'] is False
          assert 'probability_calibrated:false' in hold
          assert '決策信心指數' in hold and '不是勝率' in hold

          print('PASS: session truth + rule-based holding path; obsolete OOS exit lock absent')
          PY
