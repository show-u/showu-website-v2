name: StockLab no-bypass truth gate

on:
  push:
    paths:
      - 'stock-lab/**'
      - '.github/workflows/stocklab-no-bypass.yml'
  workflow_dispatch:

jobs:
  no-bypass:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce Taiwan truth and no-bypass invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          R=lambda p:Path(p).read_text(encoding='utf-8')
          idx=R('stock-lab/index.html')
          router=R('stock-lab/market-router.js')
          holding=R('stock-lab/holding-router.js')
          usable=R('stock-lab/holding-usable.js')
          top10=R('stock-lab/top10-gate.js')
          pos=R('stock-lab/position-input.js')
          cache=R('stock-lab/same-origin-cache.js')
          hard=R('stock-lab/hard-policy.js')
          runtime=R('stock-lab/runtime-config.js')
          policy=json.loads(R('stock-lab/verification-policy.json'))
          sources=json.loads(R('stock-lab/history-source-registry.json'))
          readiness=json.loads(R('stock-lab/holding-readiness.json'))
          protocol=json.loads(R('stock-lab/holding-exit-validation-protocol.json'))

          # 1. Old horizon-specific buy-price UX must never return.
          banned=('短線入場區間','中期入場區間','長期佈局區間','fivePricePlan','data-five-price-matrix','id="horizon"','scanHorizon','<option value="1m"','<option value="3m"','<option value="long"')
          for x in banned:
              assert x not in idx+router+top10, f'legacy horizon buy path returned: {x}'
          assert '不選短／中／長' in idx

          # 2. Executable buy/scan/holding numbers are backend-only.
          assert 'api.analyze(code)' in router
          assert 'api.scan()' in top10
          assert 'api.holding(code,p)' in holding
          assert '正式私有分析後端尚未啟用' in router+top10+holding
          for forbidden in ('StockLabEntryDecision.evaluate','openingGapStats','intradayPullbackStats','buildBuyPlan','localHolding(','StockLabHolding?.analyze','StockLabLicensedHistory'):
              assert forbidden not in router+holding, f'local production formula bypass returned: {forbidden}'
          executable='\n'.join(line for line in holding.splitlines() if not line.lstrip().startswith('//'))
          assert "oosStatus:'PASS'" not in executable
          assert 'imputation_used===true' in holding
          assert "backendResult(j,'holding')" in holding

          # 3. Target trading day is derived from verified data date + licensed calendar, never from clock alone.
          assert 'StockLabSessionContext' in router and 'StockLabSessionContext' in holding
          assert 'String(target)!==String(s.targetDate)' in router
          assert 'String(target)!==String(s.targetDate)' in holding
          assert '13:30 後也必須等當日官方收盤資料實際前進並完成驗證' in router
          assert '09:00 後沒有合法即時／延遲行情授權時不重算當日價格' in router

          # 4. Position facts can only be user observed or derived from user lots; no inferred cost/date/zero fill.
          for x in ('user_observed','derived_from_user_lots','缺值不補 0','weighted=totalShares?totalCost/totalShares:null','validDate(d)','正式出場分析需要有效首次買入日'):
              assert x in pos,x
          assert 'market-data inference' in pos
          assert 'averageCost:a' in pos and 'shares:s' in pos and 'buyDate:d' in pos
          assert '首次買入日（正式出場分析必要）' in idx

          # 5. Holding backend must independently attest every user position fact.
          for x in ('average_cost_verified!==true','shares_verified!==true','buy_date_verified!==true','validISODate(ctx.userBuyDate)'):
              assert x in hard,x
          for x in ('average_cost_verified!==true','shares_verified!==true','buy_date_verified!==true'):
              assert x in holding,x

          # 6. Same-origin data must be explicitly licensed and has no network fallback.
          assert "source!=='licensed-open-data-cache'" in cache
          assert "licence!=='政府資料開放授權條款-第1版 / OGDL-1.0'" in cache
          assert 'licence_verified!==true' in cache
          assert 'data_gov_dataset' in cache and 'attribution' in cache
          assert 'No remote fallback' in cache
          assert 'remoteFallback:false' in cache
          assert 'remoteJget' not in cache

          # 7. TOP10 may not silently compute a browser-local replacement ranking.
          for forbidden in ('jget(','hist(','tech(','combine(','adaptiveBand','entryLow','entryHigh'):
              assert forbidden not in top10, f'local TOP10 fallback returned: {forbidden}'
          assert 'oos_validation_passed!==true' in top10
          assert 'entry_range_execution_validated!==true' in top10
          assert 'confidence_calibrated!==true' in top10

          # 8. Hard policy rejects missing legality, imputation, unverified OOS, uncalibrated confidence.
          for x in ('legal_source_verified!==true','imputation_used===true','oos_validation_passed!==true','confidence_calibrated===true','trading_calendar_verified!==true'):
              assert x in hard,x
          for k in ('LEGAL_SOURCE_ONLY','NO_IMPUTATION','FACT_ESTIMATE_SEPARATION','TRACEABILITY','FAIL_CLOSED','NO_HORIZON_BUY_MODEL','POSITION_INPUT_PROVENANCE','NO_FAKE_CONFIDENCE','NO_UNBUYABLE_ENTRY_BANDS','BUY_HOLDING_SEPARATION','EXIT_MODEL_SEPARATION'):
              assert k in policy['absolute_invariants'],k

          # 9. Public runtime remains closed until independently validated production gates are changed deliberately.
          assert 'allowLocalFallback:false' in runtime
          assert 'productionPredictionReady:false' in runtime

          # 10. Historical source candidates are not data until subscription/licence and ingestion are complete.
          assert sources['rules']['public_url_is_not_a_licence'] is True
          assert sources['rules']['no_scraping_for_backfill'] is True
          assert sources['rules']['no_unverified_third_party_backfill'] is True
          assert sources['rules']['no_imputation'] is True
          assert sources['sources']['ogdl_daily_forward_archive']['status']=='active'
          assert sources['sources']['ogdl_daily_forward_archive']['history_backfill'] is False
          for k in ('twse_eshop_daily_close','tpex_eshop_afterhours_history'):
              s=sources['sources'][k]
              assert s['status']=='candidate_not_subscribed', (k,s)
              assert s['scoring_allowed_before_activation'] is False, (k,s)

          # 11. Formal holding/exit output is machine-locked until history + OOS + execution + calibration all pass.
          assert readiness['schema_version']==1 and readiness['model']=='TW-holding-exit-v4'
          assert readiness['history']['no_imputation'] is True
          assert readiness['principle'].startswith('No verified gate')
          assert protocol['frozen_before_historical_oos'] is True
          assert protocol['non_negotiable_rules']['missing_inputs_are_not_imputed'] is True
          assert protocol['non_negotiable_rules']['no_horizon_selector'] is True
          assert protocol['non_negotiable_rules']['production_formula_must_equal_test_formula'] is True
          assert 'only from user input' in protocol['required_position_input']['rule']
          if readiness['overall_status']!='PASS':
              assert readiness['executable_exit_output'] is False
              assert readiness['blockers']
          else:
              assert readiness['executable_exit_output'] is True
              assert readiness['history']['status']=='PASS'
              assert readiness['oos']['status']=='PASS'
              assert readiness['oos']['execution_validated'] is True
              assert readiness['oos']['confidence_calibrated'] is True
              assert readiness['oos']['production_formula_match'] is True

          # 12. Public holding UI may ask to analyse exit timing, but cannot promise or fabricate an exit price before PASS.
          assert '分析出場時機</button>' in idx
          assert 'readinessStatus' in usable and 'holding-readiness.json' in usable
          assert '正式出場模型準備度' in usable
          assert "x.overall_status==='PASS'&&x.executable_exit_output===true" in usable
          for fake in ('建議賣出價','保證出場價','保證停損價'):
              assert fake not in usable, fake

          print('StockLab no-bypass truth gate passed')
          PY
