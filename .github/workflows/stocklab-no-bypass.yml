name: StockLab no-bypass truth gate

on:
  push:
    paths:
      - 'stock-lab/**'
      - '.github/workflows/stocklab-no-bypass.yml'
  workflow_dispatch:

jobs:
  no-bypass:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce Taiwan truth and no-bypass invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          R=lambda p:Path(p).read_text(encoding='utf-8')
          idx=R('stock-lab/index.html')
          router=R('stock-lab/market-router.js')
          holding=R('stock-lab/holding-router.js')
          hold_model=R('stock-lab/holding-model.js')
          top10=R('stock-lab/top10-gate.js')
          pos=R('stock-lab/position-input.js')
          cache=R('stock-lab/same-origin-cache.js')
          compliance=R('stock-lab/compliance-gate.js')
          hard=R('stock-lab/hard-policy.js')
          health=R('stock-lab/health.js')
          runtime=R('stock-lab/runtime-config.js')
          policy=json.loads(R('stock-lab/verification-policy.json'))
          sources=json.loads(R('stock-lab/history-source-registry.json'))

          # 1. Old horizon-specific buy-price UX must never return.
          banned=('短線入場區間','中期入場區間','長期佈局區間','fivePricePlan','data-five-price-matrix','id="horizon"','scanHorizon','<option value="1m"','<option value="3m"','<option value="long"')
          for x in banned:
              assert x not in idx+router+top10, f'legacy horizon buy path returned: {x}'
          assert '短／中／長' in idx

          # 2. Rule-based research outputs are allowed locally; predictive/live claims remain locked.
          assert '規則式入場研究' in router
          assert 'Math.min(cl,avg)' in router
          assert '不是盤中即時價、不是預測保證價' in router
          assert '各類股近期績優研究標的' in top10
          assert 'slice(0,5)' in top10 and 'SECTORS' in top10
          assert '這是研究候選，不是勝率排名' in top10
          for forbidden in ('StockLabEntryDecision.evaluate','openingGapStats','intradayPullbackStats','buildBuyPlan','勝率：','上漲機率：'):
              assert forbidden not in router+top10, f'predictive/local fake claim returned: {forbidden}'

          # 3. Existing-position management is intentionally different: verified facts may drive deterministic rules locally.
          assert 'StockLabHolding' in holding
          assert 'model.analyze(p,hb.bars' in holding
          assert "model:'TW-holding-rule-v3'" in hold_model
          assert "validation:'RULE_BASED'" in hold_model
          assert 'requiredBars:()=>1' in hold_model
          assert 'OOS status controls only statistical claims' in hold_model
          assert 'NOT_REQUIRED_FOR_RULE_BASED_OUTPUT' in hold_model
          assert 'confidence_calibrated:false' in hold_model
          assert 'imputation_used:false' in hold_model
          assert '這不是 OOS 鎖定模型' in holding
          assert '建議出場觸發價' in holding
          assert 'riskTriggerBasis' in hold_model and '上一完成交易日低點' in hold_model

          # 4. Holding rules still fail closed on legal source, verified close and actual user position facts.
          assert "ctx.legalSource!==true" in hold_model
          assert "ctx.priceVerified!==true" in hold_model
          assert "if(!r.length)throw Error('沒有可用的已驗證收盤資料')" in hold_model
          assert 'StockLabSameOrigin' in holding
          assert "row.licence!=='OGDL-1.0'" in holding
          assert '缺少的資料維持缺少，不以假資料補值' in holding
          assert '非盤中即時價' in holding

          # 5. Position facts can only be user observed or derived from user lots; no inferred cost/date/zero fill.
          for x in ('user_observed','derived_from_user_lots','derived_from_user_position','缺值不補 0','weighted=totalShares?sumCost/totalShares:null','validDateTime(bt)','請完整輸入首次買入時間、目前持有股數與目前成本均價'):
              assert x in pos,x
          assert 'market-data inference' in pos
          assert 'averageCost:a' in pos and 'shares:sh' in pos and 'totalCost:tc' in pos and 'buyTime:bt' in pos
          assert 'id="holdBuyTime"' in idx and 'type="datetime-local" required' in idx
          assert 'id="holdTotalCost"' not in idx
          assert 'const tc=a*sh' in pos

          # 6. The obsolete OOS-locked holding monitor must stay deleted and must never be loaded indirectly.
          assert not Path('stock-lab/holding-usable.js').exists(), 'obsolete holding-usable.js returned'
          assert 'holding-usable.js' not in idx+health, 'obsolete holding override returned'

          # 7. Current public data boundary uses only normalized OGDL facts; no obsolete cache or missing-data fallback.
          assert "mode:'licensed-normalized-market-facts'" in cache
          for text in ('persistentMirror:true','rawDatasetMirror:false','remoteFallback:false','cacheIsSource:true','missingDataFallback:false','market-facts.json'):
              assert text in cache,text
          assert 'browser-data.json' not in cache+compliance+holding+router
          assert 'StockLabSameOrigin' in router
          assert 'cache.latest(code)' in router
          assert 'ogdl-normalized-market-facts' in compliance
          assert "x.licence!=='OGDL-1.0'" in compliance
          assert '市場事實授權／版本驗證未通過' in compliance
          assert '不以 0、平均值、舊值或 AI 補齊' in compliance

          # 8. Statistical/predictive claims remain hard-gated; deterministic holding rules do not inherit that lock.
          for x in ('legal_source_verified!==true','imputation_used===true','oos_validation_passed!==true','confidence_calibrated===true','trading_calendar_verified!==true'):
              assert x in hard,x
          for k in ('LEGAL_SOURCE_ONLY','NO_IMPUTATION','FACT_ESTIMATE_SEPARATION','TRACEABILITY','FAIL_CLOSED','NO_HORIZON_BUY_MODEL','POSITION_INPUT_PROVENANCE','NO_FAKE_CONFIDENCE','NO_UNBUYABLE_ENTRY_BANDS','BUY_HOLDING_SEPARATION','EXIT_MODEL_SEPARATION','THREE_INPUT_HOLDING_POSITION','EXECUTABLE_ENTRY_ONLY','RULE_BASED_ENTRY_REFERENCE','SECTOR_RESEARCH_SHORTLIST'):
              assert k in policy['absolute_invariants'],k
          assert policy['prediction_requirements']['holding_rules']['oos_required'] is False
          assert policy['history_requirements']['holding_rules']['minimum_verified_closes'] == 1
          assert policy['output_contract']['deterministic_holding_rules_require_oos_pass'] is False
          assert policy['backtest_validation']['holding_statistical_claims_require_oos'] is True
          assert policy['backtest_validation']['deterministic_holding_rules_require_oos'] is False

          # 9. No fake probability/win-rate can leak from the rule-based holding path.
          assert "confidence_calibrated:false" in hold_model
          assert '不得顯示勝率、成功率、機率或校準信心指數' in hold_model
          for fake in ('保證出場價','保證停損價','勝率：','成功率：','上漲機率：'):
              assert fake not in holding+hold_model, fake

          # 10. Historical source candidates are not data until entitlement/licence and validation are complete.
          assert sources['rules']['public_url_is_not_a_licence'] is True
          assert sources['rules']['no_scraping_for_backfill'] is True
          assert sources['rules']['no_unverified_third_party_backfill'] is True
          assert sources['rules']['no_imputation'] is True
          assert sources['rules']['raw_licensed_data_never_enters_public_repo'] is True
          og=sources['sources']['ogdl_daily_forward_archive']
          assert og['status']=='active_forward_archive_only'
          assert og['history_backfill'] is False
          assert og.get('scoring_allowed_for_historical_backfill') is False

          # 11. General production predictions stay locked while deterministic research/holding paths remain available.
          assert 'productionPredictionReady:false' in runtime
          assert 'ruleBasedEntryReferenceEnabled:true' in runtime
          assert 'sectorResearchEnabled:true' in runtime
          assert 'no OOS lock' in holding
          assert 'actionable deterministic holding rules' in holding

          print('StockLab no-bypass truth gate passed: obsolete holding lock absent; verified rule-based holding path allowed')
          PY
