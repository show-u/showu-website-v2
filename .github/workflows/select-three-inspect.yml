name: Select three new stocks and inspect fundamentals
on:
  push:
    branches: [main]
    paths:
      - 'stock-api/research/select-three-inspect.js'
      - '.github/workflows/select-three-inspect.yml'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node stock-api/research/select-three-inspect.js
