name: StockLab licensed-history publication guard

on:
  push:
    paths:
      - 'stock-lab/history-licensed/**'
      - 'stock-lab/prepare-twmd-private-backfill.py'
      - 'stock-lab/private-backfill-rights-template.json'
      - '.gitignore'
      - '.github/workflows/stocklab-licensed-history-guard.yml'
      - '.github/workflows/stocklab-holding-exit-oos.yml'
      - 'stock-lab/history-source-registry.json'
      - 'stock-lab/licensed-data-contract.json'
  pull_request:
    paths:
      - 'stock-lab/history-licensed/**'
      - 'stock-lab/prepare-twmd-private-backfill.py'
      - 'stock-lab/private-backfill-rights-template.json'
      - '.gitignore'
      - '.github/workflows/stocklab-licensed-history-guard.yml'
      - '.github/workflows/stocklab-holding-exit-oos.yml'
      - 'stock-lab/history-source-registry.json'
      - 'stock-lab/licensed-data-contract.json'
  workflow_dispatch:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject licensed raw history and private evidence in public repository
        run: |
          set -euo pipefail
          bad="$(git ls-files 'stock-lab/history-licensed/**' | grep -v '^stock-lab/history-licensed/README.md$' || true)"
          if [ -n "$bad" ]; then
            echo 'ERROR: licensed/raw history must not be committed to the public repository:'
            echo "$bad"
            exit 1
          fi
          for p in \
            'stock-lab/history-licensed/*' \
            'stock-lab/private-backfill-work/' \
            'stock-lab/private-backfill-rights.json' \
            'stock-lab/.twmd-api-key'; do
            grep -Fq "$p" .gitignore || { echo "ERROR: missing .gitignore protection: $p"; exit 1; }
          done
          if git ls-files --error-unmatch stock-lab/private-backfill-rights.json >/dev/null 2>&1; then
            echo 'ERROR: completed private rights evidence is tracked in public repository'
            exit 1
          fi
          if git ls-files --error-unmatch stock-lab/.twmd-api-key >/dev/null 2>&1; then
            echo 'ERROR: TWMD API key file is tracked in public repository'
            exit 1
          fi
          echo 'licensed-history/private-evidence repository boundary passed'

      - name: Require rights template to remain fail-closed
        run: |
          python - <<'PY'
          import json
          p='stock-lab/private-backfill-rights-template.json'
          x=json.load(open(p,encoding='utf-8'))
          rights=(
            'commercial_use_allowed','api_acquisition_allowed','automated_processing_allowed',
            'derived_analysis_allowed','public_derived_output_allowed','private_storage_allowed',
            'processing_location_allowed')
          for k in rights:
              assert x.get(k) is False, f'template permission must default false: {k}'
          for k in ('provider','plan','terms_reference','terms_reviewed_date','evidence_reference','processing_location'):
              assert x.get(k)=='' or x.get(k) is None, f'template must not contain real entitlement evidence: {k}'
          notes=str(x.get('notes') or '')
          assert 'Template only' in notes and 'API keys' in notes and 'public repository' in notes
          print('private rights template is fail-closed')
          PY

      - name: Reject licensed raw acquisition in public CI
        run: |
          set -euo pipefail
          f='.github/workflows/stocklab-holding-exit-oos.yml'
          grep -Fq 'LICENSED_BUNDLE_DIR: /tmp/stocklab-no-licensed' "$f"
          python - <<'PY'
          import re
          from pathlib import Path
          text=Path('.github/workflows/stocklab-holding-exit-oos.yml').read_text(encoding='utf-8')
          bad=[]
          for n,line in enumerate(text.splitlines(),1):
              s=line.strip()
              if 'STOCKLAB_LICENSED_BUNDLE_URL' in line or 'STOCKLAB_LICENSED_BUNDLE_SHA256' in line:
                  bad.append((n,line))
              # Direct execution would be a network acquisition path. A subprocess fixture
              # is allowed only for the explicit fail-before-network rights-gate test below.
              if s.startswith('python stock-lab/prepare-twmd-private-backfill.py'):
                  bad.append((n,line))
              if re.search(r'\b(curl|wget)\b.*licensed',line,re.I) or re.search(r'\b(aws\s+s3|gsutil)\b.*licensed',line,re.I):
                  bad.append((n,line))
          if bad:
              print('ERROR: public CI must not fetch or stage licensed/private raw market history.')
              for n,line in bad: print(f'{n}: {line}')
              raise SystemExit(1)
          required=(
              'Public CI may syntax-check private importers but contains no private/licensed market-data acquisition.',
              'rm -rf "$LICENSED_BUNDLE_DIR"',
              'Prove TWMD importer refuses unconfirmed rights before network use',
              'explicit entitlement not confirmed',
          )
          for x in required:
              assert x in text,x
          print('licensed-history public-CI boundary passed')
          PY

      - name: Require legal acquisition gates in source registry
        run: |
          python - <<'PY'
          import json
          x=json.load(open('stock-lab/history-source-registry.json',encoding='utf-8'))
          r=x['rules']
          for k in (
              'public_url_is_not_a_licence',
              'no_purchase_before_terms_review',
              'no_automated_download_without_provider_permission',
              'no_third_party_cloud_processing_without_provider_permission',
              'raw_licensed_data_never_enters_public_repo',
              'raw_licensed_data_never_enters_public_ci_by_default',
              'derived_model_output_requires_confirmed_derived_use_right',
              'every_delivered_file_requires_sha256',
              'every_observation_requires_source_provenance'):
              assert r.get(k) is True, k
          gates=set(x['activation_gates'])
          required={
              'applicable_terms_retained_with_date_or_version',
              'written_permission_or_contract_reference_retained_when_terms_are_ambiguous',
              'automated_processing_right_confirmed',
              'derived_output_right_confirmed',
              'private_storage_right_confirmed',
              'processing_location_right_confirmed',
              'delivered_files_hash_verified',
              'semantic_ohlcv_validation_passed',
              'cross_check_against_official_recent observations passed'}
          assert required.issubset(gates), sorted(required-gates)
          twmd=x['sources']['twmd_api_private_backfill']
          assert twmd['status']=='candidate_entitlement_and_pit_review_required'
          assert twmd['scoring_allowed_before_activation'] is False
          assert twmd['formal_bundle_ready_from_twmd_price_alone'] is False
          assert twmd['private_staging_importer']=='stock-lab/prepare-twmd-private-backfill.py'
          print('legal acquisition gate contract passed')
          PY
