name: StockLab licensed-history publication guard

on:
  push:
    paths:
      - 'stock-lab/history-licensed/**'
      - '.gitignore'
      - '.github/workflows/stocklab-licensed-history-guard.yml'
      - '.github/workflows/stocklab-holding-exit-oos.yml'
      - 'stock-lab/build-holding-readiness.py'
      - 'stock-lab/run-holding-exit-oos.py'
  pull_request:
    paths:
      - 'stock-lab/history-licensed/**'
      - '.gitignore'
      - '.github/workflows/stocklab-licensed-history-guard.yml'
      - '.github/workflows/stocklab-holding-exit-oos.yml'
      - 'stock-lab/build-holding-readiness.py'
      - 'stock-lab/run-holding-exit-oos.py'
  workflow_dispatch:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject licensed raw history in public repository
        run: |
          set -euo pipefail
          bad="$(git ls-files 'stock-lab/history-licensed/**' | grep -v '^stock-lab/history-licensed/README.md$' || true)"
          if [ -n "$bad" ]; then
            echo 'ERROR: licensed/raw history must not be committed to the public repository:'
            echo "$bad"
            exit 1
          fi
          grep -Fq 'stock-lab/history-licensed/*' .gitignore
          echo 'licensed-history public boundary passed'

      - name: Require ephemeral runtime path for formal OOS
        run: |
          set -euo pipefail
          f='.github/workflows/stocklab-holding-exit-oos.yml'
          grep -Fq 'LICENSED_BUNDLE_DIR: /tmp/stocklab-history-licensed' "$f"
          if grep -Eq -- '--licensed-bundle-dir[[:space:]]+stock-lab/history-licensed|bundle-dir[[:space:]]+stock-lab/history-licensed' "$f"; then
            echo 'ERROR: formal OOS must not consume licensed raw history from the public repository workspace.'
            exit 1
          fi
          grep -Fq 'STOCKLAB_LICENSED_BUNDLE_URL' "$f"
          grep -Fq 'STOCKLAB_LICENSED_BUNDLE_SHA256' "$f"
          grep -Fq 'validate-licensed-bundle.py' "$f"
          grep -Fq 'Prove licensed raw history never entered repository workspace' "$f"
          echo 'runtime-only licensed history boundary passed'
