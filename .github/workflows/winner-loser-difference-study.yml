name: Winner loser difference study
on:
 push:
  branches: [main]
  paths: ['stock-api/research/winner-loser-difference-study.js','.github/workflows/winner-loser-difference-study.yml']
jobs:
 run:
  runs-on: ubuntu-latest
  timeout-minutes: 60
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-node@v4
     with: {node-version: '20'}
   - run: node stock-api/research/winner-loser-difference-study.js
