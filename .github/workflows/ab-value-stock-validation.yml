name: AB value-stock fresh validation
on:
  push:
    branches: [main]
    paths:
      - 'stock-api/research/ab-value-stock-validation.js'
      - '.github/workflows/ab-value-stock-validation.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node stock-api/research/ab-value-stock-validation.js
