name: StockLab holding-exit OOS

on:
  workflow_dispatch:
  push:
    paths:
      - 'stock-lab/history-ogdl/**'
      - 'stock-lab/history-licensed/**'
      - 'stock-lab/import-licensed-history.py'
      - 'stock-lab/holding-oos-evaluator.mjs'
      - 'stock-lab/gate-holding-evaluator.py'
      - 'stock-lab/run-holding-exit-oos.py'
      - 'stock-lab/build-holding-readiness.py'
      - 'stock-lab/holding-model.js'
      - 'stock-lab/holding-exit-validation-protocol.json'
      - 'stock-lab/history-source-registry.json'
      - 'stock-lab/holding-exit-history-context.json'
      - '.github/workflows/stocklab-holding-exit-oos.yml'

concurrency:
  group: stocklab-holding-exit-oos
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  oos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          python -m py_compile stock-lab/run-holding-exit-oos.py stock-lab/build-holding-readiness.py stock-lab/import-licensed-history.py stock-lab/gate-holding-evaluator.py
          node --check stock-lab/holding-oos-evaluator.mjs
      - name: Prove evaluator is production-equivalent and fail-closed without licensed history
        run: |
          rm -rf /tmp/stocklab-no-licensed
          mkdir -p /tmp/stocklab-no-licensed
          node stock-lab/holding-oos-evaluator.mjs \
            --bundle-dir /tmp/stocklab-no-licensed \
            --production stock-lab/holding-model.js \
            --out /tmp/holding-evaluator-empty.json
          python - <<'PY'
          import hashlib,json
          x=json.load(open('/tmp/holding-evaluator-empty.json',encoding='utf-8'))
          h=hashlib.sha256(open('stock-lab/holding-model.js','rb').read()).hexdigest()
          assert x['status']=='INSUFFICIENT'
          assert x['no_imputation'] is True and x['network_used'] is False
          assert x['production_formula_sha256']==h
          print('production-equivalent evaluator fail-closed contract passed')
          PY
      - name: Run production-equivalent evaluator when licensed history exists
        run: |
          if [ -f stock-lab/history-licensed/manifest.json ]; then
            node stock-lab/holding-oos-evaluator.mjs \
              --bundle-dir stock-lab/history-licensed \
              --production stock-lab/holding-model.js \
              --min-bars 120 --min-episodes 300 --min-securities 80 \
              --out /tmp/holding-evaluator.json
          else
            echo '{"schema_version":1,"status":"INSUFFICIENT","reason":"licensed bundle not present","no_imputation":true,"network_used":false}' > /tmp/holding-evaluator.json
          fi
      - name: Enforce market-regime truth gate
        run: |
          python stock-lab/gate-holding-evaluator.py \
            --evaluator /tmp/holding-evaluator.json \
            --bundle-dir stock-lab/history-licensed \
            --out /tmp/holding-evaluator-gated.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/holding-evaluator-gated.json',encoding='utf-8'))
          if x.get('market_regime_verified') is not True:
              assert x.get('regimes')==[]
              assert x.get('status')=='INSUFFICIENT'
          print('market regime truth gate:',x.get('market_regime_verified'))
          PY
      - name: Run formal holding-exit OOS gate
        run: |
          python stock-lab/run-holding-exit-oos.py \
            --manifest stock-lab/history-ogdl/manifest.json \
            --history-dir stock-lab/history-ogdl \
            --licensed-bundle-dir stock-lab/history-licensed \
            --protocol stock-lab/holding-exit-validation-protocol.json \
            --production stock-lab/holding-model.js \
            --out stock-lab/holding-exit-oos-result.json
      - name: Merge real evaluator facts into formal OOS artifact
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          e=json.load(open('/tmp/holding-evaluator-gated.json',encoding='utf-8'))
          o=json.load(open('stock-lab/holding-exit-oos-result.json',encoding='utf-8'))
          prod=hashlib.sha256(open('stock-lab/holding-model.js','rb').read()).hexdigest()
          if e.get('production_formula_sha256')==prod and e.get('network_used') is False and e.get('no_imputation') is True:
              o['production_formula_match']=e.get('production_formula_match') is True
              o['oos_episodes']=int(e.get('oos_episodes') or 0)
              o['oos_securities']=int(e.get('oos_securities') or 0)
              o['regimes']=list(e.get('regimes') or []) if e.get('market_regime_verified') is True else []
              o['market_regime_verified']=e.get('market_regime_verified') is True
              o['market_regime_blockers']=list(e.get('market_regime_blockers') or [])
              o['exit_execution_validated']=e.get('exit_execution_validated') is True
              o['confidence_calibrated']=e.get('confidence_calibrated') is True
              o['metrics']=e.get('metrics') if e.get('metrics') is not None else None
              o['evaluator_status']=e.get('status')
              o['evaluator_network_used']=False
              o['evaluator_no_imputation']=True
              o['blockers']=[b for b in o.get('blockers',[]) if 'production-equivalent evaluator' not in b]
              for b in o['market_regime_blockers']:
                  if b not in o['blockers']: o['blockers'].append(b)
          req=set(o.get('required_regimes') or [])
          enough=(o['oos_episodes']>=o['minimum_oos_episodes'] and o['oos_securities']>=o['minimum_oos_securities'] and o.get('market_regime_verified') is True and req.issubset(set(o.get('regimes') or [])))
          passed=(enough and o.get('exit_execution_validated') is True and o.get('confidence_calibrated') is True and o.get('production_formula_match') is True and not o.get('blockers'))
          o['status']='PASS' if passed else 'INSUFFICIENT'
          Path('stock-lab/holding-exit-oos-result.json').write_text(json.dumps(o,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('merged evaluator:',e.get('status'),'formal:',o['status'])
          PY
      - name: Validate OOS truth contract
        run: |
          python - <<'PY'
          import json
          x=json.load(open('stock-lab/holding-exit-oos-result.json',encoding='utf-8'))
          assert x['schema_version']==2 and x['model']=='TW-holding-exit-v4'
          assert x['pipeline_executed'] is True
          assert x['status'] in ('PASS','INSUFFICIENT')
          assert x['source']['class'] in ('ogdl_daily_archive','licensed_history_bundle')
          assert x['source']['licence']
          assert x['source']['provenance_rejections']>=0
          assert len(x['production_formula_sha256'])==64
          if x['status']!='PASS':
            assert x['blockers'] or x.get('evaluator_status')=='INSUFFICIENT'
            assert not (x['exit_execution_validated'] and x['confidence_calibrated'] and x['production_formula_match'] and x['oos_episodes']>=x['minimum_oos_episodes'] and x.get('market_regime_verified') is True)
          else:
            assert x['oos_episodes']>=x['minimum_oos_episodes']
            assert x['oos_securities']>=x['minimum_oos_securities']
            assert x.get('market_regime_verified') is True
            assert set(x['required_regimes']).issubset(set(x['regimes']))
            assert x['exit_execution_validated'] is True
            assert x['confidence_calibrated'] is True
            assert x['production_formula_match'] is True
          print('holding-exit OOS truth contract:',x['status'],x['source']['class'])
          PY
      - name: Rebuild public readiness from OOS artifact
        run: |
          python stock-lab/build-holding-readiness.py \
            --manifest stock-lab/history-ogdl/manifest.json \
            --licensed-bundle-dir stock-lab/history-licensed \
            --protocol stock-lab/holding-exit-validation-protocol.json \
            --sources stock-lab/history-source-registry.json \
            --oos stock-lab/holding-exit-oos-result.json \
            --out stock-lab/holding-readiness.json
      - name: Validate readiness remains fail-closed
        run: |
          python - <<'PY'
          import json
          x=json.load(open('stock-lab/holding-readiness.json',encoding='utf-8'))
          assert x['schema_version']==3 and x['model']=='TW-holding-exit-v4'
          assert x['selected_history_source']['kind'] in ('ogdl_daily_archive','licensed_history_bundle')
          a=x['activation_path']
          assert a['primary']=='licensed_historical_backfill'
          assert a['requires_waiting_120_trading_days'] is False
          assert 'never impute' in a['fallback']
          if x['selected_history_source']['kind']=='ogdl_daily_archive':
            assert a['status']=='pending_licensed_subscription_or_import'
          if x['overall_status']!='PASS':
            assert x['executable_exit_output'] is False
            assert x['blockers']
          else:
            assert x['executable_exit_output'] is True
            assert x['selected_history_source']['kind']=='licensed_history_bundle'
          print('holding readiness:',x['overall_status'],x['selected_history_source']['kind'],a['status'])
          PY
      - name: Persist OOS/readiness only when changed
        run: |
          if [ -z "$(git status --porcelain -- stock-lab/holding-exit-oos-result.json stock-lab/holding-readiness.json)" ]; then echo 'No OOS/readiness change'; exit 0; fi
          git config user.name 'stocklab-bot'
          git config user.email 'stocklab-bot@users.noreply.github.com'
          git add stock-lab/holding-exit-oos-result.json stock-lab/holding-readiness.json
          git commit -m 'update holding exit OOS readiness'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
