name: StockLab holding-exit OOS

on:
  workflow_dispatch:
  push:
    paths:
      - 'stock-lab/history-ogdl/**'
      - 'stock-lab/import-licensed-history.py'
      - 'stock-lab/prepare-twmd-private-backfill.py'
      - 'stock-lab/private-backfill-rights-template.json'
      - 'stock-lab/validate-licensed-bundle.py'
      - 'stock-lab/licensed-data-contract.json'
      - 'stock-lab/holding-oos-evaluator.mjs'
      - 'stock-lab/gate-holding-evaluator.py'
      - 'stock-lab/run-holding-exit-oos.py'
      - 'stock-lab/build-holding-readiness.py'
      - 'stock-lab/holding-model.js'
      - 'stock-lab/holding-exit-validation-protocol.json'
      - 'stock-lab/history-source-registry.json'
      - 'stock-lab/holding-exit-history-context.json'
      - '.github/workflows/stocklab-holding-exit-oos.yml'

concurrency:
  group: stocklab-holding-exit-oos
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  oos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LICENSED_BUNDLE_DIR: /tmp/stocklab-no-licensed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check
        run: |
          python -m py_compile stock-lab/run-holding-exit-oos.py stock-lab/build-holding-readiness.py stock-lab/import-licensed-history.py stock-lab/prepare-twmd-private-backfill.py stock-lab/validate-licensed-bundle.py stock-lab/gate-holding-evaluator.py
          node --check stock-lab/holding-oos-evaluator.mjs

      - name: Enforce public-CI legal boundary
        run: |
          set -euo pipefail
          rm -rf "$LICENSED_BUNDLE_DIR"
          mkdir -p "$LICENSED_BUNDLE_DIR"
          bad="$(git ls-files 'stock-lab/history-licensed/**' | grep -v '^stock-lab/history-licensed/README.md$' || true)"
          if [ -n "$bad" ]; then
            echo 'ERROR: licensed/raw history is tracked in the public repository:'
            echo "$bad"
            exit 1
          fi
          python - <<'PY'
          import re
          from pathlib import Path
          path=Path('.github/workflows/stocklab-holding-exit-oos.yml')
          forbidden_env='STOCKLAB_'+'LICENSED_BUNDLE_URL'
          transfer_tools=('cu'+'rl','wg'+'et')
          network_importer='python stock-lab/'+'prepare-twmd-private-backfill.py'
          hits=[]
          for n,line in enumerate(path.read_text(encoding='utf-8').splitlines(),1):
              s=line.strip()
              if forbidden_env in line:
                  hits.append((n,line))
              if s.startswith(network_importer):
                  hits.append((n,line))
              for tool in transfer_tools:
                  if re.search(rf'\b{tool}\b.*licensed',line,re.I):
                      hits.append((n,line))
          if hits:
              print('ERROR: public CI must not acquire licensed/private raw history.')
              for n,line in hits: print(f'{n}: {line}')
              raise SystemExit(1)
          print('Public CI may syntax-check private importers but contains no private/licensed market-data acquisition.')
          PY

      - name: Prove TWMD importer refuses unconfirmed rights before network use
        run: |
          python - <<'PY'
          import importlib.util,json,os,pathlib,sys,tempfile
          spec=importlib.util.spec_from_file_location('twmd_private','stock-lab/prepare-twmd-private-backfill.py')
          mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(mod)
          template=json.load(open('stock-lab/private-backfill-rights-template.json',encoding='utf-8'))
          # Fill only descriptive metadata. All entitlement booleans deliberately remain false.
          template.update({
              'provider':'TWMD','plan':'CI-negative-fixture','terms_reference':'fixture-only',
              'terms_reviewed_date':'2026-09-16','evidence_reference':'fixture-only',
              'processing_location':'CI-negative-fixture'})
          with tempfile.TemporaryDirectory() as td:
              root=pathlib.Path(td)
              rights=root/'rights.json';rights.write_text(json.dumps(template),encoding='utf-8')
              symbols=root/'symbols.csv';symbols.write_text('ticker,market\n2454,TWSE\n',encoding='utf-8')
              out=root/'private-out'
              os.environ['TWMD_API_KEY']='DUMMY_KEY_MUST_NOT_BE_USED'
              def no_network(*a,**k):
                  raise AssertionError('NETWORK_CALLED_BEFORE_RIGHTS_GATE')
              mod.urllib.request.urlopen=no_network
              old=sys.argv[:]
              sys.argv=['prepare-twmd-private-backfill.py','--symbols',str(symbols),'--start','2024-01-01','--end','2026-09-15','--rights-evidence',str(rights),'--out-dir',str(out)]
              try:
                  try:
                      mod.main()
                      raise AssertionError('importer unexpectedly accepted unconfirmed rights')
                  except SystemExit as e:
                      msg=str(e)
                      assert 'explicit entitlement not confirmed' in msg,msg
                      assert 'NETWORK_CALLED_BEFORE_RIGHTS_GATE' not in msg,msg
                      assert not out.exists(),'private output directory should not be created before rights gate passes'
                      print('TWMD_STAGING_REJECTED as required:',msg)
              finally:
                  sys.argv=old
          PY

      - name: Prove evaluator is production-equivalent and fail-closed without licensed history
        run: |
          node stock-lab/holding-oos-evaluator.mjs \
            --bundle-dir "$LICENSED_BUNDLE_DIR" \
            --production stock-lab/holding-model.js \
            --out /tmp/holding-evaluator.json
          python - <<'PY'
          import hashlib,json
          x=json.load(open('/tmp/holding-evaluator.json',encoding='utf-8'))
          h=hashlib.sha256(open('stock-lab/holding-model.js','rb').read()).hexdigest()
          assert x['status']=='INSUFFICIENT'
          assert x['no_imputation'] is True and x['network_used'] is False
          assert x['production_formula_sha256']==h
          print('public CI fail-closed contract passed')
          PY

      - name: Enforce market-regime truth gate
        run: |
          python stock-lab/gate-holding-evaluator.py \
            --evaluator /tmp/holding-evaluator.json \
            --bundle-dir "$LICENSED_BUNDLE_DIR" \
            --out /tmp/holding-evaluator-gated.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/holding-evaluator-gated.json',encoding='utf-8'))
          assert x.get('status')=='INSUFFICIENT'
          assert x.get('regimes')==[]
          print('public CI market-regime gate remains fail-closed')
          PY

      - name: Run public formal holding-exit gate using lawful forward archive only
        run: |
          python stock-lab/run-holding-exit-oos.py \
            --manifest stock-lab/history-ogdl/manifest.json \
            --history-dir stock-lab/history-ogdl \
            --licensed-bundle-dir "$LICENSED_BUNDLE_DIR" \
            --protocol stock-lab/holding-exit-validation-protocol.json \
            --production stock-lab/holding-model.js \
            --out stock-lab/holding-exit-oos-result.json

      - name: Validate public OOS truth contract
        run: |
          python - <<'PY'
          import json
          x=json.load(open('stock-lab/holding-exit-oos-result.json',encoding='utf-8'))
          assert x['schema_version']==2 and x['model']=='TW-holding-exit-v4'
          assert x['pipeline_executed'] is True
          assert x['source']['class']=='ogdl_daily_archive'
          assert x['source']['licence']=='OGDL-1.0'
          assert x['status']=='INSUFFICIENT'
          assert x['metrics'] is None
          assert x['exit_execution_validated'] is False
          assert x['confidence_calibrated'] is False
          print('public OOS remains truthfully INSUFFICIENT')
          PY

      - name: Rebuild public readiness
        run: |
          python stock-lab/build-holding-readiness.py \
            --manifest stock-lab/history-ogdl/manifest.json \
            --licensed-bundle-dir "$LICENSED_BUNDLE_DIR" \
            --protocol stock-lab/holding-exit-validation-protocol.json \
            --sources stock-lab/history-source-registry.json \
            --oos stock-lab/holding-exit-oos-result.json \
            --out stock-lab/holding-readiness.json

      - name: Validate private licensed acquisition remains required
        run: |
          python - <<'PY'
          import json
          x=json.load(open('stock-lab/holding-readiness.json',encoding='utf-8'))
          assert x['schema_version']==3
          assert x['overall_status']=='INSUFFICIENT'
          assert x['executable_exit_output'] is False
          assert x['selected_history_source']['kind']=='ogdl_daily_archive'
          assert x['activation_path']['requires_waiting_120_trading_days'] is False
          assert x['activation_path']['primary']=='licensed_historical_backfill'
          assert x['activation_path']['private_price_staging_importer']=='stock-lab/prepare-twmd-private-backfill.py'
          candidates={z['id']:z for z in x['activation_path']['licensed_source_candidates']}
          assert 'twmd_api_private_backfill' in candidates
          assert candidates['twmd_api_private_backfill']['status']=='candidate_entitlement_and_pit_review_required'
          assert candidates['twmd_api_private_backfill']['formal_bundle_ready_from_price_alone'] is False
          f=x['history_sources'].get('active_forward_only',[])
          assert any(z.get('id')=='ogdl_daily_forward_archive' and z.get('history_backfill') is False for z in f)
          print('private historical backfill path is explicit; TWMD price staging alone cannot unlock the model')
          PY

      - name: Persist only public fail-closed readiness when changed
        run: |
          if [ -z "$(git status --porcelain -- stock-lab/holding-exit-oos-result.json stock-lab/holding-readiness.json)" ]; then echo 'No OOS/readiness change'; exit 0; fi
          git config user.name 'stocklab-bot'
          git config user.email 'stocklab-bot@users.noreply.github.com'
          git add stock-lab/holding-exit-oos-result.json stock-lab/holding-readiness.json
          git commit -m 'update public holding exit readiness'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
