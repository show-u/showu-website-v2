name: Current individual candidate screen
on:
 push:
  branches: [main]
  paths:
   - 'stock-api/research/current-individual-candidate-screen.js'
   - '.github/workflows/current-individual-candidate-screen.yml'
 workflow_dispatch:
jobs:
 run:
  runs-on: ubuntu-latest
  timeout-minutes: 60
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-node@v4
     with:
      node-version: '20'
   - run: node stock-api/research/current-individual-candidate-screen.js
