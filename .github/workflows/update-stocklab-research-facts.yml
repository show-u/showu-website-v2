name: Update StockLab research facts

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-stocklab-research-facts.yml'
      - 'stock-lab/build-research-facts.py'
      - 'stock-lab/source-registry.json'
  schedule:
    - cron: '35 8 * * 1-5'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build compact OGDL research facts
        run: python stock-lab/build-research-facts.py
      - name: Validate no-imputation research contract
        run: |
          python - <<'PY'
          import json,re
          x=json.load(open('stock-lab/research-facts.json',encoding='utf-8'))
          assert x['schema_version']==1 and x['source']=='ogdl-normalized-research-facts'
          assert x['licence']=='OGDL-1.0' and x['no_imputation'] is True
          assert isinstance(x['stocks'],dict) and len(x['stocks'])>500
          assert all(v.get('licence')=='OGDL-1.0' for v in x['source_status'].values())
          for k,s in x['stocks'].items():
              assert re.fullmatch(r'(TWSE|TPEx):[0-9A-Z]{4,6}',k)
              for name in ('valuation','revenue','quarterly','financial_quality','institution'):
                  z=s.get(name)
                  if z is not None:
                      assert z.get('verified') is True
                      assert z.get('provenance') in ('observed','observed+derived')
          print('PASS: compact research facts preserve missingness and provenance')
          PY
      - name: Commit when changed
        run: |
          if git diff --quiet -- stock-lab/research-facts.json; then echo 'No research fact changes'; exit 0; fi
          git config user.name 'stocklab-bot'
          git config user.email 'stocklab-bot@users.noreply.github.com'
          git add stock-lab/research-facts.json
          git commit -m 'update licensed StockLab research facts'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
