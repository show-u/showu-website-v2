name: Preregistered Taiwan screen validation
on:
 push:
  branches: [main]
  paths: ['stock-api/research/preregistered-taiwan-screen-validation.js','.github/workflows/preregistered-taiwan-screen-validation.yml']
jobs:
 run:
  runs-on: ubuntu-latest
  timeout-minutes: 60
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-node@v4
     with: {node-version: '20'}
   - run: node stock-api/research/preregistered-taiwan-screen-validation.js
