name: Update StockLab licensed OHLC history

on:
  workflow_dispatch:
  push:
    paths:
      - 'stock-lab/browser-data.json'
      - 'stock-lab/archive-ogdl-daily.py'
      - 'stock-lab/official-schema-registry.json'
      - 'stock-lab/history-source-contract.json'
      - '.github/workflows/update-ogdl-history.yml'

concurrency:
  group: stocklab-ogdl-history-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate committed licensed source cache
        run: |
          python - <<'PY'
          import json
          x=json.load(open('stock-lab/browser-data.json',encoding='utf-8'))
          assert x['schema_version']==2 and x['source']=='licensed-open-data-cache'
          assert 'OGDL' in x['licence']
          for name,dataset in (('twse_snapshot',11549),('tpex_snapshot',11370)):
            rows=x['datasets'].get(name);m=x['meta'].get(name) or {}
            assert isinstance(rows,list) and rows,name
            assert m.get('data_gov_dataset')==dataset,(name,m)
            assert m.get('licence')=='OGDL-1.0' and m.get('licence_verified') is True,name
            assert m.get('attribution'),name
            assert len(str(m.get('sha256') or ''))==64,name
          print('committed OGDL cache validated; history will use these exact bytes only')
          PY
      - name: Exact-schema archive from committed cache only
        run: |
          python -m py_compile stock-lab/archive-ogdl-daily.py
          python stock-lab/archive-ogdl-daily.py \
            --cache stock-lab/browser-data.json \
            --registry stock-lab/official-schema-registry.json \
            --out-dir stock-lab/history-ogdl
      - name: Validate no-imputation archive and readiness metrics
        run: |
          python - <<'PY'
          import json,glob
          m=json.load(open('stock-lab/history-ogdl/manifest.json',encoding='utf-8'))
          assert m['schema_version']==1 and m['source_class']=='ogdl_daily_archive'
          assert m['licence']=='OGDL-1.0' and m['no_imputation'] is True
          assert m['network_collection_performed_by_archiver'] is False
          assert set(m['markets'])=={'TWSE','TPEx'}
          assert m['rows']>0 and m['first_date'] and m['last_date']
          assert glob.glob('stock-lab/history-ogdl/*.jsonl')
          q=m.get('coverage_metrics') or {}
          assert q.get('entry_minimum_valid_bars')==60
          assert q.get('holding_exit_minimum_valid_bars')==120
          assert q.get('thresholds_are_history_only') is True
          assert q.get('does_not_imply_model_oos_pass') is True
          for market,dataset in (('TWSE',11549),('TPEx',11370)):
            x=m['latest_ingest'][market]
            assert x['accepted']>0 and x['data_gov_dataset']==dataset
            assert len(x['raw_sha256'])==64 and x['source_schema']
          print('OGDL history validated',m['last_date'],m['rows'],q.get('overall'))
          PY
      - name: Commit history only when observations or manifest changed
        run: |
          if [ -z "$(git status --porcelain -- stock-lab/history-ogdl)" ]; then echo 'No new official observations'; exit 0; fi
          git config user.name 'stocklab-bot'
          git config user.email 'stocklab-bot@users.noreply.github.com'
          git add stock-lab/history-ogdl
          git commit -m 'archive licensed OGDL daily OHLC'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
