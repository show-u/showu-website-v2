name: Full universe coverage audit
on:
 push:
  branches: [main]
  paths: ['stock-api/research/full-universe-coverage-audit.js','.github/workflows/full-universe-coverage-audit.yml']
jobs:
 run:
  runs-on: ubuntu-latest
  timeout-minutes: 45
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-node@v4
     with: {node-version: '20'}
   - run: node stock-api/research/full-universe-coverage-audit.js
