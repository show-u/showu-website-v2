name: Official MOM6 depth validation
on:
 push:
  branches: [main]
  paths: ['stock-api/research/official-mom6-depth-validation.py','.github/workflows/official-mom6-depth-validation.yml']
jobs:
 run:
  runs-on: ubuntu-latest
  timeout-minutes: 45
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-python@v5
     with: {python-version: '3.12'}
   - run: pip install requests
   - run: python stock-api/research/official-mom6-depth-validation.py
