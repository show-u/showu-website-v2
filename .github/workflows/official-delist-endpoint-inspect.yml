name: Official delist endpoint inspect
on:
 push:
  branches: [main]
  paths: ['stock-api/research/official-delist-endpoint-inspect.js','.github/workflows/official-delist-endpoint-inspect.yml']
jobs:
 run:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-node@v4
     with: {node-version: '20'}
   - run: node stock-api/research/official-delist-endpoint-inspect.js
