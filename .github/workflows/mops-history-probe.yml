name: MOPS history probe
on:
 push:
  branches: [main]
  paths: ['stock-api/research/mops-history-probe.js','.github/workflows/mops-history-probe.yml']
jobs:
 run:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-node@v4
     with: {node-version: '20'}
   - run: node stock-api/research/mops-history-probe.js
