name: StockLab security boundary

on:
  push:
    paths:
      - 'stock-lab/**'
      - '.github/workflows/stocklab-security-boundary.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify predictive boundary and deterministic research paths
        run: |
          node --check stock-lab/api-client.js
          node --check stock-lab/market-router.js
          node --check stock-lab/top10-gate.js
          node --check stock-lab/verified-history.js
          node --check stock-lab/entry-decision.js
          node --check stock-lab/hard-policy.js
          grep -q './api-client.js' stock-lab/index.html
          grep -q './hard-policy.js' stock-lab/index.html
          grep -q "價格結構 Entry Zone" stock-lab/market-router.js
          grep -q "9+3 決策層" stock-lab/market-router.js
          grep -q "TW-price-structure-entry-zone-v2" stock-lab/entry-decision.js
          grep -q "r.length<60" stock-lab/entry-decision.js
          grep -q "same-origin-ogdl-archive-only" stock-lab/verified-history.js
          grep -q "各類股近期績優研究標的" stock-lab/top10-gate.js
          grep -q "slice(0,5)" stock-lab/top10-gate.js
          grep -q "ruleBasedEntryReferenceEnabled:true" stock-lab/runtime-config.js
          grep -q "sectorResearchEnabled:true" stock-lab/runtime-config.js
          grep -q "allowLocalFallback:false" stock-lab/runtime-config.js
          grep -q "credentials:'omit'" stock-lab/api-client.js
          grep -q "cache:'no-store'" stock-lab/api-client.js
          ! grep -q 'openingGapStats' stock-lab/market-router.js
          ! grep -q 'intradayPullbackStats' stock-lab/market-router.js
          ! grep -q 'buildBuyPlan' stock-lab/market-router.js
          ! grep -q 'Math.min(cl,avg)' stock-lab/market-router.js
          ! grep -q 'StockLabEntryDecision.evaluate' stock-lab/market-router.js
          ! grep -q '勝率：' stock-lab/market-router.js
          ! grep -q '上漲機率：' stock-lab/top10-gate.js
      - name: Reject obvious client-side secrets
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          files=[p for p in Path('stock-lab').glob('*.js')]
          text='\n'.join(p.read_text(encoding='utf-8',errors='ignore') for p in files)
          bad=[
            r'sk-[A-Za-z0-9_-]{20,}',
            r'OPENAI_API_KEY\s*=\s*["\'][^"\']+["\']',
            r'VERCEL_TOKEN\s*=\s*["\'][^"\']+["\']',
            r'Authorization\s*:\s*["\']Bearer\s+[A-Za-z0-9._-]{16,}',
          ]
          hits=[pat for pat in bad if re.search(pat,text,re.I)]
          assert not hits, f'client-side secret pattern detected: {hits}'
          print('security boundary checks passed')
          PY
