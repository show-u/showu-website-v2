name: StockLab public smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '15 */6 * * *'
  push:
    paths:
      - 'stock-lab/index.html'
      - 'stock-lab/runtime-config.js'
      - 'stock-lab/data-status.js'
      - 'stock-lab/api-client.js'
      - 'stock-lab/health.js'
      - 'stock-lab/entry-decision.js'
      - 'stock-lab/top10-gate.js'
      - 'stock-lab/market-router.js'
      - 'stock-lab/holding-model.js'
      - 'stock-lab/compliance-gate.js'
      - 'stock-lab/history-ogdl/manifest.json'
      - '.github/workflows/stocklab-public-smoke.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Verify public StockLab Truth Rules v9 deployment
        shell: bash
        run: |
          set -euo pipefail
          base='https://www.showujapan.com/stock-lab'
          ready=0
          for i in 1 2 3 4 5 6 7 8; do
            curl -fsSL --max-time 20 "$base/?smoke=$RANDOM" -o /tmp/index.html || true
            if grep -q './runtime-config.js' /tmp/index.html 2>/dev/null && grep -q './entry-decision.js' /tmp/index.html 2>/dev/null && grep -q './compliance-gate.js' /tmp/index.html 2>/dev/null && grep -q '9項入場因子＋3個市場背景' /tmp/index.html 2>/dev/null; then ready=1; break; fi
            sleep 10
          done
          test "$ready" = 1
          grep -q 'StockLab 台股投資分析器' /tmp/index.html
          grep -q '不知道買什麼' /tmp/index.html
          grep -q '想買這檔' /tmp/index.html
          grep -q '已持有' /tmp/index.html
          grep -q '判斷是否適合入場' /tmp/index.html
          grep -q '總量成本均價' /tmp/index.html
          grep -q '9項入場因子＋3個市場背景' /tmp/index.html
          grep -q '美股、台指期 TX、國際時事' /tmp/index.html
          grep -q '絕對不能違反的資料規則' /tmp/index.html
          ! grep -q 'holdHorizon' /tmp/index.html
          ! grep -q '<option value="1m"' /tmp/index.html
          grep -q './entry-decision.js' /tmp/index.html
          grep -q './holding-model.js' /tmp/index.html
          grep -q './compliance-gate.js' /tmp/index.html

          for f in runtime-config.js data-status.js api-client.js health.js entry-decision.js top10-gate.js market-router.js holding-model.js compliance-gate.js tpex-health.json market-data.json futures-data.json history-ogdl/manifest.json; do
            out="/tmp/$(echo "$f" | tr '/' '_')"
            curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors --max-time 20 "$base/$f?smoke=$RANDOM" -o "$out"
            test -s "$out"
          done

          grep -q 'hardPolicyVersion:9' /tmp/runtime-config.js
          grep -q 'entryNineFactors:false' /tmp/runtime-config.js
          grep -q 'internationalEventFeed:false' /tmp/runtime-config.js
          grep -q 'nineFactorBlocked' /tmp/compliance-gate.js
          grep -q '完整判斷指定的九項因子＋美股＋台指期＋國際時事尚未全部驗證' /tmp/compliance-gate.js
          grep -q "'trend','volume','movingAverages','institution','macd','rsi','kd','crossovers','candlestick'" /tmp/entry-decision.js

          python - <<'PY'
          import json
          for p in ('/tmp/tpex-health.json','/tmp/market-data.json','/tmp/futures-data.json'):
              with open(p,encoding='utf-8') as f: json.load(f)
          m=json.load(open('/tmp/history-ogdl_manifest.json',encoding='utf-8'))
          assert m['schema_version']==1
          assert m['source_class']=='ogdl_daily_archive'
          assert m['licence']=='OGDL-1.0'
          assert m['no_imputation'] is True
          print('public StockLab Truth Rules v9 unified-entry deployment passed; legal data cutoff:',m.get('last_date'))
          PY
