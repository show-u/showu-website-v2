name: StockLab public smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '15 */6 * * *'
  push:
    paths:
      - 'stock-lab/index.html'
      - 'stock-lab/runtime-config.js'
      - 'stock-lab/api-client.js'
      - 'stock-lab/health.js'
      - 'stock-lab/entry-decision.js'
      - 'stock-lab/top10-gate.js'
      - 'stock-lab/market-router.js'
      - 'stock-lab/position-input.js'
      - 'stock-lab/holding-model.js'
      - 'stock-lab/holding-router.js'
      - 'stock-lab/ui-patch.js'
      - 'stock-lab/same-origin-cache.js'
      - 'stock-lab/market-facts.json'
      - 'stock-lab/compliance-gate.js'
      - 'stock-lab/public-output.js'
      - 'stock-lab/session-context.js'
      - 'stock-lab/hard-policy.js'
      - 'stock-lab/licensed-history.js'
      - 'stock-lab/verification-policy.json'
      - '.github/workflows/stocklab-public-smoke.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Verify public StockLab truth-first deployment
        shell: bash
        run: |
          set -euo pipefail
          base='https://www.showujapan.com/stock-lab'
          need() { grep -Fq "$1" "$2" || { echo "::error::$3"; exit 1; }; }
          forbid() { if grep -Fq "$1" "$2"; then echo "::error::$3"; exit 1; fi; }
          ready=0
          for i in $(seq 1 30); do
            curl -fsSL --max-time 20 "$base/?smoke=$RANDOM" -o /tmp/index.html || true
            if grep -q './session-context.js' /tmp/index.html 2>/dev/null \
              && grep -q './holding-router.js' /tmp/index.html 2>/dev/null \
              && grep -q '9+3 入場分析' /tmp/index.html 2>/dev/null \
              && grep -q '分析出場時機' /tmp/index.html 2>/dev/null \
              && ! grep -q 'id="horizon"' /tmp/index.html 2>/dev/null; then
              ready=1; break
            fi
            sleep 10
          done
          test "$ready" = 1 || { echo '::error::public site did not reach three-mode deployment within retry window'; exit 1; }

          # Public UX: three decisions only; no legacy horizon-based buy prices.
          need 'StockLab 台股投資分析器' /tmp/index.html 'missing StockLab title'
          need '不知道買什麼' /tmp/index.html 'missing scanner workflow'
          need '未持有｜找入場' /tmp/index.html 'missing entry workflow'
          need '已持有' /tmp/index.html 'missing holding workflow'
          need '9+3 入場分析' /tmp/index.html 'missing entry action'
          need '分析出場時機' /tmp/index.html 'missing holding action'
          need '目前成本均價' /tmp/index.html 'missing holding average-cost input'
          need '目前持有股數' /tmp/index.html 'missing holding shares input'
          need '首次買入時間' /tmp/index.html 'missing holding buy-time input'
          need 'id="holdTotalCost"' /tmp/index.html 'holding total-cost alternative input missing'
          need '資料不完整就不預測；不以假資料補值' /tmp/index.html 'missing no-imputation statement'
          need '每類最多 5 檔' /tmp/index.html 'missing five-per-sector statement'
          forbid 'id="horizon"' /tmp/index.html 'legacy horizon selector returned'
          forbid 'id="scanObjective"' /tmp/index.html 'legacy scan objective returned'
          forbid '<option value="1m"' /tmp/index.html 'legacy 1m buy model returned'
          forbid '<option value="3m"' /tmp/index.html 'legacy 3m buy model returned'
          forbid '<option value="long"' /tmp/index.html 'legacy long buy model returned'
          forbid '短線｜約1個月' /tmp/index.html 'legacy short buy label returned'
          forbid '波段｜約3個月' /tmp/index.html 'legacy swing buy label returned'
          forbid '長期｜1年以上' /tmp/index.html 'legacy long buy label returned'

          # Required truth/session/position modules must be publicly deployed.
          for s in licensed-history.js session-context.js entry-decision.js top10-gate.js market-router.js position-input.js holding-model.js holding-router.js hard-policy.js public-output.js compliance-gate.js; do
            need "./$s" /tmp/index.html "missing deployed module $s"
          done

          for f in runtime-config.js api-client.js health.js licensed-history.js session-context.js entry-decision.js top10-gate.js market-router.js position-input.js holding-model.js holding-router.js ui-patch.js same-origin-cache.js market-facts.json hard-policy.js public-output.js compliance-gate.js verification-policy.json; do
            out="/tmp/$(echo "$f" | tr '/' '_')"
            curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors --max-time 20 "$base/$f?smoke=$RANDOM" -o "$out"
            test -s "$out" || { echo "::error::public asset missing or empty: $f"; exit 1; }
          done

          # Fail closed until licensed historical bundle + OOS + calibration are actually ready.
          need 'productionPredictionReady:false' /tmp/runtime-config.js 'production prediction gate unexpectedly open'
          need 'ruleBasedEntryReferenceEnabled:true' /tmp/runtime-config.js 'rule-based entry reference unexpectedly disabled'
          need 'sectorResearchEnabled:true' /tmp/runtime-config.js 'sector research unexpectedly disabled'
          need 'allowLocalFallback:false' /tmp/runtime-config.js 'local executable fallback unexpectedly enabled'
          need 'entryRangeExecutionValidation:false' /tmp/runtime-config.js 'entry execution validation unexpectedly enabled'
          need 'window.StockLabEntryDecision' /tmp/entry-decision.js 'entry decision module unavailable'
          need 'TW-9plus3-weighted-v1' /tmp/entry-decision.js '9+3 weighted decision engine unavailable'
          need 'confidenceIndex' /tmp/entry-decision.js '9+3 decision-confidence index unavailable'
          need 'entryPlan' /tmp/entry-decision.js '9+3 weighted entry price layer unavailable'
          need 'window.StockLabPositionInput' /tmp/position-input.js 'position input module unavailable'
          need 'window.StockLabHolding' /tmp/holding-model.js 'holding model module unavailable'
          need "model:'TW-holding-9plus3-v6'" /tmp/holding-model.js 'rule-based holding model unavailable'
          need 'requiredBars:()=>1' /tmp/holding-model.js 'holding rules must work from one verified completed-session close'
          need 'NOT_REQUIRED_FOR_RULE_BASED_OUTPUT' /tmp/holding-model.js 'holding rules were re-locked behind OOS'
          need 'StockLabPositionInput?.collect' /tmp/holding-router.js 'holding router not using user position collector'
          need '持股與出場管理' /tmp/holding-router.js 'holding management UI unavailable'
          need '目前建議動作' /tmp/holding-router.js 'holding primary action unavailable'
          forbid 'from:p.buyDate' /tmp/holding-router.js 'holding router attempts unsafe history fetch from buy date'
          need 'WAITING_TODAY_CLOSE_DATA' /tmp/session-context.js 'missing completed-close waiting state'
          need 'STALE_BASE_DATE' /tmp/session-context.js 'missing stale-base guard'
          need '盤中僅供參考，不以昨日資料重算現在價格' /tmp/session-context.js 'missing no-intraday-reprice statement'
          need 'StockLabSessionContext.resolve' /tmp/public-output.js 'public output not session-aware'
          need 'base_session_date' /tmp/hard-policy.js 'backend policy missing base-session contract'
          need 'target_session_date' /tmp/hard-policy.js 'backend policy missing target-session contract'
          need 'target_session_date' /tmp/hard-policy.js 'backend policy missing target-session contract'
          need 'sessionPairOK' /tmp/hard-policy.js 'backend policy missing verified base/target session pairing'
          need 'window.StockLabTickerResolver' /tmp/ui-patch.js 'ticker resolver unavailable'
          need "mode:'licensed-normalized-market-facts'" /tmp/same-origin-cache.js 'licensed market facts adapter unavailable'
          forbid 'horizon=document.querySelector' /tmp/ui-patch.js 'legacy horizon routing returned'

          python - <<'PY'
          import json
          mf=json.load(open('/tmp/market-facts.json',encoding='utf-8'))
          assert mf['schema_version']==1 and mf['source']=='ogdl-normalized-market-facts'
          assert mf['licence']=='OGDL-1.0' and mf['no_imputation'] is True
          hits=[r for r in mf['rows'] if r.get('ticker')=='2454' and r.get('market')=='TWSE']
          assert hits and hits[-1].get('name')=='聯發科' and float(hits[-1].get('close',0))>0
          p=json.load(open('/tmp/verification-policy.json',encoding='utf-8'))
          assert p['version'] >= 13
          inv=p['absolute_invariants']
          required=(
            'TW_MARKET_SCOPE','LEGAL_SOURCE_ONLY','NO_IMPUTATION','FACT_ESTIMATE_SEPARATION',
            'TRACEABILITY','FAIL_CLOSED','NO_FAKE_CONFIDENCE','NO_HORIZON_BUY_MODEL',
            'NO_UNBUYABLE_ENTRY_BANDS','TARGET_SESSION_BY_DATA_DATE',
            'NO_INTRADAY_REPRICE_WITHOUT_LIVE_FEED','POSITION_INPUT_PROVENANCE','EXIT_MODEL_SEPARATION','THREE_INPUT_HOLDING_POSITION','EXECUTABLE_ENTRY_ONLY','RULE_BASED_ENTRY_REFERENCE','SECTOR_RESEARCH_SHORTLIST','NINE_PLUS3_WEIGHTED_ENTRY_EXIT','EVIDENCE_CONFIDENCE_INDEX'
          )
          missing=[x for x in required if x not in inv]
          assert not missing, missing
          assert int(p['history_requirements']['holding_rules']['minimum_verified_closes']) == 1
          assert p['prediction_requirements']['holding_rules']['oos_required'] is False
          assert p['output_contract']['deterministic_holding_rules_require_oos_pass'] is False
          assert p['legal_use']['official_website_only']['allowed_for_automated_collection'] is False
          assert p['legal_use']['real_time_or_delayed_trading_information']['allowed'] is False
          assert p['output_contract']['rule_based_entry_reference_requires_oos_pass'] is False
          assert p['output_contract']['sector_research_requires_oos_pass'] is False
          assert int(p['output_contract']['sector_research_max_per_industry']) == 5
          assert p['output_contract']['numeric_entry_requires_complete_9plus3'] is False
          assert p['output_contract']['numeric_exit_requires_complete_9plus3'] is False
          assert p['output_contract']['evidence_confidence_is_probability'] is False
          assert p['output_contract']['full_holding_direction_requires_complete_9plus3'] is True
          print('PASS: public StockLab truth-first holding-first deployment is live')
          PY
