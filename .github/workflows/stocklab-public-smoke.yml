name: StockLab public smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '15 */6 * * *'
  push:
    paths:
      - 'stock-lab/index.html'
      - 'stock-lab/runtime-config.js'
      - 'stock-lab/data-status.js'
      - 'stock-lab/api-client.js'
      - 'stock-lab/health.js'
      - 'stock-lab/top10-gate.js'
      - 'stock-lab/market-router.js'
      - 'stock-lab/holding-model.js'
      - 'stock-lab/compliance-gate.js'
      - 'stock-lab/history-ogdl/manifest.json'
      - '.github/workflows/stocklab-public-smoke.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Verify public StockLab Truth Rules v8 deployment
        shell: bash
        run: |
          set -euo pipefail
          base='https://www.showujapan.com/stock-lab'
          ready=0
          for i in 1 2 3 4 5 6 7 8; do
            curl -fsSL --max-time 20 "$base/?smoke=$RANDOM" -o /tmp/index.html || true
            if grep -q './runtime-config.js' /tmp/index.html 2>/dev/null && grep -q './compliance-gate.js' /tmp/index.html 2>/dev/null && grep -q '已持有' /tmp/index.html 2>/dev/null; then ready=1; break; fi
            sleep 10
          done
          test "$ready" = 1
          grep -q 'StockLab 台股投資分析器' /tmp/index.html
          grep -q '不知道買什麼' /tmp/index.html
          grep -q '想買這檔' /tmp/index.html
          grep -q '已持有' /tmp/index.html
          grep -q '總量成本均價' /tmp/index.html
          grep -q '短／中／長只在持股分析使用' /tmp/index.html
          grep -q '14:20、14:50、15:20、15:50' /tmp/index.html
          grep -q './holding-model.js' /tmp/index.html
          grep -q './compliance-gate.js' /tmp/index.html

          for f in runtime-config.js data-status.js api-client.js health.js top10-gate.js market-router.js holding-model.js compliance-gate.js tpex-health.json market-data.json futures-data.json history-ogdl/manifest.json; do
            out="/tmp/$(echo "$f" | tr '/' '_')"
            curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors --max-time 20 "$base/$f?smoke=$RANDOM" -o "$out"
            test -s "$out"
          done

          grep -q "import('./data-status.js')" /tmp/runtime-config.js
          grep -q 'never advances a target session from the wall clock' /tmp/data-status.js
          grep -q '下一交易時段價格尚未解鎖' /tmp/data-status.js
          grep -q '09:00 後若沒有合法即時／延遲行情' /tmp/compliance-gate.js
          grep -q 'holdingExitValidation 必須獨立 PASS' /tmp/compliance-gate.js

          python - <<'PY'
          import json
          for p in ('/tmp/tpex-health.json','/tmp/market-data.json','/tmp/futures-data.json'):
              with open(p,encoding='utf-8') as f: json.load(f)
          m=json.load(open('/tmp/history-ogdl_manifest.json',encoding='utf-8'))
          assert m['schema_version']==1
          assert m['source_class']=='ogdl_daily_archive'
          assert m['licence']=='OGDL-1.0'
          assert m['no_imputation'] is True
          assert m['last_date'] and m['latest_ingest']['TWSE']['date'] and m['latest_ingest']['TPEx']['date']
          print('public StockLab Truth Rules v8 deployment passed; legal data cutoff:',m['last_date'])
          PY
