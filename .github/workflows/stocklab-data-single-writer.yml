name: StockLab legal data single-writer guard

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/**'
      - 'stock-lab/archive-ogdl-daily.py'
      - 'stock-lab/official-schema-registry.json'
      - 'stock-lab/browser-data.json'
      - 'stock-lab/history-source-contract.json'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce one writer per derived data layer
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path('.github/workflows')
          files=list(root.glob('*.yml'))+list(root.glob('*.yaml'))
          history_writer='.github/workflows/update-ogdl-history.yml'
          cache_writer='.github/workflows/update-browser-cache.yml'
          violations=[]
          for p in files:
            s=p.read_text(encoding='utf-8')
            rel=p.as_posix()
            if re.search(r'git\s+add[^\n]*stock-lab/history-ogdl',s,re.I) and rel!=history_writer:
              violations.append(f'{rel}: stages history-ogdl but is not the authoritative history writer')
            if re.search(r'git\s+add[^\n]*stock-lab/browser-data\.json',s,re.I) and rel!=cache_writer:
              violations.append(f'{rel}: stages browser-data.json but is not the authoritative cache writer')
          cache=Path(cache_writer).read_text(encoding='utf-8')
          hist=Path(history_writer).read_text(encoding='utf-8')
          if 'stock-lab/history-ogdl' in cache or 'archive-ogdl-daily.py' in cache:
            violations.append('update-browser-cache.yml must not build or write history-ogdl')
          if "- 'stock-lab/browser-data.json'" not in hist:
            violations.append('update-ogdl-history.yml must trigger from committed browser-data.json')
          if '--cache stock-lab/browser-data.json' not in hist:
            violations.append('update-ogdl-history.yml must derive history from committed browser-data.json')
          if 'Fetch only licensed daily OHLC snapshots' in hist or 'urllib.request' in hist:
            violations.append('update-ogdl-history.yml must not independently refetch market data')
          if violations:
            raise SystemExit('\n'.join(violations))
          print('single-writer invariant passed: browser-data -> history-ogdl')
          PY
