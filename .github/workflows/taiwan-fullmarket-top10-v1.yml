name: Taiwan fullmarket top10 v1
on:
 push:
  branches: [main]
  paths: ['stock-api/research/taiwan-fullmarket-top10-v1.js','.github/workflows/taiwan-fullmarket-top10-v1.yml']
jobs:
 run:
  runs-on: ubuntu-latest
  timeout-minutes: 60
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-node@v4
     with: {node-version: '20'}
   - run: node stock-api/research/taiwan-fullmarket-top10-v1.js
