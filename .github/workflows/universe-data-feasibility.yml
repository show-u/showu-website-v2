name: Universe data feasibility
on:
 push:
  branches: [main]
  paths: ['stock-api/research/universe-data-feasibility.js','.github/workflows/universe-data-feasibility.yml']
jobs:
 run:
  runs-on: ubuntu-latest
  timeout-minutes: 60
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-node@v4
     with: {node-version: '20'}
   - run: node stock-api/research/universe-data-feasibility.js
