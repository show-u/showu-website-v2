name: TW stock top10 locked baseline
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['stock-api/research/tw-stock-top10-locked-baseline.py','.github/workflows/tw-stock-top10-locked-baseline.yml']
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q requests pandas numpy scikit-learn
      - run: python stock-api/research/tw-stock-top10-locked-baseline.py
