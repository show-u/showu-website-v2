name: Delisted FinMind inspect
on:
 push:
  branches: [main]
  paths:
   - 'stock-api/research/delisted-finmind-inspect.js'
   - '.github/workflows/delisted-finmind-inspect.yml'
 workflow_dispatch:
jobs:
 inspect:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-node@v4
     with:
      node-version: '20'
   - run: node stock-api/research/delisted-finmind-inspect.js
