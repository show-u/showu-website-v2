name: MOPSOV monthly revenue probe
on:
 push:
  branches: [main]
  paths: ['stock-api/research/mopsov-monthly-revenue-probe.py','.github/workflows/mopsov-monthly-revenue-probe.yml']
jobs:
 run:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-python@v5
     with: {python-version: '3.12'}
   - run: pip install pandas lxml requests
   - run: python stock-api/research/mopsov-monthly-revenue-probe.py
