name: HIGH52 horizon robustness
on:
  push:
    branches: [main]
    paths:
      - 'stock-api/research/high52-horizon-robustness.js'
      - '.github/workflows/high52-horizon-robustness.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node stock-api/research/high52-horizon-robustness.js
