name: StockLab integrity tests

on:
  push:
    paths:
      - 'stock-lab/**'
      - '.github/workflows/update-browser-cache.yml'
      - '.github/workflows/update-market-snapshot.yml'
      - '.github/workflows/update-taifex-tx.yml'
      - '.github/workflows/update-tpex-health.yml'
      - '.github/workflows/update-taiwan-factors.yml'
      - '.github/workflows/stocklab-integrity-tests.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax checks
        run: |
          for f in app tpex same-origin-cache taiwan-model-v2 markets futures event-risk entry-decision top10-gate market-router position-input holding-model ui-patch holding-router health hard-policy compliance-gate public-output api-client runtime-config; do
            test -f "stock-lab/$f.js"
            node --check "stock-lab/$f.js"
          done
          python -m py_compile stock-lab/backtest-taiwan-v3.py

      - name: Truth, execution, no-imputation, calibrated-confidence and UX invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          R=lambda p:Path(p).read_text(encoding='utf-8')

          policy=json.loads(R('stock-lab/verification-policy.json'))
          validation=json.loads(R('stock-lab/model-validation-status.json'))
          entry_protocol=json.loads(R('stock-lab/entry-validation-protocol.json'))
          holding_protocol=json.loads(R('stock-lab/holding-exit-validation-protocol.json'))
          idx=R('stock-lab/index.html')
          api=R('stock-lab/api-client.js')
          ui=R('stock-lab/ui-patch.js')
          entry=R('stock-lab/entry-decision.js')
          router=R('stock-lab/market-router.js')
          top10=R('stock-lab/top10-gate.js')
          pos=R('stock-lab/position-input.js')
          hold=R('stock-lab/holding-model.js')
          hold_router=R('stock-lab/holding-router.js')
          tw=R('stock-lab/taiwan-model-v2.js')
          runtime=R('stock-lab/runtime-config.js')
          hard=R('stock-lab/hard-policy.js')
          hard_doc=R('stock-lab/HARD_POLICY.md')
          compliance=R('stock-lab/compliance-gate.js')
          public=R('stock-lab/public-output.js')
          backtest=R('stock-lab/backtest-taiwan-v3.py')

          # Absolute truth rules.
          assert policy['version']==9 and policy['policy_name']=='StockLab Taiwan Truth Rules'
          for k in ('LEGAL_SOURCE_ONLY','NO_IMPUTATION','FACT_ESTIMATE_SEPARATION','TRACEABILITY','FAIL_CLOSED','NO_HORIZON_BUY_MODEL','POSITION_INPUT_PROVENANCE','EXIT_MODEL_SEPARATION','NO_FAKE_CONFIDENCE','NO_UNBUYABLE_ENTRY_BANDS'):
              assert k in policy['absolute_invariants'],k
          assert set(policy['provenance_classes'])=={'observed','user_observed','derived','model_estimate','unavailable'}
          assert policy['legal_use']['official_website_only']['allowed_for_automated_collection'] is False
          assert policy['legal_use']['real_time_or_delayed_trading_information']['allowed'] is False
          oc=policy['output_contract']
          for k in ('forbid_synthetic_fill','forbid_stale_as_current','forbid_unverified_as_fact','forbid_probability_without_calibration','forbid_horizon_specific_buy_prices','recommendation_requires_oos_pass'):
              assert oc[k] is True,k

          # Public UX has only the three real decisions and is deliberately concise.
          for text in ('不知道買什麼','想買這檔','已持有','分析進場價格','信心指數','分析出場時機','總量成本均價','目前持有股數','首次買入日'):
              assert text in idx,text
          assert '建議進場區間' in router and '建議出場價格' in hold_router
          assert 'internal-only' in idx
          for legacy in ('id="horizon"','id="scanObjective"','holdHorizon','<option value="1m"','<option value="3m"','<option value="long"','短線｜約1個月','波段｜約3個月','長期｜1年以上'):
              assert legacy not in idx,legacy
          assert '9項入場因子' not in idx and '美股、台指期 TX、國際時事' not in idx
          for removed in ('./indicators-v2.js','./financials.js','./integrity.js'):
              assert removed not in idx,removed
          assert './entry-decision.js' in idx and './position-input.js' in idx and './holding-model.js' in idx and './holding-router.js' in idx and './public-output.js' in idx
          assert idx.rfind('./position-input.js') < idx.rfind('./holding-model.js') < idx.rfind('./ui-patch.js') < idx.rfind('./holding-router.js') < idx.rfind('./compliance-gate.js') < idx.rfind('./public-output.js')
          assert 'showSingle();' in ui
          assert all(x in public for x in ('暫不提供進場區間與信心指數','暫不提供出場價格與信心指數','入場候選 TOP 10','不以舊值、0、平均值、其他網站或 AI 補值'))

          # Public API contract no longer exposes horizon-specific buy analysis.
          assert 'async function analyze(code)' in api and "strategy:'entry'" in api
          assert 'async function scan()' in api
          assert 'async function holding(code,position)' in api
          assert 'analyze(code,horizon)' not in api and 'scan(strategy)' not in api
          assert 'StockLabTickerResolver' in ui and "horizon=document.querySelector" not in ui

          # Internal entry engine still uses the complete 9+3 contract; public result does not dump it.
          factor_keys=('trend','volume','movingAverages','institution','macd','rsi','kd','crossovers','candlestick')
          for k in factor_keys: assert f"'{k}'" in entry,k
          assert 'StockLabEntryDecision.evaluate' in router
          assert "STRATEGY='entry'" in top10
          assert 'adaptiveBand' not in tw
          for legacy in ("h==='1m'","h==='3m'","h==='long'",'TW-structure-volatility-v4','短線入場區間','中期入場區間','長期佈局區間'):
              assert legacy not in router+tw,legacy
          assert '<h3>九項入場判斷</h3>' not in router
          assert '<h3>美股／台指期／國際時事</h3>' not in router
          assert '<b>九項訊號</b>' not in top10
          assert 'contextText(' not in top10
          assert 'entry_low' in router and 'entry_high' in router

          # Actionable price ranges require OOS reachability/execution validation.
          assert entry_protocol['schema_version']==1 and entry_protocol['protocol_name']=='StockLab TW-entry-9plus3-v1 OOS Protocol'
          assert entry_protocol['non_negotiable_rules']['unfilled_signals_must_remain_in_denominator'] is True
          assert entry_protocol['non_negotiable_rules']['confidence_requires_separate_oos_calibration'] is True
          assert 'reachability rate' in entry_protocol['evaluation']['primary_execution_metrics']
          assert 'fill rate' in entry_protocol['evaluation']['primary_execution_metrics']
          assert validation['models']['entry_decision_9plus3']['validation_protocol']=='stock-lab/entry-validation-protocol.json'
          assert validation['models']['entry_scanner_9plus3']['validation_protocol']=='stock-lab/entry-validation-protocol.json'
          assert 'OOS entry-range touch/fill/reachability validation' in validation['models']['entry_decision_9plus3']['required_before_pass']
          assert 'OOS entry-range touch/fill/reachability validation' in validation['models']['entry_scanner_9plus3']['required_before_pass']
          assert 'entryRangeExecutionValidation:false' in runtime
          assert 'entryRangeExecutionValidation' in router
          assert 'entry_range_execution_validated' in hard and 'entry_range_execution_validated' in top10
          assert '觸價／成交可達性' in hard_doc and '未成交率' in hard_doc

          assert holding_protocol['non_negotiable_rules']['no_hindsight_high_low_execution'] is True
          assert holding_protocol['non_negotiable_rules']['confidence_requires_separate_oos_calibration'] is True
          assert 'execution rate' in holding_protocol['evaluation']['metrics']
          assert 'OOS exit execution validation without hindsight high/low fills' in validation['models']['holding_exit']['required_before_pass']
          assert 'holdingExitExecutionValidation:false' in runtime
          assert 'holdingExitExecutionValidation' in hold_router
          assert 'exit_execution_validated' in hard and 'exit_execution_validated' in hold_router

          # Confidence can never be a heuristic relabel. Calibration is a separate hard gate.
          for s in ('entryConfidenceCalibration:false','holdingConfidenceCalibration:false','scannerConfidenceCalibration:false'):
              assert s in runtime,s
          assert 'validConfidence' in hard and 'confidence_calibrated===true' in hard
          assert 'entryConfidenceCalibration' in router and 'confidenceCalibrated===true' in router
          assert 'holdingConfidenceCalibration' in hold_router and 'confidenceCalibrated!==true' in hold_router
          assert 'scannerConfidenceCalibration' in top10 and 'confidence_calibrated' in top10
          assert 'untouched OOS confidence calibration' in validation['models']['entry_decision_9plus3']['required_before_pass']
          assert 'untouched OOS confidence calibration' in validation['models']['entry_scanner_9plus3']['required_before_pass']
          assert 'untouched OOS confidence calibration' in validation['models']['holding_exit']['required_before_pass']

          # Position facts originate only from the user; holding uses exact verified trading sessions.
          assert all(x in pos for x in ('StockLabPositionInput','derived_from_user_lots','缺值不補 0','weighted=totalShares?totalCost/totalShares:null'))
          assert all(x in hold for x in ('TW-holding-exit-v4','holdingTradingDays','正式出場模型需要有效首次買入日','首次買入日不在目前合法且驗證通過的歷史交易日序列中','sharesAffectSignal:false'))
          assert 'estimatedTradingDays' not in hold and 'horizonConfig' not in hold
          assert 'btn.onclick=async' in hold_router and 'StockLabPositionInput?.collect' in hold_router and 'StockLabTickerResolver' in hold_router
          assert '暫不提供出場價格' in hold_router and "oosStatus:'PASS'" in hold_router

          # Compliance gate remains final fail-closed authority while final public layer keeps failure output concise.
          assert 'allowLocalFallback:false' in runtime and 'productionPredictionReady:false' in runtime
          for s in ('licensedHistoricalOHLC:false','securityMaster:false','tradingCalendar:false','corporateActions:false','taiwanRiskState:false','entryDecisionOosValidation:false','entryRangeExecutionValidation:false','holdingExitValidation:false','holdingExitExecutionValidation:false','entryScannerOosValidation:false'):
              assert s in runtime,s
          assert 'VERIFIED FACTS ONLY' in compliance and '不以 0、平均值、舊值或 AI 補齊' in compliance
          assert "const ready=()=>window.StockLabAPI?.config?.enabled===true||rt.productionPredictionReady===true" in public

          # Validation contracts are v10/v4 and legacy network backtest code stays disabled.
          assert validation['schema_version']==4 and validation['architecture']=='unified-entry-holding-v10'
          assert validation['legacy_horizon_entry_results_are_production_valid'] is False
          assert validation['models']['holding_exit']['candidate_formula']=='TW-holding-exit-v4'
          assert holding_protocol['schema_version']==2 and holding_protocol['protocol_name']=='StockLab TW-holding-exit-v4 OOS Protocol'
          assert holding_protocol['non_negotiable_rules']['no_horizon_selector'] is True
          assert holding_protocol['non_negotiable_rules']['missing_inputs_are_not_imputed'] is True
          assert not Path('stock-lab/backtest-model.py').exists()
          assert "ARCHITECTURE = 'unified-entry-holding-v10'" in backtest
          assert 'NETWORK_HISTORY_COLLECTION_DISABLED = True' in backtest
          for forbidden in ('urllib.request','www.twse.com.tw','www.tpex.org.tw','ThreadPoolExecutor'):
              assert forbidden not in backtest,forbidden

          print('PASS: concise StockLab entry/holding UX is fail-closed, executable by contract, and confidence-calibrated')
          PY

      - name: No-imputation and confidence fixtures
        run: |
          python - <<'PY'
          def strict_num(v):
              if v is None:return None
              s=str(v).strip()
              if not s or s in {'-','--','—','N/A','NA','null','undefined'}:return None
              try:return float(s.replace(',','').removesuffix('%'))
              except:return None
          for v in (None,'',' ','-','--','—','N/A','NA','null','undefined'):
              assert strict_num(v) is None
          assert strict_num('0')==0 and strict_num('1,234.5')==1234.5
          provenance={'official_close':'observed','position_cost':'user_observed','holding_days':'derived','entry_or_exit':'model_estimate','missing':'unavailable'}
          assert len(set(provenance.values()))==5
          def valid_confidence(v,calibrated):
              try:x=float(v)
              except:return False
              return calibrated is True and 0<=x<=100
          assert valid_confidence(62,False) is False
          assert valid_confidence(62,True) is True
          assert valid_confidence(101,True) is False
          signals=100;fills=18
          fill_rate=fills/signals
          assert fill_rate==0.18 and signals>fills
          # An apparently profitable 18 fills may not erase the other 82 unreachable signals.
          assert (signals-fills)==82
          print('PASS: missing values stay missing; confidence and execution reachability are separate gates')
          PY
