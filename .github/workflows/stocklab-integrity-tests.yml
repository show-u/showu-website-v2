name: StockLab integrity tests

on:
  push:
    paths:
      - 'stock-lab/**'
      - '.gitignore'
      - '.github/workflows/stocklab-integrity-tests.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax checks
        run: |
          for f in app tpex same-origin-cache licensed-history session-context taiwan-model-v2 markets futures event-risk entry-decision top10-gate market-router position-input holding-model ui-patch holding-router holding-usable health hard-policy compliance-gate public-output api-client runtime-config; do
            test -f "stock-lab/$f.js"
            node --check "stock-lab/$f.js"
          done
          python -m py_compile \
            stock-lab/backtest-taiwan-v3.py \
            stock-lab/validate-licensed-bundle.py \
            stock-lab/import-licensed-history.py \
            stock-lab/run-holding-exit-oos.py \
            stock-lab/build-holding-readiness.py \
            stock-lab/gate-holding-evaluator.py

      - name: Current StockLab truth invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          R=lambda p:Path(p).read_text(encoding='utf-8')
          J=lambda p:json.loads(R(p))

          idx=R('stock-lab/index.html')
          router=R('stock-lab/market-router.js')
          top10=R('stock-lab/top10-gate.js')
          pos=R('stock-lab/position-input.js')
          hold_router=R('stock-lab/holding-router.js')
          hold_model=R('stock-lab/holding-model.js')
          cache=R('stock-lab/same-origin-cache.js')
          compliance=R('stock-lab/compliance-gate.js')
          hard=R('stock-lab/hard-policy.js')
          runtime=R('stock-lab/runtime-config.js')
          licensed=R('stock-lab/licensed-history.js')
          session=R('stock-lab/session-context.js')
          validator=R('stock-lab/validate-licensed-bundle.py')
          gitignore=R('.gitignore')

          policy=J('stock-lab/verification-policy.json')
          sources=J('stock-lab/history-source-registry.json')
          holding_protocol=J('stock-lab/holding-exit-validation-protocol.json')
          licensed_contract=J('stock-lab/licensed-data-contract.json')

          # A. Absolute truth rules remain non-negotiable.
          assert policy['policy_name']=='StockLab Taiwan Truth Rules'
          required=('LEGAL_SOURCE_ONLY','NO_IMPUTATION','FACT_ESTIMATE_SEPARATION','TRACEABILITY','FAIL_CLOSED','NO_HORIZON_BUY_MODEL','POSITION_INPUT_PROVENANCE','NO_FAKE_CONFIDENCE','NO_UNBUYABLE_ENTRY_BANDS','BUY_HOLDING_SEPARATION','EXIT_MODEL_SEPARATION')
          for k in required: assert k in policy['absolute_invariants'],k
          oc=policy['output_contract']
          for k in ('forbid_synthetic_fill','forbid_stale_as_current','forbid_unverified_as_fact','forbid_probability_without_calibration','forbid_horizon_specific_buy_prices'):
              assert oc[k] is True,k
          assert policy['legal_use']['official_website_only']['allowed_for_automated_collection'] is False
          assert policy['legal_use']['real_time_or_delayed_trading_information']['allowed'] is False

          # B. Old short/mid/long buy-price UX must never return.
          for text in ('不知道買什麼','想買這檔','已持有','分析進場價格','分析出場時機','總量成本均價','目前持有股數','首次買入日'):
              assert text in idx,text
          for legacy in ('id="horizon"','scanHorizon','holdHorizon','短線｜約1個月','波段｜約3個月','長期｜1年以上','短線入場區間','中期入場區間','長期佈局區間'):
              assert legacy not in idx+router+top10,legacy
          assert '不選短／中／長' in idx

          # C. Position facts are user facts only; missing values remain missing.
          for text in ('user_observed','derived_from_user_lots','缺值不補 0','weighted=totalShares?totalCost/totalShares:null','validDate(d)'):
              assert text in pos,text
          assert 'averageCost:a' in pos and 'shares:s' in pos and 'buyDate:d' in pos
          assert 'market-data inference' in pos

          # D. Buy/scan prediction stays backend-gated. Holding management is a separate deterministic rule path.
          assert 'api.analyze(code)' in router
          assert 'api.scan()' in top10
          for forbidden in ('StockLabEntryDecision.evaluate','openingGapStats','intradayPullbackStats','buildBuyPlan'):
              assert forbidden not in router,forbidden
          assert 'StockLabHolding' in hold_router and 'model.analyze(p,hb.bars' in hold_router
          assert "validation:'RULE_BASED'" in hold_model
          assert "model:'TW-holding-rule-v1'" in hold_model
          assert 'requiredBars:()=>1' in hold_model
          assert 'imputation_used:false' in hold_model
          assert 'confidence_calibrated:false' in hold_model
          assert 'NOT_REQUIRED_FOR_RULE_BASED_OUTPUT' in hold_model
          assert 'OOS 未通過時仍可顯示由已驗證事實直接推導的持倉風險規則' in hold_model
          for forbidden in ('勝率','成功率','校準信心指數'):
              # These words may appear only in explicit prohibition/limits text, never as a numeric claim.
              assert f'{forbidden}：' not in hold_router+hold_model

          # E. Holding rule output is fail-closed on legal/verified price facts and never invents missing prices.
          assert "ctx.legalSource!==true" in hold_model
          assert "ctx.priceVerified!==true" in hold_model
          assert "if(!r.length)throw Error('沒有可用的已驗證收盤資料')" in hold_model
          assert "trigger!=null?'derived_from_verified_bars':'unavailable'" in hold_model
          assert '缺少的資料維持缺少，不以假資料補值' in hold_router
          assert "x.source!=='licensed-open-data-cache'" in hold_router
          assert "!String(x.licence||'').includes('OGDL')" in hold_router
          assert '非盤中即時價' in hold_router

          # F. Public cache/source legality stays fail-closed.
          assert "mode:'online-only'" in cache
          for text in ('persistentMirror:false','remoteFallback:false','cacheIsSource:false','missingDataFallback:false'):
              assert text in cache,text
          assert 'browser-data.json' in compliance
          assert "x.source!=='licensed-open-data-cache'" in compliance
          assert "!String(x.licence||'').includes('OGDL')" in compliance
          assert '不以 0、平均值、舊值或 AI 補齊' in compliance

          # G. Licensed-history contract remains fail-closed and network-free.
          assert licensed_contract['contract_name']=='StockLab Licensed Taiwan Market Data Bundle'
          nr=licensed_contract['non_negotiable_rules']
          for k in ('no_network_fallback','no_unlicensed_website_scraping','no_missing_dataset_imputation','no_stale_data_relabelled_current','no_raw_redistribution_without_permission','every_payload_file_requires_sha256','every_observation_requires_source_provenance','license_must_allow_automated_processing','license_must_allow_derived_outputs','production_and_oos_use_same_normalization_rules'):
              assert nr[k] is True,k
          for text in ('licensed-data/manifest.json','SHA-256','networkFallback:false','imputation:false','StockLabLicensedHistory'):
              assert text in licensed,text
          for forbidden in ('urllib.request','requests.get','http://','https://'):
              assert forbidden not in validator,forbidden

          # H. OOS is still mandatory for statistical claims, but is not a lock on deterministic holding rules.
          assert holding_protocol['non_negotiable_rules']['missing_inputs_are_not_imputed'] is True
          assert holding_protocol['non_negotiable_rules']['no_horizon_selector'] is True
          assert holding_protocol['non_negotiable_rules']['production_formula_must_equal_test_formula'] is True
          assert holding_protocol['non_negotiable_rules']['no_hindsight_high_low_execution'] is True
          assert holding_protocol['non_negotiable_rules']['confidence_requires_separate_oos_calibration'] is True
          assert 'NO_FAKE_CONFIDENCE' in policy['absolute_invariants']

          # I. Stale/previous close cannot be relabelled as current live price.
          for text in ('WAITING_TODAY_CLOSE_DATA','STALE_BASE_DATE','IMPOSSIBLE_CURRENT_CLOSE','盤中僅供參考，不以昨日資料重算現在價格'):
              assert text in session,text
          assert '13:30 後也必須等當日官方收盤資料實際前進並完成驗證' in router
          assert '09:00 後沒有合法即時／延遲行情授權時不重算當日價格' in router

          # J. Historical source candidates never become data merely because a URL exists.
          assert sources['rules']['public_url_is_not_a_licence'] is True
          assert sources['rules']['no_scraping_for_backfill'] is True
          assert sources['rules']['no_unverified_third_party_backfill'] is True
          assert sources['rules']['no_imputation'] is True
          og=sources['sources']['ogdl_daily_forward_archive']
          assert og['status']=='active_forward_archive_only'
          assert og['history_backfill'] is False
          assert og.get('scoring_allowed_for_historical_backfill') is False

          # K. Raw licensed history must never enter this public repository.
          assert 'stock-lab/history-licensed/*' in gitignore
          assert '!stock-lab/history-licensed/README.md' in gitignore

          # L. General production predictions stay deliberately locked; rule-based holding is the explicit exception.
          assert 'productionPredictionReady:false' in runtime
          assert 'no OOS lock' in hold_router
          assert 'actionable deterministic holding rules' in hold_router

          print('PASS: Taiwan truth architecture and rule-based holding path are internally consistent')
          PY

      - name: Reject raw licensed history in public repository
        run: |
          set -euo pipefail
          bad="$(git ls-files 'stock-lab/history-licensed/**' | grep -v '^stock-lab/history-licensed/README.md$' || true)"
          if [ -n "$bad" ]; then
            echo 'Raw licensed history is tracked in the public repository:'
            echo "$bad"
            exit 1
          fi
          echo 'PASS: no raw licensed history is tracked'
