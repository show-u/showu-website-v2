name: StockLab integrity tests

on:
  push:
    paths:
      - 'stock-lab/**'
      - '.gitignore'
      - '.github/workflows/stocklab-integrity-tests.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax checks
        run: |
          for f in app tpex same-origin-cache licensed-history verified-history session-context taiwan-model-v2 markets futures event-risk entry-decision top10-gate market-router position-input holding-model ui-patch holding-router health hard-policy compliance-gate public-output api-client runtime-config operational-fallback; do
            test -f "stock-lab/$f.js"
            node --check "stock-lab/$f.js"
          done
          python -m py_compile \
            stock-lab/backtest-taiwan-v3.py \
            stock-lab/validate-licensed-bundle.py \
            stock-lab/import-licensed-history.py

      - name: Holding one-bar execution-reference behavior
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');
          global.window={
            StockLabTaiwan:{roundTick:(p)=>p},
            StockLabEntryDecision:{exitPlan:()=>({available:false,reason:'合法歷史不足'})}
          };
          vm.runInThisContext(fs.readFileSync('stock-lab/holding-model.js','utf8'));
          const r=window.StockLabHolding.analyze(
            {averageCost:100,shares:1000,buyTime:'2026-09-01T09:00'},
            [{iso:'2026-09-19',o:108,h:112,l:107,c:110}],
            {legalSource:true,priceVerified:true,ninePlus3:{complete:false,score:null,confidenceIndex:0},oosStatus:'INSUFFICIENT'}
          );
          assert.strictEqual(r.decision.executionReference,110);
          assert.strictEqual(r.decision.breakevenReference,100);
          assert.strictEqual(r.decision.riskTrigger,null);
          assert.notStrictEqual(r.decision.state,'價格結構不足');
          assert.strictEqual(r.audit.oos_status,'INSUFFICIENT');
          assert.strictEqual(r.audit.imputation_used,false);
          console.log('PASS: one verified close produces execution reference without fake structure or OOS lock');
          NODE

      - name: Current StockLab truth invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          R=lambda p:Path(p).read_text(encoding='utf-8')
          J=lambda p:json.loads(R(p))

          idx=R('stock-lab/index.html')
          router=R('stock-lab/market-router.js')
          top10=R('stock-lab/top10-gate.js')
          pos=R('stock-lab/position-input.js')
          hold_router=R('stock-lab/holding-router.js')
          hold_model=R('stock-lab/holding-model.js')
          public=R('stock-lab/public-output.js')
          fallback=R('stock-lab/operational-fallback.js')
          cache=R('stock-lab/same-origin-cache.js')
          compliance=R('stock-lab/compliance-gate.js')
          runtime=R('stock-lab/runtime-config.js')
          licensed=R('stock-lab/licensed-history.js')
          verified_history=R('stock-lab/verified-history.js')
          session=R('stock-lab/session-context.js')
          validator=R('stock-lab/validate-licensed-bundle.py')
          gitignore=R('.gitignore')

          policy=J('stock-lab/verification-policy.json')
          sources=J('stock-lab/history-source-registry.json')
          licensed_contract=J('stock-lab/licensed-data-contract.json')

          # A. Non-negotiable Taiwan truth rules.
          assert policy['version']>=10
          assert policy['policy_name']=='StockLab Taiwan Truth Rules'
          required=('LEGAL_SOURCE_ONLY','NO_IMPUTATION','FACT_ESTIMATE_SEPARATION','TRACEABILITY','FAIL_CLOSED','NO_HORIZON_BUY_MODEL','POSITION_INPUT_PROVENANCE','NO_FAKE_CONFIDENCE','NO_UNBUYABLE_ENTRY_BANDS','BUY_HOLDING_SEPARATION','EXIT_MODEL_SEPARATION','HOLDING_RULES_NOT_OOS_LOCKED','HOLDING_EXECUTION_REFERENCE_NOT_STRUCTURE_LOCKED','THREE_INPUT_HOLDING_POSITION','EXECUTABLE_ENTRY_ONLY','RULE_BASED_ENTRY_REFERENCE','SECTOR_RESEARCH_SHORTLIST','ENTRY_PRICE_DECISION_SEPARATION','PRICE_STRUCTURE_GATE')
          for k in required: assert k in policy['absolute_invariants'],k
          oc=policy['output_contract']
          for k in ('forbid_synthetic_fill','forbid_stale_as_current','forbid_unverified_as_fact','forbid_probability_without_calibration','forbid_horizon_specific_buy_prices'):
              assert oc[k] is True,k
          assert oc['predictive_recommendation_requires_oos_pass'] is True
          assert oc['deterministic_holding_rules_require_oos_pass'] is False
          assert policy['legal_use']['official_website_only']['allowed_for_automated_collection'] is False
          assert policy['legal_use']['real_time_or_delayed_trading_information']['allowed'] is False

          # B. Old short/mid/long buy-price UX must never return.
          for text in ('不知道買什麼','我還沒買','已持有','9+3 入場分析','分析出場時機','目前成本均價','目前持有股數','目前部位總成本','首次買入時間'):
              assert text in idx,text
          for legacy in ('id="horizon"','scanHorizon','holdHorizon','短線｜約1個月','波段｜約3個月','長期｜1年以上','短線入場區間','中期入場區間','長期佈局區間'):
              assert legacy not in idx+router+top10,legacy
          assert '短／中／長' in idx
          assert 'id="holdTotalCost"' in idx

          # C. Position facts come only from the user.
          for text in ('user_observed','derived_from_user_lots','缺值不補 0','weighted=totalShares?sumCost/totalShares:null','validDateTime(bt)'):
              assert text in pos,text
          assert 'averageCost:a' in pos and 'shares:sh' in pos and 'totalCost:tc' in pos and 'buyTime:bt' in pos
          assert '成本均價與部位總成本至少要輸入一個' in pos
          assert '成本均價 × 股數與你輸入的總成本不一致' in pos
          assert 'market-data inference' in pos

          # D. Entry price geometry is separate from 9+3 action; prices remain fail-closed on verified price structure.
          assert '今日／下一交易日入場判斷' in router
          assert '拉回入場區' in router and '突破入場觸發' in router
          assert 'StockLabSessionContext?.resolve' in router
          assert '9+3 決策層' in router
          assert 'StockLabEntryDecision?.entryPlan' in router
          assert '決策信心指數' in router
          assert "model:'TW-two-route-entry-v1'" in R('stock-lab/entry-decision.js')
          assert "if(!d?.complete)return{available:false,reason:'9+3 尚未全部驗證；不產生數字入場建議'}" not in R('stock-lab/entry-decision.js')
          assert policy['output_contract']['numeric_entry_requires_complete_9plus3'] is False
          assert policy['output_contract']['entry_action_requires_complete_9plus3'] is True
          assert policy['output_contract']['numeric_entry_requires_price_structure_gate'] is True
          assert policy['output_contract']['entry_zone_outputs']==['pullback_entry_zone','breakout_entry_trigger_and_band','no_chase_ceiling','structure_invalidation_price']
          assert policy['output_contract']['numeric_exit_requires_complete_9plus3'] is False
          assert policy['output_contract']['full_holding_direction_requires_complete_9plus3'] is True
          assert '各類股近期績優研究標的' in top10
          assert 'slice(0,5)' in top10 and '這是研究候選，不是勝率排名' in top10
          assert policy['prediction_requirements']['rule_based_entry_reference']['oos_required'] is False
          assert policy['prediction_requirements']['sector_research']['oos_required'] is False
          assert policy['output_contract']['sector_research_max_per_industry']==5
          assert 'StockLabHolding' in hold_router and 'model.analyze(p,modelBars' in hold_router
          assert "validation:'9PLUS3_WEIGHTED_RULE_BASED'" in hold_model
          assert "model:'TW-holding-9plus3-v6'" in hold_model
          assert '下一交易時段出場／減碼定價基準' in hold_router
          assert '成本損益零界' in hold_router and '結構風險線' in hold_router
          assert 'executionReference' in hold_model and 'breakevenReference' in hold_model
          assert 'decisionConfidenceIndex' in hold_model and 'StockLabEntryDecision?.exitPlan' in hold_model
          assert 'requiredBars:()=>1' in hold_model
          assert 'imputation_used:false' in hold_model
          assert 'probability_calibrated:false' in hold_model
          assert 'NOT_REQUIRED_FOR_RULE_BASED_OUTPUT' in hold_model
          assert '任何統計機率仍須正式 OOS 校準' in hold_model
          assert policy['prediction_requirements']['holding_rules']['oos_required'] is False
          assert policy['history_requirements']['holding_rules']['minimum_verified_closes']==1
          assert policy['history_requirements']['holding_rules']['execution_reference_minimum_bars']==1
          assert policy['history_requirements']['holding_rules']['structural_exit_minimum_bars']==60
          assert policy['output_contract']['holding_execution_reference_requires_oos_pass'] is False
          assert policy['output_contract']['holding_execution_reference_requires_60_bars'] is False
          assert policy['output_contract']['holding_execution_reference_is_prediction'] is False
          assert policy['output_contract']['holding_structural_risk_line_minimum_bars']==60
          assert policy['prediction_requirements']['holding_rules']['execution_reference_required']==['user_average_cost_or_total_cost','user_shares','verified_latest_close','taiwan_tick_rule']
          assert policy['prediction_requirements']['holding_rules']['structural_risk_line_required']==['minimum_60_legal_verified_ohlc','taiwan_tick_rule']
          assert 'numeric_exit_required' not in policy['prediction_requirements']['holding_rules']
          assert policy['backtest_validation']['holding_statistical_claims_require_oos'] is True
          assert policy['backtest_validation']['deterministic_holding_rules_require_oos'] is False

          # E. The stale OOS holding lock and all of its runtime artifacts are permanently absent.
          obsolete=[
            'stock-lab/backtest-taiwan-v3.py',
            'stock-lab/backtest-result.json',
            '.github/workflows/stocklab-backtest.yml',
            'stock-lab/holding-usable.js',
            'stock-lab/build-holding-readiness.py',
            'stock-lab/formalize-holding-oos.py',
            'stock-lab/gate-holding-evaluator.py',
            'stock-lab/holding-exit-history-context.json',
            'stock-lab/holding-exit-oos-result.json',
            'stock-lab/holding-exit-validation-protocol.json',
            'stock-lab/holding-oos-evaluator.mjs',
            'stock-lab/holding-readiness.json',
            'stock-lab/run-holding-exit-oos.py',
            'stock-lab/run-private-holding-validation.py',
            '.github/workflows/stocklab-holding-exit-oos.yml'
          ]
          for p in obsolete: assert not Path(p).exists(),f'obsolete holding lock returned: {p}'
          for stale in ('holding-readiness.json','historyReadiness'):
              assert stale not in public,f'public-output holding override returned: {stale}'
          assert "document.querySelector('#holdAnalyzeBtn')" not in public
          assert "const hold=document.querySelector('#holdAnalyzeBtn')" not in public
          # compliance-gate must never regain ownership of existing-position analysis.
          assert "const hold=document.querySelector('#holdAnalyzeBtn')" not in compliance
          assert "renderHoldingFacts" not in compliance
          assert "hold.onclick" not in compliance
          assert "正式出場建議仍被阻擋" not in compliance
          assert "holdingExitValidation" not in compliance
          assert 'holding-readiness.json' not in fallback
          assert 'holding_exit_oos_validation_passed' not in R('stock-lab/verification-policy.json')
          assert 'holding_exit_oos_required' not in R('stock-lab/verification-policy.json')

          # F. Holding rule output is fail-closed on legal/verified facts and does not invent missing prices.
          assert "ctx.legalSource!==true" in hold_model
          assert "ctx.priceVerified!==true" in hold_model
          assert "if(!r.length)throw Error('沒有可用的已驗證收盤資料')" in hold_model
          assert "executionReference:'derived_from_latest_verified_close'" in hold_model
          assert "breakevenReference:'derived_from_user_cost'" in hold_model
          assert "riskTrigger:trigger!=null?'derived_from_verified_price_structure':'unavailable'" in hold_model
          assert "state='價格結構不足'" not in hold_model
          assert '缺少的資料維持缺少，不以假資料補值' in hold_router
          assert 'StockLabSameOrigin' in hold_router
          assert 'StockLabVerifiedHistory' in hold_router
          assert "row.licence!=='OGDL-1.0'" in hold_router
          assert '非盤中即時價' in hold_router
          assert '持股與出場管理' in hold_router and '目前建議動作' in hold_router
          assert '最新完成交易日收盤可以作下一交易時段的委託定價基準' in hold_router

          # G. Public facts source legality stays fail-closed and obsolete browser-data is forbidden.
          assert "mode:'licensed-normalized-market-facts'" in cache
          for text in ('persistentMirror:true','rawDatasetMirror:false','remoteFallback:false','cacheIsSource:true','missingDataFallback:false','market-facts.json'):
              assert text in cache,text
          assert 'browser-data.json' not in cache+compliance+hold_router
          assert 'ogdl-normalized-market-facts' in compliance
          assert "x.licence!=='OGDL-1.0'" in compliance
          assert '不以 0、平均值、舊值或 AI 補齊' in compliance

          # H. Verified OGDL archive and licensed-history contract both remain fail-closed and network-free.
          for text in ("MANIFEST='./history-ogdl/manifest.json'","licence!=='OGDL-1.0'","source_class!=='ogdl_daily_archive'","networkFallback:false","imputation:false","StockLabVerifiedHistory"):
              assert text in verified_history,text
          for forbidden in ('http://','https://'):
              assert forbidden not in verified_history,forbidden

          # Licensed-history contract remains fail-closed and network-free.
          assert licensed_contract['contract_name']=='StockLab Licensed Taiwan Market Data Bundle'
          nr=licensed_contract['non_negotiable_rules']
          for k in ('no_network_fallback','no_unlicensed_website_scraping','no_missing_dataset_imputation','no_stale_data_relabelled_current','no_raw_redistribution_without_permission','every_payload_file_requires_sha256','every_observation_requires_source_provenance','license_must_allow_automated_processing','license_must_allow_derived_outputs','production_and_oos_use_same_normalization_rules'):
              assert nr[k] is True,k
          for text in ('licensed-data/manifest.json','SHA-256','networkFallback:false','imputation:false','StockLabLicensedHistory'):
              assert text in licensed,text
          for forbidden in ('urllib.request','requests.get','http://','https://'):
              assert forbidden not in validator,forbidden

          # I. Previous close cannot be relabelled as current live price.
          for text in ('WAITING_TODAY_CLOSE_DATA','STALE_BASE_DATE','IMPOSSIBLE_CURRENT_CLOSE','盤中僅供參考，不以昨日資料重算現在價格'):
              assert text in session,text
          assert 'NO_INTRADAY_REPRICE_WITHOUT_LIVE_FEED' in policy['absolute_invariants']
          assert '非盤中即時價' in hold_router

          # J. A historical-source URL never becomes legal data merely by existing.
          assert sources['rules']['public_url_is_not_a_licence'] is True
          assert sources['rules']['no_scraping_for_backfill'] is True
          assert sources['rules']['no_unverified_third_party_backfill'] is True
          assert sources['rules']['no_imputation'] is True
          og=sources['sources']['ogdl_daily_forward_archive']
          assert og['status']=='active_forward_archive_only'
          assert og['history_backfill'] is False
          assert og.get('scoring_allowed_for_historical_backfill') is False

          # K. Raw licensed history must never enter this public repository.
          assert 'stock-lab/history-licensed/*' in gitignore
          assert '!stock-lab/history-licensed/README.md' in gitignore

          # L. General production predictions remain locked; deterministic research and holding rules are explicit non-predictive paths.
          assert 'productionPredictionReady:false' in runtime
          assert 'ruleBasedEntryReferenceEnabled:true' in runtime
          assert 'sectorResearchEnabled:true' in runtime
          assert 'Existing-position management is owned exclusively by holding-router.js' in public
          assert 'does not depend on obsolete holding-OOS readiness artifacts' in fallback

          assert Path('stock-lab/model-validation-gate.py').exists(),'model validation gate missing'\n          assert Path('.github/workflows/stocklab-model-validation.yml').exists(),'model validation workflow missing'\n          print('PASS: Taiwan truth architecture; legacy horizon/backtest artifacts permanently removed')
          PY

      - name: Reject raw licensed history in public repository
        run: |
          set -euo pipefail
          bad="$(git ls-files 'stock-lab/history-licensed/**' | grep -v '^stock-lab/history-licensed/README.md$' || true)"
          if [ -n "$bad" ]; then
            echo 'Raw licensed history is tracked in the public repository:'
            echo "$bad"
            exit 1
          fi
          echo 'PASS: no raw licensed history is tracked'
