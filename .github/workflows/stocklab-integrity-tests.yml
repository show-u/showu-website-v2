name: StockLab integrity tests

on:
  push:
    paths:
      - 'stock-lab/**'
      - '.github/workflows/update-browser-cache.yml'
      - '.github/workflows/update-market-snapshot.yml'
      - '.github/workflows/update-taifex-tx.yml'
      - '.github/workflows/update-tpex-health.yml'
      - '.github/workflows/update-taiwan-factors.yml'
      - '.github/workflows/stocklab-integrity-tests.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: JavaScript syntax checks
        run: |
          for f in app indicators-v2 tpex financials same-origin-cache integrity taiwan-model-v2 markets futures event-risk entry-decision top10-gate market-router position-input holding-model ui-patch health hard-policy compliance-gate api-client runtime-config; do
            node --check "stock-lab/$f.js"
          done

      - name: StockLab Truth Rules v9 invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          R=lambda p:Path(p).read_text(encoding='utf-8')
          policy=json.loads(R('stock-lab/verification-policy.json'))
          validation=json.loads(R('stock-lab/model-validation-status.json'))
          runtime=R('stock-lab/runtime-config.js')
          idx=R('stock-lab/index.html')
          entry=R('stock-lab/entry-decision.js')
          router=R('stock-lab/market-router.js')
          position=R('stock-lab/position-input.js')
          holding=R('stock-lab/holding-model.js')
          top10=R('stock-lab/top10-gate.js')
          hard=R('stock-lab/hard-policy.js')
          compliance=R('stock-lab/compliance-gate.js')
          markets=R('stock-lab/markets.js')
          futures=R('stock-lab/futures.js')
          events=R('stock-lab/event-risk.js')
          cache=R('stock-lab/same-origin-cache.js')
          cachewf=R('.github/workflows/update-browser-cache.yml')

          assert policy['version']==9 and policy['policy_name']=='StockLab Taiwan Truth Rules'
          required={
            'TW_MARKET_SCOPE','LEGAL_SOURCE_ONLY','NO_IMPUTATION','FACT_ESTIMATE_SEPARATION','TRACEABILITY',
            'EXACT_SCHEMA_ONLY','FRESHNESS','PRICE_CROSS_CHECK','HISTORY_COMPLETENESS','NO_FAKE_CONFIDENCE',
            'TAIWAN_MICROSTRUCTURE','CORPORATE_ACTION_GATE','ACTIVE_RISK_STATUS','ACCOUNTING_CLASS_GATE',
            'MODEL_VALIDATION_GATE','FAIL_CLOSED','RAW_REDISTRIBUTION','AUDITABILITY',
            'ENTRY_DECISION_CONTRACT','ENTRY_NINE_FACTORS','ENTRY_EXTERNAL_CONTEXT','UNIFIED_ENTRY_SCANNER',
            'BUY_HOLDING_SEPARATION','TARGET_SESSION_BY_DATA_DATE','NEXT_SESSION_INPUT_COMPLETENESS',
            'NO_INTRADAY_REPRICE_WITHOUT_LIVE_FEED','NO_UNBUYABLE_ENTRY_BANDS','POSITION_INPUT_PROVENANCE',
            'EXIT_MODEL_SEPARATION','TOP10_REASON_REQUIRED','NO_HORIZON_BUY_MODEL','DIVIDEND_TRUTH'}
          assert set(policy['absolute_invariants'])==required
          assert set(policy['provenance_classes'])=={'observed','user_observed','derived','model_estimate','unavailable'}

          # Missing/unverified data must stay missing. Public URL alone is not a licence.
          assert policy['legal_use']['official_website_only']['allowed_for_automated_collection'] is False
          assert policy['legal_use']['real_time_or_delayed_trading_information']['allowed'] is False
          oc=policy['output_contract']
          for k in ('forbid_synthetic_fill','forbid_stale_as_current','forbid_unverified_as_fact','forbid_probability_without_calibration','forbid_deep_support_as_current_buy','forbid_intraday_reprice_without_live_feed','forbid_horizon_specific_buy_prices','next_session_requires_all_inputs_complete','target_session_must_follow_verified_data_date','recommendation_requires_oos_pass','scanner_must_use_same_entry_contract','scanner_must_explain_reasons','scanner_must_explain_risks','scanner_must_not_emit_buy_price'):
            assert oc[k] is True,k
          assert oc['score_is_probability'] is False
          assert policy['news_events']['required_for_entry_context'] is True
          assert 'unknown' in policy['news_events']['rule'].lower()

          # Registered scoring datasets must have explicit licence; T86 stays blocked.
          registry=policy['licensed_dataset_registry']
          for name,x in registry.items():
            if x.get('scoring',True) is not False:
              assert x.get('licence')=='OGDL-1.0',(name,x)
          t86=registry['twse_t86_stock_institution']
          assert t86['licence']=='unverified' and t86['automated_collection'] is False and t86['scoring'] is False

          # UX has exactly three workflows and no investment-horizon buy/holding selector.
          for x in ('不知道買什麼','想買這檔','已持有','判斷是否適合入場','目前總量成本均價','目前持有股數','首次買入日','逐筆輸入目前仍持有的買入明細','9項入場因子＋3個市場背景','美股','台指期 TX','國際時事'):
            assert x in idx,x
          assert 'holdHorizon' not in idx
          assert '<option value="1m"' not in idx and '<option value="3m"' not in idx and '<option value="long"' not in idx
          assert './entry-decision.js' in idx and './position-input.js' in idx
          assert idx.rfind('./entry-decision.js')<idx.rfind('./market-router.js')
          assert idx.rfind('./position-input.js')<idx.rfind('./holding-model.js')
          assert idx.rfind('./compliance-gate.js')>idx.rfind('./health.js')

          # Unified nine-factor entry contract.
          factor_keys=('trend','volume','movingAverages','institution','macd','rsi','kd','crossovers','candlestick')
          for k in factor_keys: assert f"'{k}'" in entry,k
          for label in ('價格趨勢＋支撐／壓力','成交量','均線結構','法人／籌碼','MACD','RSI','KD／KDJ','黃金／死亡交叉','K線型態'):
            assert label in entry,label
          assert 'StockLabExternalMarket' in entry and 'StockLabTX' in entry and 'StockLabEvents' in entry
          assert "decision:complete?'等待已驗證 OOS 決策模型':'資料不完整，禁止形成入場結論'" in entry

          # External contexts fail closed instead of treating unknown as neutral/zero.
          assert 'window.StockLabExternalMarket' in markets and 'context:usContext' in markets
          assert 'window.StockLabTX' in futures and 'context:txContext' in futures
          assert 'window.StockLabEvents' in events and 'context:eventContext' in events
          assert '未知不能寫成「無事件」' in events

          # Single-stock and TOP10 use the exact same 9+3 contract.
          assert 'StockLabEntryDecision.evaluate' in router
          assert all(x in router for x in ('九項入場判斷','美股／台指期／國際時事','entryNineFactors','usMarketContext','txFuturesContext','internationalEventFeed','entryDecisionOosValidation'))
          assert "STRATEGY='entry'" in top10
          assert all(k in top10 for k in factor_keys)
          assert all(x in top10 for x in ('contextAuditOK','reasons.length<2','!risks.length','通過全部 Gate 的股票只有'))
          for legacy in ('momentum:{','growth:{','income:{','total_return:{','scanner_momentum','scanner_growth','scanner_income','scanner_total_return'):
            assert legacy not in top10+hard+runtime,legacy

          # Position input is user supplied; lot mode derives weighted average without inventing missing values.
          assert all(x in position for x in ('StockLabPositionInput','positionInputMode','逐筆買入明細尚未完整','derived_from_user_lots','缺值不補 0'))
          assert 'totalCost=used.reduce' in position and 'weighted=totalShares?totalCost/totalShares:null' in position
          assert "if(!(a>0)||!(s>0)||!d)throw Error('逐筆買入明細尚未完整')" in position

          # Holding is cost/position/buy-date based; actual holding age selects structure automatically.
          assert all(x in holding for x in ('averageCost','shares','buyDate','entryContextComplete','TW-holding-exit-v3','user_observed','holdingProfile','estimatedTradingDays','sharesAffectSignal:false'))
          assert 'horizonConfig' not in holding and 'holdHorizon' not in compliance
          assert '正式出場模型需要有效首次買入日' in holding
          assert '持有股數只用於計算市值與金額損益' in holding

          # Runtime and hard policy remain fail closed until all new gates are explicitly passed.
          assert 'hardPolicyVersion:9' in runtime
          assert 'allowLocalFallback:false' in runtime and 'productionPredictionReady:false' in runtime
          for s in ('licensedHistoricalOHLC:false','securityMaster:false','tradingCalendar:false','corporateActions:false','taiwanRiskState:false','entryNineFactors:false','usMarketContext:false','txFuturesContext:false','internationalEventFeed:false','entryDecisionOosValidation:false','holdingExitValidation:false','entryScannerOosValidation:false'):
            assert s in runtime,s
          assert all(x in hard for x in ('entryFactorsComplete','usMarketVerified','txFuturesVerified','internationalEventsVerified',"mode==='scanner_entry'",'entryFactorSetOK','marketContextOK'))
          assert 'imputation_used===true' in hard

          # Facts-only public mode must reveal missing factors, not fabricate a completed answer.
          assert 'VERIFIED FACTS ONLY' in compliance
          assert 'nineFactorBlocked' in compliance and 'marketContextFacts' in compliance
          assert '完整判斷指定的九項因子＋美股＋台指期＋國際時事尚未全部驗證' in compliance
          assert '不以 0、平均值、舊值或 AI 補齊' in compliance

          # Validation status explicitly supersedes legacy horizon results.
          assert validation['schema_version']==3 and validation['architecture']=='unified-entry-holding-v9'
          assert validation['legacy_horizon_entry_results_are_production_valid'] is False
          assert set(validation['models'])=={'entry_decision_9plus3','entry_scanner_9plus3','holding_exit'}
          for name,item in validation['models'].items():
            assert item['status'] in {'BLOCKED_LEGAL_SOURCE','BLOCKED_DATA_LAYER','FAIL','INSUFFICIENT'},(name,item)

          # Public cache still must be licensed open data, not an unexplained official-site mirror.
          assert 'licensed-open-data-cache' in cache and 'OGDL-1.0' in cache and 'schema_version!==2' in cache
          assert all(x in cachewf for x in ('data_gov_dataset','licence_verified','OGDL-1.0','attribution','licensed-open-data-cache'))

          print('StockLab Taiwan Truth Rules v9 unified entry + actual-position holding invariants passed')
          PY

      - name: Fail-closed behavior fixtures
        run: |
          python - <<'PY'
          def complete(nine,us,tx,events,oos):
            return len(nine)==9 and all(x is True for x in nine) and us is True and tx is True and events is True and oos is True
          assert complete([True]*9,True,True,True,True)
          assert not complete([True]*8+[False],True,True,True,True)
          assert not complete([True]*9,False,True,True,True)
          assert not complete([True]*9,True,False,True,True)
          assert not complete([True]*9,True,True,False,True)
          assert not complete([True]*9,True,True,True,False)

          def strict_num(v):
            if v is None:return None
            s=str(v).strip()
            if not s or s in {'-','--','—','N/A','NA','null','undefined'}:return None
            try:return float(s.replace(',','').removesuffix('%'))
            except:return None
          for v in (None,'',' ','-','--','—','N/A','NA','null','undefined'):
            assert strict_num(v) is None
          assert strict_num('0')==0 and strict_num('1,234.5')==1234.5

          # Missing event input is UNKNOWN, never silently converted to neutral/no-event.
          event_verified=False
          event_state='unknown' if not event_verified else 'neutral'
          assert event_state=='unknown'

          # Price estimates cannot be treated as observations.
          provenance={'official_close':'observed','gap_median':'derived','entry_price':'model_estimate','missing_factor':'unavailable'}
          assert provenance['entry_price']!='observed' and provenance['missing_factor']=='unavailable'

          # Holding structure follows actual holding age rather than a user-selected short/mid/long label.
          def lookback(days): return max(20,min(120,round(days*5/7)))
          assert lookback(14)==20
          assert 60<=lookback(90)<=70
          assert lookback(365)==120
          print('v9 no-imputation, unified-entry and actual-position holding fixtures passed')
          PY
