name: StockLab integrity tests

on:
  push:
    paths:
      - 'stock-lab/**'
      - '.github/workflows/update-browser-cache.yml'
      - '.github/workflows/update-market-snapshot.yml'
      - '.github/workflows/update-taifex-tx.yml'
      - '.github/workflows/update-tpex-health.yml'
      - '.github/workflows/update-taiwan-factors.yml'
      - '.github/workflows/stocklab-integrity-tests.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax checks
        run: |
          for f in app indicators-v2 tpex financials same-origin-cache integrity taiwan-model-v2 markets futures event-risk entry-decision top10-gate market-router position-input holding-model ui-patch holding-router health hard-policy compliance-gate api-client runtime-config; do
            node --check "stock-lab/$f.js"
          done
          python -m py_compile stock-lab/backtest-taiwan-v3.py

      - name: Truth, no-imputation, and architecture invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          R=lambda p:Path(p).read_text(encoding='utf-8')

          policy=json.loads(R('stock-lab/verification-policy.json'))
          validation=json.loads(R('stock-lab/model-validation-status.json'))
          protocol=json.loads(R('stock-lab/holding-exit-validation-protocol.json'))
          idx=R('stock-lab/index.html')
          api=R('stock-lab/api-client.js')
          ui=R('stock-lab/ui-patch.js')
          entry=R('stock-lab/entry-decision.js')
          router=R('stock-lab/market-router.js')
          top10=R('stock-lab/top10-gate.js')
          pos=R('stock-lab/position-input.js')
          hold=R('stock-lab/holding-model.js')
          hold_router=R('stock-lab/holding-router.js')
          tw=R('stock-lab/taiwan-model-v2.js')
          runtime=R('stock-lab/runtime-config.js')
          compliance=R('stock-lab/compliance-gate.js')
          backtest=R('stock-lab/backtest-taiwan-v3.py')

          # Absolute truth rules.
          assert policy['version']==9 and policy['policy_name']=='StockLab Taiwan Truth Rules'
          for k in ('LEGAL_SOURCE_ONLY','NO_IMPUTATION','FACT_ESTIMATE_SEPARATION','TRACEABILITY','FAIL_CLOSED','NO_HORIZON_BUY_MODEL','POSITION_INPUT_PROVENANCE','EXIT_MODEL_SEPARATION'):
              assert k in policy['absolute_invariants'],k
          assert set(policy['provenance_classes'])=={'observed','user_observed','derived','model_estimate','unavailable'}
          assert policy['legal_use']['official_website_only']['allowed_for_automated_collection'] is False
          assert policy['legal_use']['real_time_or_delayed_trading_information']['allowed'] is False
          oc=policy['output_contract']
          for k in ('forbid_synthetic_fill','forbid_stale_as_current','forbid_unverified_as_fact','forbid_probability_without_calibration','forbid_horizon_specific_buy_prices','recommendation_requires_oos_pass'):
              assert oc[k] is True,k

          # Three workflows only; obsolete horizon/objective selectors are physically gone, not hidden.
          for text in ('不知道買什麼','想買這檔','已持有','判斷是否適合入場','評估續抱／減碼／出場條件','目前總量成本均價','目前持有股數','首次買入日'):
              assert text in idx,text
          for legacy in ('id="horizon"','id="scanObjective"','holdHorizon','<option value="1m"','<option value="3m"','<option value="long"'):
              assert legacy not in idx,legacy
          assert './entry-decision.js' in idx and './position-input.js' in idx and './holding-model.js' in idx and './holding-router.js' in idx
          assert idx.rfind('./position-input.js') < idx.rfind('./holding-model.js') < idx.rfind('./ui-patch.js') < idx.rfind('./holding-router.js') < idx.rfind('./compliance-gate.js')

          # Public API contract no longer exposes horizon-specific buy analysis.
          assert 'async function analyze(code)' in api and "strategy:'entry'" in api
          assert 'async function scan()' in api
          assert 'async function holding(code,position)' in api
          assert 'analyze(code,horizon)' not in api and 'scan(strategy)' not in api
          assert 'StockLabTickerResolver' in ui and "horizon=document.querySelector" not in ui

          # Entry and scanner use one 9+3 contract; no short/mid/long price bands.
          factor_keys=('trend','volume','movingAverages','institution','macd','rsi','kd','crossovers','candlestick')
          for k in factor_keys: assert f"'{k}'" in entry,k
          assert 'StockLabEntryDecision.evaluate' in router
          assert "STRATEGY='entry'" in top10
          assert '短／中／長買入價' in router
          assert 'adaptiveBand' not in tw
          for legacy in ("h==='1m'","h==='3m'","h==='long'",'entryLow:roundTick','entryHigh:roundTick','TW-structure-volatility-v4'):
              assert legacy not in tw,legacy

          # Position facts originate only from the user; holding uses exact verified trading sessions.
          assert all(x in pos for x in ('StockLabPositionInput','derived_from_user_lots','缺值不補 0','weighted=totalShares?totalCost/totalShares:null'))
          assert all(x in hold for x in ('TW-holding-exit-v4','holdingTradingDays','正式出場模型需要有效首次買入日','首次買入日不在目前合法且驗證通過的歷史交易日序列中','sharesAffectSignal:false'))
          assert 'estimatedTradingDays' not in hold and 'horizonConfig' not in hold
          assert 'btn.onclick=async' in hold_router and 'StockLabPositionInput?.collect' in hold_router and 'StockLabTickerResolver' in hold_router
          assert 'NO IMPUTATION' in hold_router and "oosStatus:'PASS'" in hold_router

          # Compliance gate remains final fail-closed authority while production gates are false.
          assert 'allowLocalFallback:false' in runtime and 'productionPredictionReady:false' in runtime
          for s in ('licensedHistoricalOHLC:false','securityMaster:false','tradingCalendar:false','corporateActions:false','taiwanRiskState:false','entryDecisionOosValidation:false','holdingExitValidation:false','entryScannerOosValidation:false'):
              assert s in runtime,s
          assert 'VERIFIED FACTS ONLY' in compliance and '不以 0、平均值、舊值或 AI 補齊' in compliance

          # Validation contracts are v10/v4 and legacy horizon backtest code stays deleted.
          assert validation['schema_version']==4 and validation['architecture']=='unified-entry-holding-v10'
          assert validation['legacy_horizon_entry_results_are_production_valid'] is False
          assert validation['models']['holding_exit']['candidate_formula']=='TW-holding-exit-v4'
          assert protocol['schema_version']==2 and protocol['protocol_name']=='StockLab TW-holding-exit-v4 OOS Protocol'
          assert protocol['non_negotiable_rules']['no_horizon_selector'] is True
          assert protocol['non_negotiable_rules']['missing_inputs_are_not_imputed'] is True
          assert not Path('stock-lab/backtest-model.py').exists()
          assert "ARCHITECTURE = 'unified-entry-holding-v10'" in backtest
          assert 'NETWORK_HISTORY_COLLECTION_DISABLED = True' in backtest
          for forbidden in ('urllib.request','www.twse.com.tw','www.tpex.org.tw','ThreadPoolExecutor'):
              assert forbidden not in backtest,forbidden

          print('PASS: StockLab unified-entry + actual-position holding architecture is clean and fail-closed')
          PY

      - name: No-imputation behavior fixtures
        run: |
          python - <<'PY'
          def strict_num(v):
              if v is None:return None
              s=str(v).strip()
              if not s or s in {'-','--','—','N/A','NA','null','undefined'}:return None
              try:return float(s.replace(',','').removesuffix('%'))
              except:return None
          for v in (None,'',' ','-','--','—','N/A','NA','null','undefined'):
              assert strict_num(v) is None
          assert strict_num('0')==0 and strict_num('1,234.5')==1234.5
          provenance={'official_close':'observed','position_cost':'user_observed','holding_days':'derived','exit_decision':'model_estimate','missing':'unavailable'}
          assert len(set(provenance.values()))==5
          def lookback(actual_trading_days):return max(20,min(240,actual_trading_days))
          assert lookback(14)==20 and lookback(90)==90 and lookback(365)==240
          print('PASS: missing values remain missing; holding-age derivation is explicit')
          PY
