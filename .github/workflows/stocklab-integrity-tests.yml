name: StockLab integrity tests

on:
  push:
    paths:
      - 'stock-lab/**'
      - '.github/workflows/update-market-snapshot.yml'
      - '.github/workflows/update-taifex-tx.yml'
      - '.github/workflows/update-tpex-health.yml'
      - '.github/workflows/update-taiwan-factors.yml'
      - '.github/workflows/stocklab-integrity-tests.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: JavaScript syntax checks
        run: |
          for f in app indicators-v2 tpex financials integrity taiwan-model-v2 markets futures event-risk top10-gate market-router ui-patch; do node --check "stock-lab/$f.js"; done
          python -m py_compile stock-lab/backtest-model.py stock-lab/backtest-taiwan-v3.py
      - name: Source policy and Taiwan-model checks
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlparse
          R=lambda p:Path(p).read_text(encoding='utf-8')
          idx=R('stock-lab/index.html');app=R('stock-lab/app.js');indicators=R('stock-lab/indicators-v2.js')
          tpex=R('stock-lab/tpex.js');fin=R('stock-lab/financials.js');integ=R('stock-lab/integrity.js')
          taiwan=R('stock-lab/taiwan-model-v2.js');markets=R('stock-lab/markets.js');futures=R('stock-lab/futures.js')
          events=R('stock-lab/event-risk.js');gate=R('stock-lab/top10-gate.js');router=R('stock-lab/market-router.js');ui=R('stock-lab/ui-patch.js')
          backtest=R('stock-lab/backtest-taiwan-v3.py')
          policy=json.loads(R('stock-lab/verification-policy.json'))
          scripts=('app.js','indicators-v2.js','tpex.js','financials.js','integrity.js','taiwan-model-v2.js','markets.js','futures.js','event-risk.js','top10-gate.js','market-router.js','ui-patch.js')
          for script in scripts: assert f'./{script}' in idx, f'{script} not loaded by index'
          assert 'www.twse.com.tw' in app and 'openapi.twse.com.tw' in app
          assert 'Wilder RSI 14 v2' in indicators and 'avgGain*(p-1)' in indicators and 'avgLoss*(p-1)' in indicators
          assert "h!=='www.tpex.org.tw'" in tpex and 'tpex_mainboard_daily_close_quotes' in tpex
          assert all(x in tpex for x in ('tpex_mainboard_peratio_analysis','tpex_3insti_daily_trading','mopsfin_t187ap05_O','afterTrading/tradingStock','tpex-health.json','requireTpexHealth'))
          assert all(x in fin for x in ('t187ap06_L_ci','t187ap07_L_ci','mopsfin_t187ap06_O_ci','mopsfin_t187ap07_O_ci'))
          assert 'factorIntegrity' in integ and 'integrityCorrection' in integ
          assert 'entryLow:Math.max(lo,L.c*' not in app and 'entryHigh:L.c*' not in app and "h==='long'&&v?.pe" not in app
          assert 'adaptiveBand' in taiwan and 'TW-structure-volatility-v3' in taiwan
          assert all(x in taiwan for x in ('pctRank','sectorFamily',"s==='24'","s==='17'",'margin_change_pct','short_change_pct','riskBlocked','a.integrity?.valuation?.ok'))

          # Pre-open must be an opening-auction model anchored to verified prior close, not a support-band alias.
          assert 'riskBlocked' in router and 'data-five-price-matrix' in router and 'TW-empirical-open-pullback-v5' in router
          assert all(x in router for x in ('① 開盤前掛單價格','② 當日入場適合區間','③ 短線入場區間','④ 中期入場區間','⑤ 長期佈局區間','限價 ROD','tickSize','openingGapStats','官方基準','09:00後'))
          assert "h==='preopen'" in router and 'StockLabTaiwan?.loadFactors' in router
          assert 'orderPrice=roundTick(day.entryLow' not in router
          assert 'mid=(day.entryLow+day.entryHigh)/2' not in router
          assert "if(!a.riskBlocked&&a.score>=45)orderPrice=expectedMid" in router
          assert 'prior official close + empirical overnight-gap median' in backtest
          assert 'opening auction price <= order price' in backtest
          assert "if nxt.open>order" in backtest

          # Fixed percentage entry heuristics must not return.
          forbidden=('L.c*.96','L.c*0.96','L.c*.92','L.c*0.92','L.c*.88','L.c*0.88','L.c*.985','L.c*0.985')
          for x in forbidden: assert x not in app+router+taiwan, f'fixed entry percentage returned: {x}'
          assert 'schema_version!==3' in markets
          assert 'cross_check' in futures and 'TAIFEX' in futures
          assert policy['taiwan']['taiex_futures']['scored'] is False
          assert policy['external_market']['sox']['cross_check_host']=='fred.stlouisfed.org'
          assert policy['external_market']['nasdaq']['cross_check_host']=='fred.stlouisfed.org'
          assert policy['news_events']['scored'] is False and set(policy['news_events']['levels'])=={'A','B','C','D'}
          assert 'headline' in policy['news_events']['rule'].lower() and 'D｜排除' in events
          assert 'TWSE 上市 + TPEx 上櫃' in gate and 'slice(0,40)' in gate and "threshold=h==='1m'?80:85" in gate
          assert 'critical&&score>=threshold' in gate and 'gate.eligible' in gate and '資料完整度' in gate
          assert "marketName='TPEx'" in router and "marketName='TWSE'" in router
          assert '不需要 ChatGPT／GPT 帳號' in idx
          assert '股票代號／股票名稱' in idx and '例如：2454 或 聯發科' in idx
          assert '開盤前｜當日掛單價格' in idx and '當沖｜今天' not in idx
          assert all(x in ui for x in ("singleBtn.addEventListener('click',showSingle)","findBtn.addEventListener('click',showFind)","singlePanel.classList.remove('hidden')",'showSingle();','browser-data.json','建議入場價格區間'))
          assert 'data-five-price-matrix' in ui and "querySelector('[data-price-summary]')?.remove()" in ui
          snap=json.loads(R('stock-lab/market-data.json'));assert set(snap.get('sources',{}))=={'vix','sox','nasdaq'}
          expected={'vix':('CBOE','cdn.cboe.com'),'sox':('Nasdaq','indexes.nasdaq.com'),'nasdaq':('Nasdaq','indexes.nasdaq.com')}
          for k,(src,host) in expected.items():
              x=snap['sources'][k];assert x.get('source')==src;assert urlparse(x.get('url','')).hostname==host
          tx=json.loads(R('stock-lab/futures-data.json'));assert tx.get('source')=='TAIFEX' and tx.get('contract')=='TX'
          for u in tx.get('urls',{}).values():assert urlparse(u).hostname=='www.taifex.com.tw'
          tph=json.loads(R('stock-lab/tpex-health.json'));assert tph.get('schema_version')==1 and tph.get('source')=='TPEx'
          if tph.get('verified'):
              assert tph.get('status')=='ok';assert set(tph.get('checks',{}))=={'snapshot','valuation','institution','revenue','income','balance'}
          print('Taiwan five-price model invariants and source policy passed')
          PY
      - name: Integrity behavior fixture tests
        run: |
          python - <<'PY'
          def rollback(new_date,old_date): return new_date < old_date
          def same_date_change(old,new): return abs(new/old-1)*100 if old else 999
          assert rollback('2026-09-14','2026-09-15') is True
          assert rollback('2026-09-15','2026-09-15') is False
          assert same_date_change(100,100.6)>0.5 and same_date_change(100,100.1)<0.5
          assert abs(-5.9)<25 and abs(30)>25 and abs(40)<60 and abs(70)>60
          a={'date':'2026/09/14','month':'202609','last':45780};b=dict(a);assert a==b;b['last']=45781;assert a!=b
          assert 80>=80 and 79<80 and 85>=85 and 84<85
          assert all([True,True,True]) is True and all([True,False,True]) is False
          print('anomaly, TAIFEX, TPEx health and completeness fixtures passed')
          PY
