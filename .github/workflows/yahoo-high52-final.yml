name: Yahoo adjusted HIGH52 final validation
on:
  push:
    branches: [main]
    paths:
      - 'stock-api/research/yahoo-high52-final.js'
      - '.github/workflows/yahoo-high52-final.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node stock-api/research/yahoo-high52-final.js
