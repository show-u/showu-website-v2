name: Update TAIFEX TX snapshot

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-taifex-tx.yml'
  schedule:
    - cron: '10 8 * * 1-5'
    - cron: '10 10 * * 1-5'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and cross-check official TAIFEX TX pages
        run: |
          python - <<'PY'
          import hashlib, html, json, re, time, urllib.request
          from datetime import datetime, timezone
          from html.parser import HTMLParser
          from urllib.parse import urlparse
          NOW=datetime.now(timezone.utc)
          URLS={'report':'https://www.taifex.com.tw/cht/3/futDailyMarketReport?commodityId=TX','excel':'https://www.taifex.com.tw/cht/3/futDailyMarketExcel?commodity_id=TX'}
          class TextTableParser(HTMLParser):
              def __init__(self): super().__init__(); self.rows=[]; self.current=[]; self.in_row=False; self.in_cell=False; self.cell=[]
              def handle_starttag(self,tag,attrs):
                  if tag=='tr': self.in_row=True; self.current=[]
                  elif tag in ('td','th') and self.in_row: self.in_cell=True; self.cell=[]
              def handle_data(self,data):
                  if self.in_cell: self.cell.append(data)
              def handle_endtag(self,tag):
                  if tag in ('td','th') and self.in_cell:
                      self.current.append(re.sub(r'\s+',' ',html.unescape(''.join(self.cell))).strip()); self.cell=[]; self.in_cell=False
                  elif tag=='tr' and self.in_row:
                      if self.current:self.rows.append(self.current)
                      self.current=[]; self.in_row=False; self.in_cell=False
          def get(url):
              last=None
              for attempt in range(1,4):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 StockLab/1.4 (+verification)'})
                      with urllib.request.urlopen(req,timeout=30) as r:
                          body=r.read(); final=r.geturl(); host=(urlparse(final).hostname or '').lower()
                          if host!='www.taifex.com.tw': raise ValueError(f'unexpected TAIFEX host {host}')
                          return body.decode('utf-8','replace'),final,hashlib.sha256(body).hexdigest(),(r.headers.get('Content-Type','') or '').lower(),attempt
                  except Exception as e:
                      last=e
                      if attempt<3: time.sleep(2*attempt)
              raise last
          def signed(s):
              t=str(s or '').replace(',','').replace('%','').strip(); sign=-1 if ('▼' in t or t.startswith('-')) else 1; m=re.search(r'\d+(?:\.\d+)?',t); return sign*float(m.group()) if m else None
          def number(s):
              m=re.search(r'-?\d+(?:\.\d+)?',str(s or '').replace(',','').strip()); return float(m.group()) if m else None
          def row_to_obj(r):
              cells=[re.sub(r'\s+',' ',str(x)).strip() for x in r]
              try: pos=next(i for i,x in enumerate(cells) if x=='TX')
              except StopIteration:return None
              cells=cells[pos:]
              if len(cells)<13 or not re.fullmatch(r'\d{6}',cells[1]):return None
              v={'month':cells[1],'open':number(cells[2]),'high':number(cells[3]),'low':number(cells[4]),'last':number(cells[5]),'change':signed(cells[6]),'pct':signed(cells[7]),'after_volume':number(cells[8]),'regular_volume':number(cells[9]),'total':number(cells[10]),'settlement':number(cells[11]),'oi':number(cells[12])}
              return v if v['last'] and v['total'] is not None else None
          def parse_page(text):
              plain=html.unescape(re.sub(r'<[^>]+>',' ',text)); plain=re.sub(r'\s+',' ',plain); dm=re.search(r'日期[:：]\s*(\d{4}/\d{2}/\d{2})',plain)
              if not dm:raise ValueError('TAIFEX trade date not found')
              p=TextTableParser(); p.feed(text); rows=[o for o in (row_to_obj(r) for r in p.rows) if o]
              if not rows:
                  markers=list(re.finditer(r'\bTX\s+(\d{6})\b',plain))
                  for idx,m in enumerate(markers):
                      end=markers[idx+1].start() if idx+1<len(markers) else min(len(plain),m.end()+600); toks=re.findall(r'[▲▼+\-]?\s*\d[\d,]*(?:\.\d+)?%?',plain[m.end():end])
                      if len(toks)>=11:
                          v={'month':m.group(1),'open':number(toks[0]),'high':number(toks[1]),'low':number(toks[2]),'last':number(toks[3]),'change':signed(toks[4]),'pct':signed(toks[5]),'after_volume':number(toks[6]),'regular_volume':number(toks[7]),'total':number(toks[8]),'settlement':number(toks[9]),'oi':number(toks[10])}
                          if v['last'] and v['total'] is not None:rows.append(v)
              rows=list({r['month']:r for r in rows}.values())
              if not rows:raise ValueError('no monthly TX rows parsed')
              return dm.group(1),rows
          out={'schema_version':1,'generated_at':NOW.isoformat(),'status':'failed','source':'TAIFEX','contract':'TX','verified':False,'urls':URLS,'validation':[],'raw_sha256':{},'content_type':{},'policy':'run after regular-session data publication; retry later if official pages are not yet synchronized'}
          try:
              parsed={}
              for k,u in URLS.items():
                  text,final,sha,ctype,attempt=get(u); parsed[k]=parse_page(text); out['raw_sha256'][k]=sha; out['content_type'][k]=ctype; out.setdefault('download_attempts',{})[k]=attempt
              d1,r1=parsed['report']; d2,r2=parsed['excel']; out['source_dates']={'report':d1,'excel':d2}
              if d1!=d2:
                  out.update({'status':'pending_sync','sync_reason':'official TAIFEX pages are on different completed trade dates; later scheduled run will retry'})
                  raise RuntimeError(f'trade-date conflict report={d1} excel={d2}')
              a={x['month']:x for x in r1}; b={x['month']:x for x in r2}; common=set(a)&set(b)
              if not common:raise ValueError('no common TX contract month across official pages')
              month=max(common,key=lambda m:a[m]['total']); x,y=a[month],b[month]
              for fld,tol in [('last',0.001),('pct',0.02),('total',0.001)]:
                  if x[fld] is not None and y[fld] is not None and abs(x[fld]-y[fld])>tol:raise ValueError(f'{fld} conflict {x[fld]} vs {y[fld]}')
              if not (1000<x['last']<100000):raise ValueError('TX price outside sanity bounds')
              if x['high'] is not None and x['low'] is not None and not (x['low']<=x['last']<=x['high']):raise ValueError('TX last price outside daily high/low')
              out.update({'status':'ok','verified':True,'trade_date':d1,'contract_month':month,'last_price':x['last'],'change':x['change'],'change_pct':x['pct'],'total_volume':x['total'],'open_interest':x['oi'],'selection_rule':'highest_total_volume_common_monthly_TX','cross_check':'matched','validation':['official_host','trade_date_match','contract_month_match','last_price_match','change_percent_match','volume_match','raw_sha256','price_bounds_ok','ohlc_consistency_ok']})
          except Exception as e:
              out['error']=str(e)[:300]
              if out.get('status')!='pending_sync':out['status']='failed'
          with open('stock-lab/futures-data.json','w',encoding='utf-8') as f:json.dump(out,f,ensure_ascii=False,indent=2)
          PY
      - name: Validate TX snapshot schema
        run: |
          python - <<'PY'
          import json
          x=json.load(open('stock-lab/futures-data.json',encoding='utf-8')); assert x.get('schema_version')==1 and x.get('source')=='TAIFEX' and x.get('contract')=='TX'; assert x.get('status') in {'ok','failed','pending_sync'}
          if x.get('verified'):
              assert x.get('cross_check')=='matched'; assert x.get('trade_date') and x.get('contract_month') and x.get('last_price'); assert len(x.get('raw_sha256',{}).get('report',''))==64 and len(x.get('raw_sha256',{}).get('excel',''))==64; assert 'ohlc_consistency_ok' in x.get('validation',[])
          if x.get('status')=='pending_sync':assert x.get('source_dates') and x.get('verified') is False
          print('TAIFEX snapshot schema valid')
          PY
      - name: Commit snapshot if changed
        run: |
          if git diff --quiet -- stock-lab/futures-data.json; then echo 'No changes'; exit 0; fi
          git config user.name 'stocklab-bot'
          git config user.email 'stocklab-bot@users.noreply.github.com'
          git add stock-lab/futures-data.json
          git commit -m 'update verified TAIFEX TX snapshot'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
