name: StockLab public journey e2e

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/stocklab-public-journey-e2e.yml'
      - 'stock-lab/index.html'
      - 'stock-lab/market-router.js'
      - 'stock-lab/verified-history.js'
      - 'stock-lab/entry-decision.js'
      - 'stock-lab/top10-gate.js'
      - 'stock-lab/position-input.js'
      - 'stock-lab/holding-model.js'
      - 'stock-lab/holding-router.js'
      - 'stock-lab/same-origin-cache.js'
      - 'stock-lab/market-facts.json'

jobs:
  holding-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --no-save
          npx playwright install --with-deps chromium
      - name: Diagnose local market facts schema
        run: |
          node <<'NODE'
          const fs = require('fs');
          const x = JSON.parse(fs.readFileSync('stock-lab/market-facts.json','utf8'));
          function reasons(r){
            const e=[];
            if(!r||r.provenance!=='observed') e.push('provenance');
            if(!r||r.licence!=='OGDL-1.0') e.push('licence');
            if(!['TWSE','TPEx'].includes(r?.market)) e.push('market');
            if(!/^[0-9A-Z]{4,6}$/i.test(String(r?.ticker||''))) e.push('ticker');
            if(!/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(String(r?.date||''))) e.push('date');
            for(const k of ['open','high','low','close']) if(!Number.isFinite(Number(r?.[k]))||Number(r[k])<=0) e.push(k);
            if(Number(r?.high)<Math.max(Number(r?.open),Number(r?.low),Number(r?.close))) e.push('high-range');
            if(Number(r?.low)>Math.min(Number(r?.open),Number(r?.high),Number(r?.close))) e.push('low-range');
            if(!String(r?.name||'').trim()) e.push('name');
            if(!String(r?.source_id||'').trim()) e.push('source_id');
            if(!/^[a-f0-9]{64}$/i.test(String(r?.raw_sha256||''))) e.push('raw_sha256');
            return e;
          }
          const bad=x.rows.map((r,i)=>({i,ticker:r?.ticker,market:r?.market,date:r?.date,name:r?.name,reasons:reasons(r),row:r})).filter(z=>z.reasons.length);
          console.log('rows',x.rows.length,'bad',bad.length);
          for(const z of bad.slice(0,50)) console.log(JSON.stringify(z));
          if(bad.length) process.exit(2);
          NODE
      - name: Wait for matching public deployment
        env:
          BASE_URL: https://www.showujapan.com/stock-lab/
        run: |
          set -euo pipefail
          expected_model=$(grep -o 'holding-model.js?v=[^"]*' stock-lab/index.html | head -1)
          expected_position=$(grep -o 'position-input.js?v=[^"]*' stock-lab/index.html | head -1)
          expected_entry=$(grep -o 'market-router.js?v=[^"]*' stock-lab/index.html | head -1)
          expected_history=$(grep -o 'verified-history.js?v=[^"]*' stock-lab/index.html | head -1)
          expected_decision=$(grep -o 'entry-decision.js?v=[^"]*' stock-lab/index.html | head -1)
          expected_sector=$(grep -o 'top10-gate.js?v=[^"]*' stock-lab/index.html | head -1)
          expected_compliance=$(grep -o 'compliance-gate.js?v=[^"]*' stock-lab/index.html | head -1)
          expected_public=$(grep -o 'public-output.js?v=[^"]*' stock-lab/index.html | head -1)
          test -n "$expected_model" && test -n "$expected_position" && test -n "$expected_entry" && test -n "$expected_history" && test -n "$expected_decision" && test -n "$expected_sector" && test -n "$expected_compliance" && test -n "$expected_public"
          ready=0
          for i in $(seq 1 48); do
            curl -fsSL --max-time 15 "${BASE_URL}?deploy=${RANDOM}" -o /tmp/live-index.html || true
            if grep -Fq "$expected_model" /tmp/live-index.html 2>/dev/null \
              && grep -Fq "$expected_position" /tmp/live-index.html 2>/dev/null \
              && grep -Fq "$expected_entry" /tmp/live-index.html 2>/dev/null \
              && grep -Fq "$expected_history" /tmp/live-index.html 2>/dev/null \
              && grep -Fq "$expected_decision" /tmp/live-index.html 2>/dev/null \
              && grep -Fq "$expected_sector" /tmp/live-index.html 2>/dev/null \
              && grep -Fq "$expected_compliance" /tmp/live-index.html 2>/dev/null \
              && grep -Fq "$expected_public" /tmp/live-index.html 2>/dev/null; then
              ready=1
              break
            fi
            sleep 5
          done
          test "$ready" = 1 || { echo "::error::matching public JS deployment not visible"; exit 1; }
      - name: Verify live StockLab holding journey
        env:
          BASE_URL: https://www.showujapan.com/stock-lab/
        run: |
          timeout 75s node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            let browser;
            try {
            browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
            const errors = [];
            page.on('pageerror', e => errors.push('pageerror: ' + e.message));
            page.on('console', m => {
              console.log('browser-console[' + m.type() + ']: ' + m.text());
              if (m.type() === 'error') errors.push('console: ' + m.text());
            });

            await page.goto(process.env.BASE_URL + '?e2e=' + Date.now(), {
              waitUntil: 'domcontentloaded',
              timeout: 20000
            });

            console.log('stage: page-loaded');

            // Existing-position analysis is a first-class independent path.
            // It must work even when predictive/OOS entry gates are not ready.
            await page.locator('#holdBtn').click({timeout:10000});
            await page.locator('#holdTicker').fill('2454');
            await page.locator('#holdAvgCost').fill('1000');
            await page.locator('#holdShares').fill('100');
            await page.locator('#holdBuyTime').fill('2026-09-01T10:00');
            await page.locator('#holdAnalyzeBtn').click({timeout:10000});
            await page.waitForFunction(() => {
              const t=document.querySelector('#holdResult')?.innerText||'';
              return t.includes('目前建議動作') || t.includes('持倉分析失敗');
            }, null, {timeout:15000});
            const holdFirst=await page.locator('#holdResult').innerText();
            if(holdFirst.includes('持倉分析失敗')) throw new Error('Holding path failed before any entry/scanner flow:\n'+holdFirst);
            for(const required of ['聯發科／2454','目前建議動作','持股與出場管理','下一交易時段出場／減碼定價基準','最新已驗證收盤']) {
              if(!holdFirst.includes(required)) throw new Error('Missing independent holding output: '+required+'\n'+holdFirst);
            }
            for(const required of ['9+3 證據層']) if(!holdFirst.includes(required)) throw new Error('Missing weighted holding decision: '+required+'\n'+holdFirst);
            if(holdFirst.includes('不足價格模型最低 60 根') && !/結構風險線\s*—/.test(holdFirst)) throw new Error('Insufficient legal history emitted a fake structural risk line:\n'+holdFirst);
            console.log('PASS: independent holding path preserves truth and 9+3 weighting');

            // Single-stock entry reference journey.
            await page.locator('#singleBtn').click({timeout:10000});
            await page.locator('#ticker').fill('2454');
            await page.locator('#analyzeBtn').click({timeout:10000});
            await page.waitForFunction(() => {
              const t=document.querySelector('#result')?.innerText||'';
              return t.includes('今日／下一交易日入場判斷') || t.includes('9+3 分析無法完成');
            }, null, {timeout:15000});
            const entryText=await page.locator('#result').innerText();
            if(entryText.includes('9+3 分析無法完成')) throw new Error('9+3 entry journey failed:\n'+entryText);
            for(const required of ['今日／下一交易日入場判斷','9+3 決策層','決策信心指數','資料覆蓋']) {
              if(!entryText.includes(required)) throw new Error('Missing separated entry output: '+required+'\n'+entryText);
            }
            if(!entryText.includes('拉回入場區') && !entryText.includes('60')) throw new Error('Entry output must show either a numeric first zone or the 60-bar price-structure blocker:\n'+entryText);
            if(!entryText.includes('9+3 完整加權分數')&&!entryText.includes('已驗證部分方向分數')) throw new Error('Missing truthful 9+3 score label:\n'+entryText);
            console.log('PASS: single-stock 9+3 entry path shows weighted decision without forcing a fake price');

            // Sector five-per-industry research journey.
            await page.locator('#findBtn').click({timeout:10000});
            await page.locator('#scanBtn').click({timeout:10000});
            await page.waitForFunction(() => {
              const t=document.querySelector('#top10')?.innerText||'';
              return t.includes('各類股近期績優研究標的') || t.includes('目前無法形成類股候選');
            }, null, {timeout:15000});
            const sectorText=await page.locator('#top10').innerText();
            if(sectorText.includes('目前無法形成類股候選')) throw new Error('Sector research journey failed:\n'+sectorText);
            if(!sectorText.includes('每一類股最多 5 檔')) throw new Error('Missing sector cap statement:\n'+sectorText);
            const sectorCounts=await page.locator('#top10 details.source-note').evaluateAll(ds=>ds.map(d=>d.querySelectorAll('.item').length));
            if(!sectorCounts.length || sectorCounts.some(n=>n<1||n>5)) throw new Error('Invalid per-sector candidate counts: '+JSON.stringify(sectorCounts));
            console.log('PASS: sector research returned 1-5 candidates per visible industry');
            const layerDiag = await page.evaluate(async () => {
              const race = async (label, p, ms=3000) => {
                const t0 = Date.now();
                try {
                  const v = await Promise.race([
                    Promise.resolve(p),
                    new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), ms))
                  ]);
                  return {label, ok:true, ms:Date.now()-t0, summary:Array.isArray(v)?('array:'+v.length):(v&&typeof v==='object'?Object.keys(v).slice(0,8):String(v))};
                } catch (e) {
                  return {label, ok:false, ms:Date.now()-t0, error:String(e&&e.message||e)};
                }
              };
              const out=[];
              out.push(await race('resolver.resolve', window.StockLabTickerResolver?.resolve?.('2454')));
              out.push(await race('resolver.loadUniverse', window.StockLabTickerResolver?.loadUniverse?.()));
              out.push(await race('sameOrigin.latest', window.StockLabSameOrigin?.latest?.('2454','TWSE')));
              if (window.StockLabTaiwan?.loadFactors) out.push(await race('taiwan.loadFactors', window.StockLabTaiwan.loadFactors()));
              if (window.STOCKLAB_RUNTIME?.gates?.licensedHistoricalOHLC===true && window.StockLabLicensedHistory?.load) out.push(await race('licensedHistory.load', window.StockLabLicensedHistory.load({code:'2454',market:'TWSE',minimumBars:1}))); else out.push({label:'licensedHistory.load',ok:false,skipped:true,error:'runtime gate disabled'});
              return out;
            });
            console.log('layer-diagnostics', JSON.stringify(layerDiag));
            await page.locator('#holdBtn').click({timeout:10000});
            console.log('stage: hold-opened');
            await page.locator('#holdTicker').fill('2454');
            await page.locator('#holdAvgCost').fill('1000');
            await page.locator('#holdShares').fill('100');
            await page.locator('#holdBuyTime').fill('2026-09-01T10:00');

            console.log('stage: fields-filled');
            await page.locator('#holdAnalyzeBtn').click({timeout:10000});
            console.log('stage: analyze-clicked');

            await page.waitForFunction(() => {
              const box = document.querySelector('#holdResult');
              if (!box) return false;
              const t = box.innerText || '';
              return t.includes('目前持倉判斷') || t.includes('持倉分析失敗');
            }, null, { timeout: 15000 });
            console.log('stage: result-rendered');

            const result = await page.locator('#holdResult').innerText();

            if (result.includes('持倉分析失敗')) {
              throw new Error('Live holding journey reached controlled failure instead of usable result:\n' + result);
            }
            for (const required of ['聯發科／2454','成本均價','目前持有股數','目前部位總成本','首次買入時間','目前建議動作','最新已驗證收盤']) {
              if (!result.includes(required)) throw new Error('Missing live holding output: ' + required + '\n' + result);
            }
            if (!result.includes('100,000')) throw new Error('Derived total cost was not shown correctly:\n' + result);
            for (const required of ['9+3 證據層','結構風險線','出場／減碼條件','停利／壓力參考']) {
              if (!result.includes(required)) throw new Error('Missing 9+3 holding output: ' + required + '\n' + result);
            }
            if (result.includes('不足價格模型最低 60 根') && !/結構風險線\s*—/.test(result)) throw new Error('Insufficient legal history must not emit a fake structural risk line:\n' + result);
            if (errors.length) throw new Error('Browser runtime errors:\n' + errors.join('\n'));

            console.log('PASS: live mobile holding journey produced a usable result');
            console.log(result);
            process.exitCode = 0;
            } finally {
              if (browser) await browser.close().catch(()=>{});
            }
          })().then(()=>process.exit(process.exitCode||0)).catch(async err => {
            console.error(err);
            process.exit(1);
          });
          NODE
